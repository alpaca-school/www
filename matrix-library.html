            dateAdded: "2026-07-01",
            recommended: false,

          {

            title: "企業冠プロジェクト（B2B実務受託）",
            url: "#",
            subjectLabel: "実務・自立",
            grades: ["高校生・大人"],
            subjects: ["総合"],
            mi: "徳",
            capital: "経済資本",
            ladderStep: "上級",
            status: "coming",
            emoji: "🤝",
            dateAdded: "2026-07-01",
            recommended: false,
          },
        ];

        const GRADES = ["小3", "小4", "小5", "小6", "中学生", "高校生・大人"];
        const SUBJECTS = ["国語", "算数", "理科", "社会", "生活", "家庭科", "図画工作", "総合", "特別活動", "技術・情報"];
        const MI_LIST = [
          { key: "智", label: "智（論理・言語）" },
          { key: "徳", label: "徳（対人・内省）" },
          { key: "体", label: "体（音楽・運動）" },
          { key: "感", label: "感（視覚空間・博物学）" },
        ];
        const CAPITALS = [
          { key: "文化資本", color: "orange" },
          { key: "社会関係資本", color: "cyan" },
          { key: "経済資本", color: "emerald" },
        ];

        const capitalColorClasses = {
          orange: { chipOn: "bg-orange-500 text-white border-orange-500", chipOff: "bg-white dark:bg-gray-800 text-orange-700 dark:text-orange-300 border-orange-300 dark:border-orange-700", badge: "bg-orange-100 dark:bg-orange-900 text-orange-700 dark:text-orange-200" },
          cyan: { chipOn: "bg-cyan-500 text-white border-cyan-500", chipOff: "bg-white dark:bg-gray-800 text-cyan-700 dark:text-cyan-300 border-cyan-300 dark:border-cyan-700", badge: "bg-cyan-100 dark:bg-cyan-900 text-cyan-700 dark:text-cyan-200" },
          emerald: { chipOn: "bg-emerald-500 text-white border-emerald-500", chipOff: "bg-white dark:bg-gray-800 text-emerald-700 dark:text-emerald-300 border-emerald-300 dark:border-emerald-700", badge: "bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-200" },
          purple: { chipOn: "bg-purple-500 text-white border-purple-500", chipOff: "bg-white dark:bg-gray-800 text-purple-700 dark:text-purple-300 border-purple-300 dark:border-purple-700", badge: "bg-purple-100 dark:bg-purple-900 text-purple-700 dark:text-purple-200" },
          teal: { chipOn: "bg-teal-500 text-white border-teal-500", chipOff: "bg-white dark:bg-gray-800 text-teal-700 dark:text-teal-300 border-teal-300 dark:border-teal-700", badge: "bg-teal-100 dark:bg-teal-900 text-teal-700 dark:text-teal-200" },
        };

        function Chip({ label, active, onClick, colorClasses }) {
          const cls = active ? colorClasses.chipOn : colorClasses.chipOff;
          return (
            <button
              onClick={onClick}
              className={`px-3 py-1.5 rounded-full text-xs font-bold border transition ${cls}`}
            >
              {label}
            </button>
          );
        }

        function MaterialCard({ item }) {
          const cap = CAPITALS.find(c => c.key === item.capital);
          const colorClasses = capitalColorClasses[cap.color];
          const isPublished = item.status === "published";
          const CardInner = (
            <div className={`h-full flex flex-col gap-3 p-5 rounded-2xl border-2 bg-white dark:bg-gray-800 shadow-sm transition ${isPublished ? "hover:shadow-md hover:-translate-y-0.5 cursor-pointer border-gray-200 dark:border-gray-700" : "border-dashed border-gray-300 dark:border-gray-600 opacity-70"}`}>
              <div className="flex items-start justify-between gap-2">
                <span className="text-3xl">{item.emoji}</span>
                {!isPublished && (
                  <span className="px-2 py-0.5 text-xs font-bold rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 dark:text-gray-400 whitespace-nowrap">準備中</span>
                )}
              </div>
              <h3 className="font-bold text-gray-800 dark:text-gray-100 leading-snug">{item.title}</h3>
              <p className="text-xs text-gray-500 dark:text-gray-400">{item.subjectLabel}</p>
              <div className="mt-auto flex flex-wrap gap-1.5">
                <span className={`px-2 py-0.5 text-xs font-bold rounded-full ${colorClasses.badge}`}>{item.capital}</span>
                <span className="px-2 py-0.5 text-xs font-bold rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">{item.ladderStep}</span>
                <span className="px-2 py-0.5 text-xs font-bold rounded-full bg-teal-100 dark:bg-teal-900 text-teal-700 dark:text-teal-200">{item.mi}</span>
                {item.grades.map(g => (
                  <span key={g} className="px-2 py-0.5 text-xs font-bold rounded-full bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300">{g}</span>
                ))}
              </div>
            </div>
          );
          return isPublished
            ? <a href={item.url} className="block h-full">{CardInner}</a>
            : <div className="h-full">{CardInner}</div>;
        }

        // 新着バナー：更新日が新しい順に、数秒ごとに自動で切り替わる帯
        function UpdateBanner({ items }) {
          const [index, setIndex] = useState(0);
          const recent = useMemo(() => (
            [...items].sort((a, b) => b.dateAdded.localeCompare(a.dateAdded)).slice(0, 5)
          ), [items]);

          useEffect(() => {
            if (recent.length === 0) return;
            const timer = setInterval(() => setIndex(i => (i + 1) % recent.length), 3500);
            return () => clearInterval(timer);
          }, [recent]);

          if (recent.length === 0) return null;
          const current = recent[index];

          return (
            <div className="bg-orange-500 dark:bg-orange-700 text-white">
              <div className="max-w-6xl mx-auto px-4 py-2 flex items-center gap-3 overflow-hidden">
                <span className="text-xs font-bold bg-white/20 rounded-full px-2 py-0.5 whitespace-nowrap">🆕 新着</span>
                <a href={current.url === "#" ? undefined : current.url} className="text-sm font-bold truncate flex-1 hover:underline">
                  {current.emoji} {current.title}（{current.dateAdded}）
                </a>
                <div className="flex gap-1 shrink-0">
                  {recent.map((r, i) => (
                    <span key={r.id} className={`w-1.5 h-1.5 rounded-full ${i === index ? "bg-white" : "bg-white/40"}`} />
                  ))}
                </div>
              </div>
            </div>
          );
        }

        function Sidebar({ selectedGrades, setSelectedGrades, selectedSubjects, setSelectedSubjects, selectedMi, setSelectedMi, toggle }) {
          return (
            <aside className="w-full lg:w-56 shrink-0 space-y-6">
              <div>
                <p className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2">学年・年齢</p>
                <div className="flex flex-wrap gap-1.5">
                  {GRADES.map(g => (
                    <Chip key={g} label={g} active={selectedGrades.includes(g)}
                      onClick={() => toggle(selectedGrades, setSelectedGrades, g)}
                      colorClasses={capitalColorClasses.orange} />
                  ))}
                </div>
              </div>
              <div>
                <p className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2">多重知能（知能の窓）</p>
                <div className="flex flex-wrap gap-1.5">
                  {MI_LIST.map(m => (
                    <Chip key={m.key} label={m.label} active={selectedMi.includes(m.key)}
                      onClick={() => toggle(selectedMi, setSelectedMi, m.key)}
                      colorClasses={capitalColorClasses.teal} />
                  ))}
                </div>
              </div>
              <div>
                <p className="text-xs font-bold text-gray-500 dark:text-gray-400 mb-2">関連教科</p>
                <div className="flex flex-wrap gap-1.5">
                  {SUBJECTS.map(s => (
                    <Chip key={s} label={s} active={selectedSubjects.includes(s)}
                      onClick={() => toggle(selectedSubjects, setSelectedSubjects, s)}
                      colorClasses={capitalColorClasses.purple} />
                  ))}
                </div>
              </div>
            </aside>
          );
        }

        function App() {
          const [selectedGrades, setSelectedGrades] = useState([]);
          const [selectedSubjects, setSelectedSubjects] = useState([]);
          const [selectedMi, setSelectedMi] = useState([]);
          const [searchQuery, setSearchQuery] = useState("");
          const [darkMode, setDarkMode] = useState(false);

          const toggle = (list, setList, value) => {
            setList(list.includes(value) ? list.filter(v => v !== value) : [...list, value]);
          };

          const filtered = useMemo(() => {
            const q = searchQuery.trim().toLowerCase();
            return MATERIALS.filter(item => {
              const gradeOk = selectedGrades.length === 0 || item.grades.some(g => selectedGrades.includes(g));
              const subjectOk = selectedSubjects.length === 0 || item.subjects.some(s => selectedSubjects.includes(s));
              const miOk = selectedMi.length === 0 || selectedMi.includes(item.mi);
              const searchOk = q === "" || item.title.toLowerCase().includes(q) || item.subjectLabel.toLowerCase().includes(q);
              return gradeOk && subjectOk && miOk && searchOk;
            });
          }, [selectedGrades, selectedSubjects, selectedMi, searchQuery]);

          const recommended = useMemo(() => MATERIALS.filter(m => m.recommended && m.status === "published"), []);

          const hasFilter = selectedGrades.length > 0 || selectedSubjects.length > 0 || selectedMi.length > 0 || searchQuery.trim() !== "";
          const resetAll = () => { setSelectedGrades([]); setSelectedSubjects([]); setSelectedMi([]); setSearchQuery(""); };

          return (
            <div className={darkMode ? "dark" : ""}>
            <div className="bg-gradient-to-b from-sky-100 to-orange-50 dark:from-gray-900 dark:to-gray-900 min-h-screen transition-colors">

              <UpdateBanner items={MATERIALS} />

              <div className="sticky top-0 z-10 bg-white/90 dark:bg-gray-800/90 backdrop-blur border-b border-gray-200 dark:border-gray-700">
                <div className="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">
                  <span className="font-extrabold text-gray-800 dark:text-gray-100 whitespace-nowrap">🦙 アルパカすく〜る</span>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="教材を検索（タイトル・教科）"
                    className="flex-1 px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
                  />
                  <button
                    onClick={() => setDarkMode(d => !d)}
                    aria-label="ライト/ダークモード切り替え"
                    className="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-bold hover:bg-gray-50 dark:hover:bg-gray-600 transition"
                  >
                    {darkMode ? "☀️" : "🌙"}
                  </button>
                </div>
              </div>

              <div className="max-w-6xl mx-auto px-4 py-8">
                <header className="mb-8 text-center">
                  <h1 className="text-3xl md:text-4xl font-extrabold text-gray-800 dark:text-gray-100 mb-4">アルパカすく〜る 🦙</h1>
                  <p className="text-lg text-gray-700 dark:text-gray-300 leading-relaxed">
                    「やってみたい」を、<br />勉強・生活・仕事・社会につながる形で試せる場所。
                  </p>
                  <p className="mt-4 text-sm text-gray-600 dark:text-gray-400 leading-relaxed">
                    学ぶ・つくる・つながる。<br />
                    子どもから大人まで、沖縄の雑学を学ぶオンライン学び舎。
                  </p>
                </header>

                {recommended.length > 0 && (
                  <section className="mb-10">
                    <p className="text-sm font-bold text-orange-500 mb-3">🏆 おすすめ教材</p>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      {recommended.map(item => <MaterialCard key={item.id} item={item} />)}
                    </div>
                  </section>
                )}

                <div className="flex flex-col lg:flex-row gap-8">
                  <Sidebar
                    selectedGrades={selectedGrades} setSelectedGrades={setSelectedGrades}
                    selectedSubjects={selectedSubjects} setSelectedSubjects={setSelectedSubjects}
                    selectedMi={selectedMi} setSelectedMi={setSelectedMi}
                    toggle={toggle}
                  />

                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between mb-4">
                      <p className="text-sm text-gray-500 dark:text-gray-400">{filtered.length}件の教材</p>
                      {hasFilter && (
                        <button onClick={resetAll} className="text-sm font-bold text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 underline">絞り込みを解除</button>
                      )}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                      {filtered.map(item => <MaterialCard key={item.id} item={item} />)}
                    </div>

                    {filtered.length === 0 && (
                      <p className="text-center text-gray-400 dark:text-gray-500 py-16">条件に合う教材が見つかりませんでした。</p>
                    )}
                  </div>
                </div>

                <section className="mt-12">
                  <div className="bg-white dark:bg-gray-800 border-2 border-dashed dark:border-gray-700 rounded-xl p-6 text-center">
                    <h3 className="font-bold text-lg mb-2 text-gray-800 dark:text-gray-100">学んだことを、次の一歩へ</h3>
                    <p className="text-sm text-gray-600 dark:text-gray-400 mb-4">
                      体験したことは、表現を通して社会とつながっていきます。
                    </p>
                    <a href="https://furima.ryukyu-tane.com"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-emerald-600 transition inline-block">
                      文芸フリマで表現してみる
                    </a>
                  </div>
                </section>

                <section className="mt-6">
                  <div className="bg-white dark:bg-gray-800 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl p-8 text-center">
                    <p className="mb-4 text-gray-700 dark:text-gray-300">
                      学びの中で使った教材や記録をまとめています。
                    </p>
                    <a href="https://universe.tea-under.club/"
                      className="inline-block px-6 py-2 bg-blue-50 dark:bg-blue-900 text-blue-900 dark:text-blue-200 rounded-full font-bold hover:bg-blue-100 dark:hover:bg-blue-800 transition">
                      てぃあんだぁクラブ universe
                    </a>
                  </div>
                </section>
              </div>

              <footer className="bg-gray-800 text-white p-6 text-sm mt-12">
                <div className="max-w-6xl mx-auto">
                  <p>
                    仕事は、誰かとのご縁。<br />
                    アルパカすく〜るは、その入口をつくります。
                    <br />
                    このコンテンツは、ご自宅から快適に学習できるよう設計されています。車椅子をご利用の方、高齢の方、外出が難しい方など、すべての方が楽しめるよう善処します。
                  </p>
