        const GRADES = ["小3", "小4", "小5", "小6", "中学生", "高校生・大人"];

        // 新着バナー：更新日が新しい順に、数秒ごとに自動で切り替わる帯

        function seriesGroupKey(item) {
          const m = item.title.match(/[（(]([^（）()]+?)\s*ep\d+[：:][^（）()]*[）)]/);
          if (m) return m[1].trim();
          return item.title;
        }

        function UpdateBanner({ items }) {
          const [index, setIndex] = useState(0);
          const grouped = useMemo(() => {
            const byDay = {};
            [...items]

              .forEach(item => {
                const key = `${item.dateAdded}__${seriesGroupKey(item)}`;
                if (!byDay[key]) byDay[key] = { ...item, count: 0 };
                byDay[key].count += 1;
              });
            return Object.values(byDay).slice(0, 5);
          }, [items]);

          useEffect(() => {
            if (grouped.length === 0) return;
            const timer = setInterval(() => setIndex(i => (i + 1) % grouped.length), 3500);
            return () => clearInterval(timer);
          }, [grouped]);

          if (grouped.length === 0) return null;
          const current = grouped[index];
          const label = current.count > 1
            ? `${seriesGroupKey(current)}が追加されました（全${current.count}話）`
            : `${current.emoji} ${current.title}`;

                </div>

          );

        // 教材id -> テーマkey の対応表。series-nav-data.js の SERIES_META を正とし、

          return map;

          return materials.filter((item) =>

          );
        }

            return () => { active = false; };

          const toggle = (list, setList, value) => {

          };

          const visibleMaterials = useMemo(() => filterVisible(MATERIALS, catalog), [catalog]);

              const gradeOk = selectedGrades.length === 0 || item.grades.some(g => selectedGrades.includes(g));
              const subjectOk = selectedSubjects.length === 0 || item.subjects.some(s => selectedSubjects.includes(s));
              const miOk = selectedMi.length === 0 || selectedMi.includes(item.mi);
              const searchOk = q === "" || item.title.toLowerCase().includes(q) || item.subjectLabel.toLowerCase().includes(q);
              return gradeOk && subjectOk && miOk && searchOk;
            });
          }, [visibleMaterials, selectedGrades, selectedSubjects, selectedMi, searchQuery]);

          const recommended = useMemo(() => (
            visibleMaterials
              .filter(m => m.recommended && m.status === "published")
              .sort((a, b) => b.dateAdded.localeCompare(a.dateAdded))
              .slice(0, 8)
          ), [visibleMaterials]);

          const hasFilter = selectedGrades.length > 0 || selectedSubjects.length > 0 || selectedMi.length > 0 || searchQuery.trim() !== "";
          const resetAll = () => { setSelectedGrades([]); setSelectedSubjects([]); setSelectedMi([]); setSearchQuery(""); };

          return (
            <div className={darkMode ? "dark" : ""}>
            <div className="bg-gradient-to-b from-sky-100 to-orange-50 dark:from-gray-900 dark:to-gray-900 min-h-screen transition-colors">

              <UpdateBanner items={visibleMaterials} />

              <div className="sticky top-0 z-10 bg-white/90 dark:bg-gray-800/90 backdrop-blur border-b border-gray-200 dark:border-gray-700">
                <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
                  <span className="font-extrabold text-gray-800 dark:text-gray-100 whitespace-nowrap">🦙 アルパカすく〜る</span>
                  <nav className="flex flex-wrap items-center gap-1 text-xs sm:text-sm font-bold whitespace-nowrap">
                    <a href="./matrix-library.html" className="px-2 py-1 rounded text-orange-600 dark:text-orange-400">教材一覧</a>
                    <a href="./series-guide.html" className="px-2 py-1 rounded text-gray-600 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition">テーマ一覧</a>
                    <a href="./characters.html" className="px-2 py-1 rounded text-gray-600 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition">キャラクター図鑑</a>
                    <a href="./mi-shindan.html" className="px-2 py-1 rounded text-gray-600 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition">学びルート診断</a>
                    <a href="./concept.html" className="px-2 py-1 rounded text-gray-600 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition">このサイトについて</a>
                    <a href="./account.html" className="px-2 py-1 rounded text-gray-600 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition">マイページ</a>
                  </nav>
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    placeholder="教材を検索（タイトル・教科）"
                    className="flex-1 min-w-[140px] px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-800 dark:text-gray-100 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
                  />
                  <button
                    onClick={() => setDarkMode(d => !d)}
                    aria-label="ライト/ダークモード切り替え"
                    className="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-bold hover:bg-gray-50 dark:hover:bg-gray-600 transition"
                  >
                    {darkMode ? "☀️" : "🌙"}
                  </button>
                </div>
              </div>

              <div className="max-w-6xl mx-auto px-4 py-8">
                <header className="mb-8 text-center">
                  <h1 className="text-3xl md:text-4xl font-extrabold text-gray-800 dark:text-gray-100 mb-4">アルパカすく〜る 🦙</h1>
                  <p className="text-lg text-gray-700 dark:text-gray-300 leading-relaxed">
                    沖縄を教材に、<br />勉強と暮らしの力を育てる。
                  </p>
                  <p className="mt-4 text-sm text-gray-600 dark:text-gray-400 leading-relaxed">
                    子どもから大人まで通える、<br />
                    オンライン学び舎。
                  </p>
                </header>

                {recommended.length > 0 && !hasFilter && (
                  <section className="mb-10">
                    <p className="text-sm font-bold text-orange-500 mb-3">🏆 おすすめ教材</p>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      {recommended.map(item => <MaterialCard key={item.id} item={item} />)}
                    </div>
                  </section>
                )}

                <div className="flex flex-col lg:flex-row gap-8">
                  <Sidebar
                    selectedGrades={selectedGrades} setSelectedGrades={setSelectedGrades}
                    selectedSubjects={selectedSubjects} setSelectedSubjects={setSelectedSubjects}
                    selectedMi={selectedMi} setSelectedMi={setSelectedMi}
                    toggle={toggle}
                    open={filterOpen} setOpen={setFilterOpen}
                  />

                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between mb-4">
                      <p className="text-sm text-gray-500 dark:text-gray-400">{filtered.length}件の教材</p>
                      {hasFilter && (
                        <button onClick={resetAll} className="text-sm font-bold text-gray-400 dark:text-gray-500 hover:text-gray-600 dark:hover:text-gray-300 underline">絞り込みを解除</button>
                      )}
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4">
                      {filtered.map(item => <MaterialCard key={item.id} item={item} />)}
                    </div>

                    {filtered.length === 0 && (
                      <p className="text-center text-gray-400 dark:text-gray-500 py-16">条件に合う教材が見つかりませんでした。</p>
                    )}
                  </div>
                </div>

                <section className="mt-12">
                  <div className="bg-white dark:bg-gray-800 border-2 border-dashed dark:border-gray-700 rounded-xl p-6 text-center">
                    <h3 className="font-bold text-lg mb-2 text-gray-800 dark:text-gray-100">学んだことを、次の一歩へ</h3>
                    <p className="text-sm text-gray-600 dark:text-gray-400 mb-4">
                      体験したことは、表現を通して社会とつながっていきます。
                    </p>
                    <a href="https://furima.ryukyu-tane.com"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="bg-emerald-500 text-white px-4 py-2 rounded-lg font-bold hover:bg-emerald-600 transition inline-block">
                      文芸フリマで表現してみる
                    </a>
                  </div>
                </section>

                <section className="mt-6">
                  <div className="bg-white dark:bg-gray-800 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-xl p-8 text-center">
                    <p className="mb-4 text-gray-700 dark:text-gray-300">
                      学びの中で使った教材や記録をまとめています。
                    </p>
                    <a href="https://universe.tea-under.club/"
                      className="inline-block px-6 py-2 bg-blue-50 dark:bg-blue-900 text-blue-900 dark:text-blue-200 rounded-full font-bold hover:bg-blue-100 dark:hover:bg-blue-800 transition">
                      てぃあんだぁクラブ universe
                    </a>
                  </div>
                </section>
              </div>

              <footer className="bg-gray-800 text-white p-6 text-sm mt-12">
                <div className="max-w-6xl mx-auto">
                  <p>
                    仕事は、誰かとのご縁。<br />
                    アルパカすく〜るは、その入口をつくります。
                    <br />
                    このコンテンツは、ご自宅から快適に学習できるよう設計されています。車椅子をご利用の方、高齢の方、外出が難しい方など、すべての方が楽しめるよう善処します。
                  </p>
                  <a
                    href="./concept.html"
                    className="inline-block mt-2 underline hover:text-emerald-300"
                  >
                    ▶ この学びの設計思想を読む
                  </a>
                </div>
              </footer>
            </div>
            </div>
          );
        }

        createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
