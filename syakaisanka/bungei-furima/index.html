<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="文芸フリマの運営を通して、気づく・案内する・人につなぐなどの社会参加スキルを学ぶ教材です。">
  <title>文芸フリマ運営編 | アルパカすく〜る</title>
  <script src="../event-program-data.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
    p, li, label, button, input, textarea { word-break: normal; overflow-wrap: anywhere; line-break: strict; }
    :focus-visible { outline: 3px solid #0f766e; outline-offset: 3px; }
    .print-sheet { position: fixed; left: -9999px; top: 0; }
    @page { size: A4 portrait; margin: 11mm; }
    @media print {
      body * { visibility: hidden; }
      .print-sheet.print-active, .print-sheet.print-active * { visibility: visible; }
      .print-sheet.print-active { position: absolute; left: 0; top: 0; width: 100%; }
      .avoid-break { break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-gradient-to-b from-orange-50 via-white to-teal-50 text-slate-800">
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;
    const { createRoot } = ReactDOM;
    const program = window.SOCIAL_PARTICIPATION_PROGRAMS["bungei-furima"];
    const STORAGE_KEY = "alpaca-social-participation-bungei-v1";

    const emptyPlan = { name: "", learningDate: "", plannedRoles: [], strengths: "", worries: "", support: "", supportPerson: "", breakMethod: "", goal: "" };
    const emptyReflection = { actions: [], actualRoles: [], happiest: "", difficult: "", helpedBy: "", nextActivity: "", eventDate: "", activityMinutes: "", verifiedBy: "" };
    const safeRead = () => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (_error) { return {}; } };

    const Field = ({ id, label, value, onChange, placeholder = "", required = false, rows = 3, maxLength = 300 }) => <div>
      <label htmlFor={id} className="block text-sm font-extrabold text-slate-700">{label}{required && <span className="ml-1 text-red-600">必須</span>}</label>
      <textarea id={id} rows={rows} maxLength={maxLength} required={required} value={value} onChange={(event) => onChange(event.target.value)} placeholder={placeholder} className="mt-2 w-full rounded-xl border border-slate-300 bg-white p-3 text-base focus:border-teal-600"></textarea>
      <p className="mt-1 text-right text-xs text-slate-400">{value.length}/{maxLength}</p>
    </div>;

    function App() {
      const initial = safeRead();
      const [completedLessons, setCompletedLessons] = useState(initial.completedLessons || []);
      const [plan, setPlan] = useState({ ...emptyPlan, ...(initial.plan || {}) });
      const [reflection, setReflection] = useState({ ...emptyReflection, ...(initial.reflection || {}) });
      const [notice, setNotice] = useState("");
      const [printTarget, setPrintTarget] = useState("");

      useEffect(() => {
        const refresh = () => setCompletedLessons(safeRead().completedLessons || []);
        window.addEventListener("focus", refresh);
        window.addEventListener("storage", refresh);
        return () => { window.removeEventListener("focus", refresh); window.removeEventListener("storage", refresh); };
      }, []);

      const saveData = (part, value, message) => {
        const current = safeRead();
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...current, [part]: value, updatedAt: new Date().toISOString() }));
        setNotice(message);
        window.setTimeout(() => setNotice(""), 3500);
      };
      const setPlanValue = (key, value) => setPlan((current) => ({ ...current, [key]: value }));
      const setReflectionValue = (key, value) => setReflection((current) => ({ ...current, [key]: value }));
      const toggle = (items, value) => items.includes(value) ? items.filter((item) => item !== value) : [...items, value];
      const allLessonsDone = program.lessons.every((item) => completedLessons.includes(item.id));

      const skills = useMemo(() => {
        const selected = program.reflectionActions.filter((item) => reflection.actions.includes(item.id));
        return Array.from(new Set(selected.flatMap((item) => item.skills)));
      }, [reflection.actions]);
      const selectedActionLabels = program.reflectionActions.filter((item) => reflection.actions.includes(item.id)).map((item) => item.label);
      const certificateReady = Boolean(plan.name.trim() && reflection.eventDate && Number(reflection.activityMinutes) > 0 && reflection.actualRoles.length && reflection.verifiedBy.trim());
      const reportReady = Boolean(reflection.actualRoles.length || reflection.actions.length || reflection.happiest.trim() || reflection.difficult.trim() || reflection.nextActivity.trim());

      const print = (target) => {
        setPrintTarget(target);
        window.setTimeout(() => window.print(), 50);
      };
      useEffect(() => {
        const clear = () => setPrintTarget("");
        window.addEventListener("afterprint", clear);
        return () => window.removeEventListener("afterprint", clear);
      }, []);

      return <div className="min-h-screen">
        <header className="border-b border-orange-100 bg-white/95">
          <div className="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-3">
            <a href="../" className="font-black text-orange-600">← 社会参加シリーズ</a>
            <nav className="flex gap-1 text-sm font-bold" aria-label="主なメニュー"><a href="../../matrix-library.html" className="rounded-lg px-3 py-2 text-slate-600 hover:bg-orange-50">教材一覧</a><a href="../../account.html" className="rounded-lg px-3 py-2 text-slate-600 hover:bg-orange-50">マイページ</a></nav>
          </div>
        </header>

        <main className="mx-auto max-w-5xl px-4 py-8 sm:py-12">
          <section className="rounded-3xl border border-orange-200 bg-white p-6 shadow-xl shadow-orange-100 sm:p-9">
            <p className="text-sm font-black text-teal-700">社会参加シリーズ</p>
            <h1 className="mt-2 text-3xl font-black leading-tight text-slate-900 sm:text-5xl">文芸フリマ運営編 📚🐈</h1>
            <p className="mt-4 text-xl font-bold leading-8 text-orange-800">{program.theme}</p>
            <p className="mt-5 max-w-3xl leading-8 text-slate-600">地域イベントで、困っている人に気づき、案内し、会場を整え、人につなぐ力を学びます。休むことや助けを求めることも大切な力です。</p>
            <div className="mt-6 rounded-2xl bg-amber-50 p-5"><p className="font-bold text-amber-900">2026年度サブテーマ</p><p className="mt-1 leading-7 text-amber-950">{program.subtheme}</p><p className="mt-2 text-sm text-amber-800">猫は学習の必須テーマではありません。「好きなものを入口に人とつながる」例として扱います。</p></div>
          </section>

          <nav className="mt-7 grid grid-cols-2 gap-2 text-center text-sm font-bold sm:grid-cols-4" aria-label="ページ内メニュー">
            <a href="#lessons" className="rounded-xl bg-teal-700 px-3 py-3 text-white">1. オンライン予習</a><a href="#plan" className="rounded-xl bg-orange-500 px-3 py-3 text-white">2. 参加プラン</a><a href="#reflection" className="rounded-xl bg-indigo-600 px-3 py-3 text-white">3. 振り返り</a><a href="#outputs" className="rounded-xl bg-slate-700 px-3 py-3 text-white">4. 記録を出力</a>
          </nav>

          <section id="lessons" className="scroll-mt-4 py-12" aria-labelledby="lessons-heading">
            <div className="flex flex-wrap items-end justify-between gap-3"><div><p className="text-sm font-black text-teal-700">Step 1</p><h2 id="lessons-heading" className="text-2xl font-black text-slate-900 sm:text-3xl">オンラインで5つのLessonを学ぶ</h2></div><span className="rounded-full bg-teal-100 px-4 py-2 text-sm font-bold text-teal-900">{completedLessons.filter((id) => program.lessons.some((lesson) => lesson.id === id)).length} / 5 完了</span></div>
            <div className="mt-6 grid gap-4 md:grid-cols-2">
              {program.lessons.map((lesson) => {
                const done = completedLessons.includes(lesson.id);
                return <article key={lesson.id} className={`rounded-2xl border-2 bg-white p-5 shadow-sm ${done ? "border-teal-400" : "border-slate-200"}`}>
                  <div className="flex items-start gap-4"><span className="text-4xl" aria-hidden="true">{lesson.emoji}</span><div className="min-w-0 flex-1"><p className="text-xs font-black text-orange-600">Lesson {lesson.number}</p><h3 className="mt-1 text-lg font-black text-slate-900">{lesson.title}</h3><p className={`mt-2 text-sm font-bold ${done ? "text-teal-700" : "text-slate-500"}`}>{done ? "✓ この端末で完了" : "未完了"}</p></div></div>
                  <a href={`./lesson.html?lesson=${lesson.number}`} className="mt-4 inline-flex min-h-11 w-full items-center justify-center rounded-xl bg-orange-500 px-4 py-2 font-bold text-white hover:bg-orange-600">{done ? "もう一度学ぶ" : "Lessonをはじめる"}</a>
                </article>;
              })}
            </div>
          </section>

          <section id="plan" className="scroll-mt-4 rounded-3xl border border-orange-200 bg-white p-5 shadow-lg sm:p-8" aria-labelledby="plan-heading">
            <p className="text-sm font-black text-orange-600">Step 2</p><h2 id="plan-heading" className="mt-1 text-2xl font-black text-slate-900">わたしの文芸フリマ参加プラン</h2>
            {!allLessonsDone && <p className="mt-4 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm leading-7 text-amber-950">先に5つのLessonを学ぶと、当日の役割や休憩方法を考えやすくなります。入力は今から始めても大丈夫です。</p>}
            <div className="mt-6 grid gap-5">
              <div className="grid gap-4 sm:grid-cols-2"><div><label htmlFor="name" className="block text-sm font-extrabold">氏名またはニックネーム</label><input id="name" maxLength="80" value={plan.name} onChange={(event) => setPlanValue("name", event.target.value)} className="mt-2 w-full rounded-xl border border-slate-300 p-3" placeholder="公開ページには表示されません"/></div><div><label htmlFor="learning-date" className="block text-sm font-extrabold">学習日</label><input id="learning-date" type="date" value={plan.learningDate} onChange={(event) => setPlanValue("learningDate", event.target.value)} className="mt-2 w-full rounded-xl border border-slate-300 p-3"/></div></div>
              <fieldset><legend className="text-sm font-extrabold">当日やってみたい役割</legend><div className="mt-3 grid gap-2 sm:grid-cols-2">{program.roles.map((role) => <label key={role} className="flex min-h-12 cursor-pointer items-center gap-3 rounded-xl border border-slate-200 p-3 hover:bg-orange-50"><input type="checkbox" checked={plan.plannedRoles.includes(role)} onChange={() => setPlanValue("plannedRoles", toggle(plan.plannedRoles, role))} className="h-5 w-5 accent-orange-500"/><span>{role}</span></label>)}</div></fieldset>
              <Field id="strengths" label="自分の好き・得意" value={plan.strengths} onChange={(value) => setPlanValue("strengths", value)} placeholder="絵、本、猫、人と話す、整理する、静かな作業など"/>
              <Field id="worries" label="不安なこと" value={plan.worries} onChange={(value) => setPlanValue("worries", value)} placeholder="音、人混み、初めての場所、長い時間など"/>
              <Field id="support" label="大人に手伝ってほしいこと" value={plan.support} onChange={(value) => setPlanValue("support", value)}/>
              <Field id="support-person" label="困った時に相談する人" value={plan.supportPerson} onChange={(value) => setPlanValue("supportPerson", value)} placeholder="役割名でも大丈夫です（例：受付の大人スタッフ）"/>
              <Field id="break-method" label="自分が休憩したくなった時の方法" value={plan.breakMethod} onChange={(value) => setPlanValue("breakMethod", value)} placeholder="相談する言葉、合図、休む場所など"/>
              <Field id="goal" label="当日の小さな目標" value={plan.goal} onChange={(value) => setPlanValue("goal", value)} placeholder="一人にあいさつする、10分だけ受付を体験する、など"/>
              <div className="grid gap-2 sm:grid-cols-2"><button type="button" onClick={() => saveData("plan", plan, "参加プランをこの端末に保存しました。") } className="min-h-12 rounded-xl bg-teal-700 px-4 py-3 font-black text-white hover:bg-teal-800">この端末に保存する</button><button type="button" onClick={() => print("plan")} className="min-h-12 rounded-xl bg-yellow-500 px-4 py-3 font-black text-white hover:bg-yellow-600">印刷・PDF保存</button></div>
            </div>
          </section>

          <section className="my-10 rounded-2xl border border-teal-200 bg-teal-50 p-5 sm:p-6"><p className="text-sm font-black text-teal-700">Step 3</p><h2 className="mt-1 text-xl font-black text-teal-950">実際の文芸フリマで体験する</h2><p className="mt-3 leading-7 text-teal-950">役割は途中で変えても、休んでも大丈夫です。困ったときは、参加プランに書いた人や大人スタッフへつないでください。</p></section>

          <section id="reflection" className="scroll-mt-4 rounded-3xl border border-indigo-200 bg-white p-5 shadow-lg sm:p-8" aria-labelledby="reflection-heading">
            <p className="text-sm font-black text-indigo-600">Step 4・5</p><h2 id="reflection-heading" className="mt-1 text-2xl font-black text-slate-900">イベント後の振り返り</h2><p className="mt-3 leading-7 text-slate-600">本人の自己申告を大切にします。点数や順位にはしません。</p>
            <div className="mt-6 grid gap-5">
              <fieldset><legend className="text-sm font-extrabold">今日やったこと</legend><div className="mt-3 grid gap-2 sm:grid-cols-2">{program.reflectionActions.map((action) => <label key={action.id} className="flex min-h-12 cursor-pointer items-center gap-3 rounded-xl border border-slate-200 p-3 hover:bg-indigo-50"><input type="checkbox" checked={reflection.actions.includes(action.id)} onChange={() => setReflectionValue("actions", toggle(reflection.actions, action.id))} className="h-5 w-5 accent-indigo-600"/><span>{action.label}</span></label>)}</div></fieldset>
              <fieldset><legend className="text-sm font-extrabold">実際に体験した役割</legend><div className="mt-3 grid gap-2 sm:grid-cols-2">{program.roles.map((role) => <label key={role} className="flex min-h-12 cursor-pointer items-center gap-3 rounded-xl border border-slate-200 p-3 hover:bg-indigo-50"><input type="checkbox" checked={reflection.actualRoles.includes(role)} onChange={() => setReflectionValue("actualRoles", toggle(reflection.actualRoles, role))} className="h-5 w-5 accent-indigo-600"/><span>{role}</span></label>)}</div></fieldset>
              <Field id="happiest" label="一番うれしかったこと" value={reflection.happiest} onChange={(value) => setReflectionValue("happiest", value)}/><Field id="difficult" label="難しかったこと" value={reflection.difficult} onChange={(value) => setReflectionValue("difficult", value)}/><Field id="helped-by" label="誰かに助けてもらったこと" value={reflection.helpedBy} onChange={(value) => setReflectionValue("helpedBy", value)}/><Field id="next-activity" label="次にやってみたいこと" value={reflection.nextActivity} onChange={(value) => setReflectionValue("nextActivity", value)}/>
              <div className="grid gap-4 sm:grid-cols-3"><div><label htmlFor="event-date" className="text-sm font-extrabold">実施日</label><input id="event-date" type="date" value={reflection.eventDate} onChange={(event) => setReflectionValue("eventDate", event.target.value)} className="mt-2 w-full rounded-xl border border-slate-300 p-3"/></div><div><label htmlFor="minutes" className="text-sm font-extrabold">活動時間（分）</label><input id="minutes" type="number" min="1" max="1440" value={reflection.activityMinutes} onChange={(event) => setReflectionValue("activityMinutes", event.target.value)} className="mt-2 w-full rounded-xl border border-slate-300 p-3"/></div><div><label htmlFor="verified" className="text-sm font-extrabold">確認者名</label><input id="verified" maxLength="80" value={reflection.verifiedBy} onChange={(event) => setReflectionValue("verifiedBy", event.target.value)} className="mt-2 w-full rounded-xl border border-slate-300 p-3" placeholder="証明書の印刷に必要"/></div></div>
              <button type="button" onClick={() => saveData("reflection", reflection, "振り返りをこの端末に保存しました。") } className="min-h-12 rounded-xl bg-indigo-600 px-4 py-3 font-black text-white hover:bg-indigo-700">振り返りを保存する</button>
            </div>
          </section>

          <section className="mt-10 rounded-3xl border border-teal-200 bg-white p-5 shadow-lg sm:p-8" aria-labelledby="skills-heading"><p className="text-sm font-black text-teal-700">あなたは今日、こんな力を使いました</p><h2 id="skills-heading" className="mt-1 text-2xl font-black text-slate-900">社会参加スキル</h2>{skills.length ? <div className="mt-5 flex flex-wrap gap-2">{skills.map((skill) => <span key={skill} className="rounded-full border border-teal-300 bg-teal-50 px-4 py-2 font-bold text-teal-900">{skill}</span>)}</div> : <p className="mt-4 rounded-xl bg-slate-50 p-4 text-slate-600">振り返りで「今日やったこと」を選ぶと、使った力がここに表示されます。</p>}<p className="mt-5 text-sm leading-7 text-slate-500">これは資格や能力の判定ではありません。選んだ体験を、日常でも使える言葉へ置き換えたものです。</p></section>

          <section id="outputs" className="scroll-mt-4 py-12" aria-labelledby="outputs-heading"><p className="text-sm font-black text-slate-600">Step 6・7</p><h2 id="outputs-heading" className="mt-1 text-2xl font-black text-slate-900">活動記録を出力して、次を考える</h2><div className="mt-6 grid gap-4 md:grid-cols-2"><article className="rounded-2xl border border-slate-200 bg-white p-5"><h3 className="text-lg font-black">活動・ボランティア証明書</h3><p className="mt-2 text-sm leading-7 text-slate-600">氏名、実施日、活動時間、役割、確認者名がそろうと印刷できます。資格認定ではありません。</p><button type="button" disabled={!certificateReady} onClick={() => print("certificate")} className={`mt-4 min-h-12 w-full rounded-xl px-4 py-3 font-black ${certificateReady ? "bg-orange-500 text-white" : "bg-slate-200 text-slate-500"}`}>{certificateReady ? "証明書を印刷・PDF保存" : "必要項目と確認者名を入力してください"}</button><p className="mt-2 text-xs text-slate-500">発行主体：{program.event.certificateIssuer}</p></article><article className="rounded-2xl border border-slate-200 bg-white p-5"><h3 className="text-lg font-black">社会参加スキルレポート</h3><p className="mt-2 text-sm leading-7 text-slate-600">事前の参加プラン、当日の体験、使った力、助けてもらったこと、次の一歩を1枚にまとめます。</p><button type="button" disabled={!reportReady} onClick={() => print("report")} className={`mt-4 min-h-12 w-full rounded-xl px-4 py-3 font-black ${reportReady ? "bg-teal-700 text-white" : "bg-slate-200 text-slate-500"}`}>レポートを印刷・PDF保存</button></article></div></section>

          {notice && <div className="fixed bottom-4 left-1/2 z-50 w-[calc(100%-2rem)] max-w-md -translate-x-1/2 rounded-xl bg-slate-900 px-4 py-3 text-center text-sm font-bold text-white shadow-xl" role="status">{notice}</div>}
          <p className="mb-10 rounded-2xl bg-slate-100 p-5 text-sm leading-7 text-slate-600"><strong>個人情報について：</strong>このページの参加プランとイベント後記録は、この端末のブラウザ内だけに保存します。障がい、不登校などの属性は収集せず、証明書にも表示しません。共有端末では、入力後の取り扱いにご注意ください。</p>
        </main>

        <div className={`print-sheet ${printTarget === "plan" ? "print-active" : ""} w-[700px] bg-white p-8 text-black`}>
          <h1 className="border-b-2 border-black pb-2 text-2xl font-black">わたしの文芸フリマ参加プラン</h1><table className="mt-4 w-full text-sm"><tbody><tr><th className="w-44 py-2 text-left">氏名・ニックネーム</th><td>{plan.name || "＿＿＿＿＿＿＿＿＿＿"}</td></tr><tr><th className="py-2 text-left">教材名</th><td>社会参加シリーズ・文芸フリマ運営編</td></tr><tr><th className="py-2 text-left">学習日</th><td>{plan.learningDate || "＿＿年＿＿月＿＿日"}</td></tr></tbody></table>{[["当日やってみたい役割", plan.plannedRoles.join("、")],["自分の好き・得意",plan.strengths],["不安なこと",plan.worries],["大人に手伝ってほしいこと",plan.support],["困った時に相談する人",plan.supportPerson],["休憩したくなった時の方法",plan.breakMethod],["当日の小さな目標",plan.goal]].map(([label,value]) => <div key={label} className="avoid-break mt-3 rounded border border-black p-3"><p className="font-bold">{label}</p><p className="mt-1 min-h-10 whitespace-pre-wrap">{value || "（記入なし）"}</p></div>)}
        </div>

        <div className={`print-sheet ${printTarget === "certificate" ? "print-active" : ""} w-[700px] bg-white p-10 text-black`}>
          <div className="border-4 border-double border-slate-800 p-8"><p className="text-center text-sm">アルパカすく〜る 社会参加シリーズ</p><h1 className="mt-2 text-center text-3xl font-black">活動・ボランティア証明書</h1><p className="mt-8 text-right text-xl font-bold">{plan.name || "＿＿＿＿＿＿＿＿＿＿"} 様</p><p className="mt-8 text-base leading-8">地域イベントにおいて、受付・案内・環境整備・参加者サポート等の活動を体験したことを確認します。</p><table className="mt-6 w-full border-collapse text-sm"><tbody>{[["イベント名",program.event.name],["実施日",reflection.eventDate],["活動時間",`${reflection.activityMinutes || "＿＿"}分`],["主な活動内容",reflection.actualRoles.join("、") || "（記入なし）"],["学習した教材名","社会参加シリーズ・文芸フリマ運営編"],["発行日",new Date().toLocaleDateString("ja-JP")],["確認者",reflection.verifiedBy || "＿＿＿＿＿＿＿＿＿＿"],["発行主体",program.event.certificateIssuer]].map(([label,value]) => <tr key={label}><th className="w-40 border border-black p-2 text-left">{label}</th><td className="border border-black p-2">{value}</td></tr>)}</tbody></table><p className="mt-6 text-xs leading-6">※ 本証明書は活動体験を記録するものであり、避難所運営、介助その他の資格・能力を認定するものではありません。発行主体がTBDの間は確認用ドラフトです。</p></div>
        </div>

        <div className={`print-sheet ${printTarget === "report" ? "print-active" : ""} w-[700px] bg-white p-8 text-black`}>
          <h1 className="border-b-2 border-black pb-2 text-2xl font-black">アルパカすく〜る 社会参加スキルレポート</h1><table className="mt-4 w-full text-sm"><tbody><tr><th className="w-40 py-2 text-left">氏名・ニックネーム</th><td>{plan.name || "（記入なし）"}</td></tr><tr><th className="py-2 text-left">事前に学んだLesson</th><td>{program.lessons.filter((item) => completedLessons.includes(item.id)).map((item) => `Lesson ${item.number}`).join("、") || "（記録なし）"}</td></tr><tr><th className="py-2 text-left">当日やってみたかったこと</th><td>{plan.plannedRoles.join("、") || "（記入なし）"}</td></tr><tr><th className="py-2 text-left">実際に体験した役割</th><td>{reflection.actualRoles.join("、") || "（記入なし）"}</td></tr></tbody></table>{[["本人の振り返り",[`うれしかったこと：${reflection.happiest || "（記入なし）"}`,`難しかったこと：${reflection.difficult || "（記入なし）"}`].join("\n")],["今日やったこと",selectedActionLabels.join("、")],["今回使った社会参加スキル",skills.join("、")],["誰かに助けてもらったこと",reflection.helpedBy],["次にやってみたいこと",reflection.nextActivity]].map(([label,value]) => <div key={label} className="avoid-break mt-4 rounded border border-black p-3"><p className="font-bold">{label}</p><p className="mt-1 min-h-10 whitespace-pre-wrap">{value || "（記入なし）"}</p></div>)}<p className="mt-5 text-xs">※ このレポートは本人の自己申告による学習記録です。順位・合否・資格認定を示すものではありません。</p>
        </div>
      </div>;
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
