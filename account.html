<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マイページ | アルパカすく〜る</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="./series-nav-data.js"></script>
  <script src="./material-curriculum-map.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    p, li, a, button, input {
      word-break: normal;
      overflow-wrap: anywhere;
      line-break: strict;
    }
    .print-sheet {
      position: fixed;
      left: -9999px;
      top: 0;
    }
    @page {
      size: A4 portrait;
      margin: 12mm;
    }
    @media print {
      body {
        background: white !important;
      }
      #root > div {
        min-height: 0 !important;
        background: white !important;
      }
      #root > div > header,
      #root > div > main {
        display: none !important;
      }
      body * {
        visibility: hidden;
      }
      .print-sheet,
      .print-sheet * {
        visibility: visible;
      }
      .print-sheet {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
      .print-sheet thead {
        display: table-header-group;
      }
      .print-sheet tr {
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;
    const { createRoot } = ReactDOM;

    const roleLabels = {
      child: "学習者",
      parent: "保護者",
      org_admin: "団体管理者",
    };

    const materialMap = (() => {
      const series = typeof SERIES_META !== "undefined" ? SERIES_META : [];
      return new Map(
        series.flatMap((item) => item.episodes).map((episode) => [episode.id, episode])
      );
    })();

    const curriculumMap = typeof MATERIAL_CURRICULUM_MAP !== "undefined"
      ? MATERIAL_CURRICULUM_MAP
      : {};

    const currentMonthValue = () => {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    };

    const getMonthRange = (monthValue) => {
      const match = /^(\d{4})-(\d{2})$/.exec(monthValue);
      if (!match) return null;

      const year = Number(match[1]);
      const monthIndex = Number(match[2]) - 1;
      if (monthIndex < 0 || monthIndex > 11) return null;

      return {
        start: new Date(year, monthIndex, 1),
        end: new Date(year, monthIndex + 1, 1),
      };
    };

    const formatMonth = (monthValue) => {
      const range = getMonthRange(monthValue);
      if (!range) return "対象月未設定";
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "long",
      }).format(range.start);
    };

    const formatLearningDate = (value) => {
      if (!value) return "日付なし";
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "numeric",
        day: "numeric",
      }).format(new Date(value));
    };

    const getMaterialDetails = (materialId) => {
      const curriculum = curriculumMap[materialId];
      const navigation = materialMap.get(materialId);
      return {
        series: curriculum?.series || "シリーズ情報なし",
        title: curriculum?.title || navigation?.title || materialId,
        subjects: curriculum?.subjects || [],
        url: navigation?.url || "",
      };
    };

    const formatSubjectLabel = ({ subject, grade }) =>
      grade ? `${subject}（${grade}）` : `${subject}（学年指定なし）`;

    const formatDate = (value) => {
      if (!value) return "日時なし";
      return new Intl.DateTimeFormat("ja-JP", {
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      }).format(new Date(value));
    };

    function AccountApp() {
      const client = useMemo(() => window.AlpacaSupabase?.createClient() || null, []);
      const [initializing, setInitializing] = useState(true);
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [records, setRecords] = useState([]);
      const [email, setEmail] = useState("");
      const [sending, setSending] = useState(false);
      const [notice, setNotice] = useState("");
      const [errorMessage, setErrorMessage] = useState("");
      const [selectedMonth, setSelectedMonth] = useState(currentMonthValue);
      const [reportRecords, setReportRecords] = useState([]);
      const [reportLoading, setReportLoading] = useState(false);
      const [reportError, setReportError] = useState("");

      useEffect(() => {
        let active = true;

        if (!client) {
          setInitializing(false);
          return undefined;
        }

        const ensureProfile = async (user) => {
          const { data: existing, error: selectError } = await client
            .from("profiles")
            .select("id, display_name, role, created_at")
            .eq("id", user.id)
            .maybeSingle();

          if (selectError) throw selectError;
          if (existing) return existing;

          const displayName = user.user_metadata?.display_name || "学習者";
          const { data: created, error: insertError } = await client
            .from("profiles")
            .insert({ id: user.id, display_name: displayName })
            .select("id, display_name, role, created_at")
            .single();

          if (insertError) throw insertError;
          return created;
        };

        const loadAccount = async (nextSession) => {
          if (!active) return;
          setSession(nextSession);
          setErrorMessage("");

          if (!nextSession?.user) {
            setProfile(null);
            setRecords([]);
            setInitializing(false);
            return;
          }

          try {
            const ownProfile = await ensureProfile(nextSession.user);
            const { data: ownRecords, error: recordsError } = await client
              .from("learning_records")
              .select("id, material_id, completed_at, reflection")
              .order("completed_at", { ascending: false });

            if (recordsError) throw recordsError;
            if (!active) return;
            setProfile(ownProfile);
            setRecords(ownRecords || []);
          } catch (_error) {
            if (active) {
              setErrorMessage("マイページを読み込めませんでした。少し時間をおいて、もう一度お試しください。");
            }
          } finally {
            if (active) setInitializing(false);
          }
        };

        client.auth.getSession().then(({ data, error }) => {
          if (!active) return;
          if (error) {
            setErrorMessage("ログイン状態を確認できませんでした。ページを読み直してください。");
            setInitializing(false);
            return;
          }
          loadAccount(data.session);
        });

        const { data: authListener } = client.auth.onAuthStateChange((_event, nextSession) => {
          window.setTimeout(() => loadAccount(nextSession), 0);
        });

        return () => {
          active = false;
          authListener.subscription.unsubscribe();
        };
      }, [client]);

      useEffect(() => {
        let active = true;

        if (!client || !session?.user) {
          setReportRecords([]);
          setReportLoading(false);
          setReportError("");
          return undefined;
        }

        const monthRange = getMonthRange(selectedMonth);
        if (!monthRange) {
          setReportRecords([]);
          setReportLoading(false);
          setReportError("対象月を確認できませんでした。月を選び直してください。");
          return undefined;
        }

        setReportLoading(true);
        setReportError("");

        const loadMonthlyReport = async () => {
          try {
            const { data, error } = await client
              .from("learning_records")
              .select("id, material_id, completed_at, reflection")
              .gte("completed_at", monthRange.start.toISOString())
              .lt("completed_at", monthRange.end.toISOString())
              .order("completed_at", { ascending: true });

            if (!active) return;
            if (error) {
              throw error;
            }

            setReportRecords(data || []);
          } catch (_error) {
            if (!active) return;
            setReportRecords([]);
            setReportError("月間学習レポートを読み込めませんでした。少し時間をおいて、もう一度お試しください。");
          } finally {
            if (active) setReportLoading(false);
          }
        };

        loadMonthlyReport();

        return () => {
          active = false;
        };
      }, [client, session?.user?.id, selectedMonth]);

      const sendMagicLink = async (event) => {
        event.preventDefault();
        if (!client || !email.trim()) return;

        setSending(true);
        setNotice("");
        setErrorMessage("");

        const redirectUrl = new URL("./account.html", window.location.href);
        redirectUrl.search = "";
        redirectUrl.hash = "";

        const { error } = await client.auth.signInWithOtp({
          email: email.trim(),
          options: {
            emailRedirectTo: redirectUrl.href,
            shouldCreateUser: true,
          },
        });

        if (error) {
          setErrorMessage("ログイン用メールを送れませんでした。メールアドレスを確認して、もう一度お試しください。");
        } else {
          setNotice("ログイン用リンクをメールで送りました。メールを開いてリンクを押してください。");
        }
        setSending(false);
      };

      const signOut = async () => {
        if (!client) return;
        setErrorMessage("");
        const { error } = await client.auth.signOut();
        if (error) {
          setErrorMessage("ログアウトできませんでした。もう一度お試しください。");
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-b from-sky-100 via-orange-50 to-white text-gray-800">
          <header className="bg-white/90 border-b border-orange-100">
            <div className="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2">
              <a href="./matrix-library.html" className="font-extrabold text-orange-600">🦙 アルパカすく〜る</a>
              <nav className="flex flex-wrap items-center justify-end gap-1 text-xs sm:text-sm font-bold">
                <a href="./matrix-library.html" className="px-2 py-1 rounded text-gray-600 hover:text-orange-600">教材一覧</a>
                <a href="./series-guide.html" className="px-2 py-1 rounded text-gray-600 hover:text-orange-600">テーマ一覧</a>
                <span className="px-2 py-1 rounded bg-orange-100 text-orange-700">マイページ</span>
              </nav>
            </div>
          </header>

          <main className="max-w-3xl mx-auto px-4 py-8 sm:py-12 min-w-0">
            <div className="text-center mb-8">
              <div className="text-5xl mb-3">🌱</div>
              <h1 className="text-2xl sm:text-3xl font-extrabold text-orange-700">わたしの学び</h1>
              <p className="mt-2 text-sm sm:text-base text-gray-600">学んだ教材と、ふりかえりを自分だけの記録として残します。</p>
            </div>

            {!client && (
              <section className="bg-white border-2 border-dashed border-orange-200 rounded-2xl p-5 sm:p-7 shadow-sm">
                <h2 className="font-bold text-orange-700 mb-2">ただいま準備中です</h2>
                <p className="text-sm text-gray-600">Supabaseの接続設定が完了すると、ログインと学習履歴を使えるようになります。教材はこれまで通り、ログインなしで利用できます。</p>
                <a href="./matrix-library.html" className="inline-flex mt-5 px-4 py-2 rounded-lg bg-orange-500 text-white font-bold hover:bg-orange-600">教材を見る</a>
              </section>
            )}

            {client && initializing && (
              <div className="bg-white rounded-2xl p-8 text-center shadow-sm" aria-live="polite">
                <p className="text-gray-600">読み込み中です…</p>
              </div>
            )}

            {errorMessage && (
              <div className="mb-5 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700" role="alert">
                {errorMessage}
              </div>
            )}

            {client && !initializing && !session && (
              <section className="bg-white rounded-2xl p-5 sm:p-8 shadow-lg border border-orange-100">
                <h2 className="text-xl font-bold text-gray-800 mb-2">メールでログイン</h2>
                <p className="text-sm text-gray-600 mb-5">パスワードは使いません。届いたメールのリンクからログインできます。</p>
                <form onSubmit={sendMagicLink} className="space-y-4">
                  <div>
                    <label htmlFor="email" className="block text-sm font-bold text-gray-700 mb-1">メールアドレス</label>
                    <input
                      id="email"
                      type="email"
                      inputMode="email"
                      autoComplete="email"
                      required
                      value={email}
                      onChange={(event) => setEmail(event.target.value)}
                      placeholder="name@example.com"
                      className="block w-full min-w-0 rounded-xl border border-gray-300 px-3 py-3 text-base focus:outline-none focus:ring-2 focus:ring-orange-400"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled={sending}
                    className="w-full rounded-xl bg-orange-500 px-4 py-3 font-bold text-white hover:bg-orange-600 disabled:bg-gray-300"
                  >
                    {sending ? "送信中…" : "ログイン用リンクを受け取る"}
                  </button>
                </form>
                {notice && <p className="mt-4 rounded-lg bg-teal-50 p-3 text-sm text-teal-700" role="status">{notice}</p>}
                <p className="mt-5 text-xs text-gray-500">はじめての方も、同じフォームからアカウントを作成できます。</p>
              </section>
            )}

            {client && !initializing && session && (
              <div className="space-y-6 min-w-0">
                <section className="bg-white rounded-2xl p-5 sm:p-7 shadow-sm border border-orange-100">
                  <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 min-w-0">
                    <div className="min-w-0">
                      <p className="text-xs font-bold text-orange-600">ログイン中</p>
                      <h2 className="text-xl font-extrabold mt-1">{profile?.display_name || "学習者"}</h2>
                      <p className="text-sm text-gray-500 break-all">{session.user.email}</p>
                      <span className="inline-block mt-2 rounded-full bg-sky-100 px-3 py-1 text-xs font-bold text-sky-700">
                        {roleLabels[profile?.role] || "学習者"}
                      </span>
                    </div>
                    <button onClick={signOut} className="shrink-0 rounded-lg border border-gray-300 px-4 py-2 text-sm font-bold text-gray-600 hover:bg-gray-50">
                      ログアウト
                    </button>
                  </div>
                </section>

                <section className="rounded-2xl bg-white p-5 sm:p-7 shadow-sm border border-teal-100 min-w-0" aria-labelledby="monthly-report-heading">
                  <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4 min-w-0">
                    <div className="min-w-0">
                      <p className="text-xs font-bold text-teal-600">MONTHLY LEARNING REPORT</p>
                      <h2 id="monthly-report-heading" className="text-xl font-extrabold">月間学習レポート</h2>
                      <p className="mt-1 text-sm text-gray-500">学習日・教材・対応教科と学年・ふりかえりを、学校へ提出しやすい形でまとめます。</p>
                    </div>
                    <div className="shrink-0">
                      <label htmlFor="report-month" className="block text-xs font-bold text-gray-600 mb-1">対象月</label>
                      <input
                        id="report-month"
                        type="month"
                        value={selectedMonth}
                        onChange={(event) => setSelectedMonth(event.target.value)}
                        className="w-full rounded-lg border border-gray-300 px-3 py-2 text-base focus:outline-none focus:ring-2 focus:ring-teal-400"
                      />
                    </div>
                  </div>

                  <div className="mt-5 flex flex-wrap items-center justify-between gap-3 rounded-xl bg-teal-50 p-4">
                    <div>
                      <p className="font-extrabold text-teal-900">{formatMonth(selectedMonth)}</p>
                      <p className="text-sm text-teal-700">{reportLoading ? "読み込み中…" : `${reportRecords.length}件の学習記録`}</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => window.print()}
                      disabled={reportLoading}
                      className="rounded-lg bg-teal-600 px-4 py-2 text-sm font-bold text-white hover:bg-teal-700 disabled:bg-gray-300"
                    >
                      🖨️ 印刷・PDF保存
                    </button>
                  </div>

                  {reportError && (
                    <p className="mt-4 rounded-lg border border-red-200 bg-red-50 p-3 text-sm text-red-700" role="alert">{reportError}</p>
                  )}

                  {!reportError && reportLoading && (
                    <p className="mt-5 text-center text-sm text-gray-500" aria-live="polite">月間レポートを読み込んでいます…</p>
                  )}

                  {!reportError && !reportLoading && reportRecords.length === 0 && (
                    <div className="mt-5 rounded-xl border-2 border-dashed border-gray-200 p-6 text-center">
                      <p className="font-bold text-gray-700">この月の学習記録はありません</p>
                      <p className="mt-1 text-sm text-gray-500">別の月を選ぶか、教材のふりかえりを終えてからご確認ください。</p>
                    </div>
                  )}

                  {!reportError && !reportLoading && reportRecords.length > 0 && (
                    <ol className="mt-5 space-y-4 min-w-0">
                      {reportRecords.map((record) => {
                        const material = getMaterialDetails(record.material_id);
                        return (
                          <li key={record.id} className="rounded-xl border border-gray-200 p-4 min-w-0">
                            <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2">
                              <div className="min-w-0">
                                <p className="text-xs font-bold text-teal-600">{material.series}</p>
                                {material.url ? (
                                  <a href={`./${material.url}`} className="mt-1 inline-block font-extrabold text-orange-700 hover:underline">{material.title}</a>
                                ) : (
                                  <p className="mt-1 font-extrabold text-gray-800">{material.title}</p>
                                )}
                              </div>
                              <time className="shrink-0 text-sm font-bold text-gray-600">{formatLearningDate(record.completed_at)}</time>
                            </div>

                            {material.subjects.length > 0 ? (
                              <ul className="mt-3 space-y-2">
                                {material.subjects.map((subject, index) => (
                                  <li key={`${record.id}-subject-${index}`} className="rounded-lg bg-sky-50 px-3 py-2 text-sm text-gray-700">
                                    <span className="font-bold text-sky-800">{formatSubjectLabel(subject)}</span>
                                    {subject.unit && <span>：{subject.unit}</span>}
                                  </li>
                                ))}
                              </ul>
                            ) : (
                              <p className="mt-3 rounded-lg bg-amber-50 px-3 py-2 text-sm text-amber-800">教科・学年情報を確認できませんでした。</p>
                            )}

                            <div className="mt-3 rounded-lg bg-teal-50 p-3">
                              <p className="text-xs font-bold text-teal-700">ふりかえり</p>
                              <p className="mt-1 text-sm text-teal-950 whitespace-pre-wrap">{record.reflection?.trim() || "記録なし"}</p>
                            </div>
                          </li>
                        );
                      })}
                    </ol>
                  )}
                </section>

                <section className="min-w-0">
                  <div className="flex flex-wrap items-end justify-between gap-2 mb-3">
                    <div>
                      <p className="text-xs font-bold text-orange-600">LEARNING RECORDS</p>
                      <h2 className="text-xl font-extrabold">学習履歴</h2>
                    </div>
                    <p className="text-sm text-gray-500">{records.length}件</p>
                  </div>

                  {records.length === 0 ? (
                    <div className="rounded-2xl border-2 border-dashed border-gray-200 bg-white p-7 text-center">
                      <p className="font-bold text-gray-700">記録はまだありません</p>
                      <p className="mt-2 text-sm text-gray-500">教材の「ふりかえり」を終えると、ここに学びがたまります。</p>
                      <a href="./matrix-library.html" className="inline-flex mt-5 rounded-lg bg-orange-500 px-4 py-2 font-bold text-white hover:bg-orange-600">教材を選ぶ</a>
                    </div>
                  ) : (
                    <ul className="space-y-3 min-w-0">
                      {records.map((record) => {
                        const material = materialMap.get(record.material_id);
                        const title = material?.title || record.material_id;
                        return (
                          <li key={record.id} className="rounded-2xl bg-white p-5 shadow-sm border border-gray-100 min-w-0">
                            <div className="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-2 min-w-0">
                              <div className="min-w-0">
                                {material ? (
                                  <a href={`./${material.url}`} className="font-extrabold text-orange-700 hover:underline">{title}</a>
                                ) : (
                                  <p className="font-extrabold text-gray-800">{title}</p>
                                )}
                                <p className="mt-1 text-xs text-gray-500">教材ID: {record.material_id}</p>
                              </div>
                              <time className="shrink-0 text-xs text-gray-500">{formatDate(record.completed_at)}</time>
                            </div>
                            {record.reflection && (
                              <p className="mt-3 rounded-lg bg-teal-50 p-3 text-sm text-teal-900 whitespace-pre-wrap">{record.reflection}</p>
                            )}
                          </li>
                        );
                      })}
                    </ul>
                  )}
                </section>
              </div>
            )}
          </main>

          <section className="print-sheet bg-white text-black" aria-hidden="true">
            <div className="border-b-2 border-black pb-3 mb-5">
              <p className="text-sm font-bold">アルパカすく〜る</p>
              <h1 className="text-2xl font-extrabold">月間学習レポート</h1>
              <div className="mt-2 flex justify-between gap-4 text-sm">
                <p><strong>対象月：</strong>{formatMonth(selectedMonth)}</p>
                <p><strong>学習記録：</strong>{reportRecords.length}件</p>
              </div>
            </div>

            {reportRecords.length === 0 ? (
              <p className="border border-gray-400 p-5 text-center text-sm">この月の学習記録はありません。</p>
            ) : (
              <table className="w-full border-collapse text-xs">
                <thead>
                  <tr>
                    <th className="border border-black p-2 text-left w-20">学習日</th>
                    <th className="border border-black p-2 text-left w-48">教材</th>
                    <th className="border border-black p-2 text-left">対応教科・学年／学習指導要領対応</th>
                    <th className="border border-black p-2 text-left w-40">ふりかえり</th>
                  </tr>
                </thead>
                <tbody>
                  {reportRecords.map((record) => {
                    const material = getMaterialDetails(record.material_id);
                    return (
                      <tr key={`print-${record.id}`}>
                        <td className="border border-black p-2 align-top">{formatLearningDate(record.completed_at)}</td>
                        <td className="border border-black p-2 align-top">
                          <p className="font-bold">{material.title}</p>
                          <p className="mt-1 text-gray-700">{material.series}</p>
                        </td>
                        <td className="border border-black p-2 align-top">
                          {material.subjects.length > 0 ? (
                            <ul className="space-y-1 list-disc list-inside">
                              {material.subjects.map((subject, index) => (
                                <li key={`print-${record.id}-subject-${index}`}>
                                  <strong>{formatSubjectLabel(subject)}</strong>{subject.unit ? `：${subject.unit}` : ""}
                                </li>
                              ))}
                            </ul>
                          ) : (
                            <p>教科・学年情報なし</p>
                          )}
                        </td>
                        <td className="border border-black p-2 align-top whitespace-pre-wrap">{record.reflection?.trim() || "記録なし"}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}

            <p className="mt-4 text-[10px] text-gray-600">このレポートは、ログイン中の利用者本人の学習記録を対象月ごとにまとめたものです。</p>
          </section>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<AccountApp />);
  </script>
</body>
</html>
