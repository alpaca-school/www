<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キャラクター図鑑｜アルパカすく〜る</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        p, .speech-bubble p { word-break: keep-all; overflow-wrap: anywhere; }
        .chara-avatar-lg {
            width: 96px; height: 96px; border-radius: 9999px; object-fit: cover;
            border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.15); background: #fff;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-orange-50 dark:bg-gray-900 transition-colors">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        const { createRoot } = ReactDOM;

        const ChevronLeft = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m15 18-6-6 6-6"/></svg>
        );

        // 4アルパカ：困りごとを持ち込む仲間たち（性格は正・変更禁止のキャラ設定）
        const ALPACAS = [
          {
            key: "hari", name: "ハーリー", color: "red", emoji: "🔥", img: "img/characters/harly.png",
            personality: "オラオラ系。怖いもの知らずで、目立つことが好き。",
            role: "勢いだけで突っ走って、よく困りごとを持ち込む",
            gag: "失敗の瞬間、「ズコーッ!」と勢いよくすっ転ぶ"
          },
          {
            key: "sara", name: "サラバンジ", color: "blue", emoji: "⚡", img: "img/characters/sarabanji.png",
            personality: "無謀に見えることも、運と勢いで乗り越える。体力がなく短期決戦を好む。",
            role: "一発勝負にこだわって、じっくり考えずに動く",
            gag: "失敗の瞬間、「バタン!」と大げさに倒れる→3秒後にムクッと起き上がる"
          },
          {
            key: "gan", name: "ガンジュー", color: "green", emoji: "😴", img: "img/characters/ganjuu.png",
            personality: "のんびり屋で何でも食べるが、人見知り。よく寝る。",
            role: "トラップ情報にうっかり気を取られやすい",
            gag: "正解を答える直前に立ったまま本気のいびき→メンターに肩を叩かれてハッと飛び起きる"
          },
          {
            key: "kaa", name: "カーギー", color: "purple", emoji: "💁‍♀️", img: "img/characters/carggy.png",
            personality: "唯一の女性性。美意識が高く、常に安全策を選ぶ。",
            role: "計算の筋道は合っているのに、最後の一歩で惜しい間違いをする",
            gag: "登場直後、風で乱れた前髪を鏡もなしに一瞬でピシッと直す"
          }
        ];

        // 4メンター：知識と生き方を教える役。多重知能8分類を2つずつ担当
        const MENTORS = [
          {
            key: "chinen", name: "知念おじぃさん", color: "amber", emoji: "🧓",
            mi: ["論理・数学的知能", "言語・語学的知能"],
            personality: "理屈屋だけど優しい先生役。数字と言葉の筋道を、はっきりわかりやすく解きほぐす。"
          },
          {
            key: "tokue", name: "仲程のヨシおばぁさん", color: "rose", emoji: "👵",
            mi: ["対人的知能", "内省的知能"],
            personality: "聞き上手、包み込むような優しさ。人の気持ちや、なぜそれが大切なのかを、一緒に考える。花が好きで、庭先にはいつも季節の花が咲いている。"
          },
          {
            key: "rikiya", name: "力也おじぃさん", color: "teal", emoji: "🧓",
            mi: ["音楽・リズム的知能", "身体・運動感覚的知能"],
            personality: "陽気で元気、実演好き。歌や体の動きで、手順を体に覚えさせる。"
          },
          {
            key: "misaki", name: "美咲おばぁさん", color: "indigo", emoji: "👵",
            mi: ["視覚・空間的知能", "博物学的知能"],
            personality: "観察好き、物知り博士肌。絵や地図、生き物や自然の知識で説明する。"
          }
        ];

        const COLOR_MAP = {
          red: { bg: "bg-red-50 dark:bg-red-950", border: "border-red-200 dark:border-red-800", text: "text-red-700 dark:text-red-300", badge: "bg-red-100 dark:bg-red-900 text-red-700 dark:text-red-200" },
          blue: { bg: "bg-blue-50 dark:bg-blue-950", border: "border-blue-200 dark:border-blue-800", text: "text-blue-700 dark:text-blue-300", badge: "bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-200" },
          green: { bg: "bg-green-50 dark:bg-green-950", border: "border-green-200 dark:border-green-800", text: "text-green-700 dark:text-green-300", badge: "bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-200" },
          purple: { bg: "bg-purple-50 dark:bg-purple-950", border: "border-purple-200 dark:border-purple-800", text: "text-purple-700 dark:text-purple-300", badge: "bg-purple-100 dark:bg-purple-900 text-purple-700 dark:text-purple-200" },
          amber: { bg: "bg-amber-50 dark:bg-amber-950", border: "border-amber-200 dark:border-amber-800", text: "text-amber-700 dark:text-amber-300", badge: "bg-amber-100 dark:bg-amber-900 text-amber-700 dark:text-amber-200" },
          rose: { bg: "bg-rose-50 dark:bg-rose-950", border: "border-rose-200 dark:border-rose-800", text: "text-rose-700 dark:text-rose-300", badge: "bg-rose-100 dark:bg-rose-900 text-rose-700 dark:text-rose-200" },
          teal: { bg: "bg-teal-50 dark:bg-teal-950", border: "border-teal-200 dark:border-teal-800", text: "text-teal-700 dark:text-teal-300", badge: "bg-teal-100 dark:bg-teal-900 text-teal-700 dark:text-teal-200" },
          indigo: { bg: "bg-indigo-50 dark:bg-indigo-950", border: "border-indigo-200 dark:border-indigo-800", text: "text-indigo-700 dark:text-indigo-300", badge: "bg-indigo-100 dark:bg-indigo-900 text-indigo-700 dark:text-indigo-200" }
        };

        const CharAvatar = ({ img, emoji, color }) => {
          const [failed, setFailed] = useState(false);
          if (!img || failed) {
            return (
              <div className={`chara-avatar-lg flex items-center justify-center text-4xl ${COLOR_MAP[color].bg}`}>
                {emoji}
              </div>
            );
          }
          return <img src={img} alt="" className="chara-avatar-lg" onError={() => setFailed(true)} />;
        };

        function AlpacaCard({ c }) {
          const cc = COLOR_MAP[c.color];
          return (
            <div className={`rounded-2xl border-2 ${cc.border} ${cc.bg} p-5 flex gap-4`}>
              <CharAvatar img={c.img} emoji={c.emoji} color={c.color} />
              <div className="flex-1 min-w-0">
                <h3 className={`font-extrabold text-lg ${cc.text}`}>{c.name}</h3>
                <p className="text-sm text-gray-700 dark:text-gray-300 mt-1">{c.personality}</p>
                <p className="text-xs text-gray-500 dark:text-gray-400 mt-2">🌀 {c.role}</p>
                <p className="text-xs text-gray-400 dark:text-gray-500 mt-1">🎬 {c.gag}</p>
              </div>
            </div>
          );
        }

        function MentorCard({ m }) {
          const cc = COLOR_MAP[m.color];
          return (
            <div className={`rounded-2xl border-2 ${cc.border} ${cc.bg} p-5 flex gap-4`}>
              <CharAvatar img={null} emoji={m.emoji} color={m.color} />
              <div className="flex-1 min-w-0">
                <h3 className={`font-extrabold text-lg ${cc.text}`}>{m.name}</h3>
                <div className="flex flex-wrap gap-1.5 mt-1">
                  {m.mi.map((tag) => (
                    <span key={tag} className={`px-2 py-0.5 text-xs font-bold rounded-full ${cc.badge}`}>{tag}</span>
                  ))}
                </div>
                <p className="text-sm text-gray-700 dark:text-gray-300 mt-2">{m.personality}</p>
              </div>
            </div>
          );
        }

        function App() {
          const [darkMode, setDarkMode] = useState(false);
          return (
            <div className={darkMode ? "dark" : ""}>
            <div className="bg-gradient-to-b from-sky-100 to-orange-50 dark:from-gray-900 dark:to-gray-900 min-h-screen transition-colors">
              <div className="sticky top-0 z-10 bg-white/90 dark:bg-gray-800/90 backdrop-blur border-b border-gray-200 dark:border-gray-700">
                <div className="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                  <span className="font-extrabold text-gray-800 dark:text-gray-100 whitespace-nowrap">🦙 アルパカすく〜る</span>
                  <nav className="flex items-center gap-1 text-sm font-bold whitespace-nowrap">
                    <a href="./matrix-library.html" className="px-2 py-1 rounded text-gray-600 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition">教材一覧</a>
                    <a href="./characters.html" className="px-2 py-1 rounded text-orange-600 dark:text-orange-400">キャラクター図鑑</a>
                    <a href="./concept.html" className="px-2 py-1 rounded text-gray-600 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition">このサイトについて</a>
                  </nav>
                  <button
                    onClick={() => setDarkMode(d => !d)}
                    aria-label="ライト/ダークモード切り替え"
                    className="px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-bold hover:bg-gray-50 dark:hover:bg-gray-600 transition"
                  >
                    {darkMode ? "☀️" : "🌙"}
                  </button>
                </div>
              </div>

              <div className="max-w-4xl mx-auto px-4 py-10">
                <header className="mb-10 text-center">
                  <h1 className="text-3xl md:text-4xl font-extrabold text-gray-800 dark:text-gray-100 mb-3">キャラクター図鑑 🦙</h1>
                  <p className="text-sm text-gray-600 dark:text-gray-400 leading-relaxed">
                    アルパカすく〜るの教材には、いつも8人の仲間が登場します。<br />
                    4人のアルパカは「困りごと」を持ち込む役、4人のメンター（オバー・オジー）は「知識と生き方」を教える役です。
                  </p>
                  <span className="inline-block mt-3 px-3 py-1 text-xs font-bold rounded-full bg-yellow-100 dark:bg-yellow-900 text-yellow-700 dark:text-yellow-200">🚧 準備中：随時アップデートします</span>
                </header>

                <section className="mb-12">
                  <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 mb-2">4アルパカ｜困りごとを持ち込む仲間たち</h2>
                  <p className="text-sm text-gray-500 dark:text-gray-400 mb-4">みんな、正解を知っているわけじゃない。焦ったり、勢いだけで動いたり、惜しいところで間違えたりする。だからこそ、一緒に「どうしてそうなったのか」を考える相棒になる。</p>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {ALPACAS.map((c) => <AlpacaCard key={c.key} c={c} />)}
                  </div>
                </section>

                <section className="mb-12">
                  <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 mb-2">4メンター｜オバー・オジー</h2>
                  <p className="text-sm text-gray-500 dark:text-gray-400 mb-4">多重知能理論（ガードナーの8分類）を2つずつ担当する、教材ごとの案内役。1本の教材につき1人が「主役」として教え、他の3人も一言ずつ登場する。</p>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {MENTORS.map((m) => <MentorCard key={m.key} m={m} />)}
                  </div>
                </section>

                <section className="mb-12">
                  <div className="bg-white dark:bg-gray-800 border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-2xl p-6">
                    <h2 className="text-lg font-bold text-gray-800 dark:text-gray-100 mb-2">メンターたちの人間観について</h2>
                    <p className="text-sm text-gray-600 dark:text-gray-400 leading-relaxed">
                      4人のメンターは、単に多重知能の担当を割り振られているだけの存在ではありません。東洋の伝統的な人間形成観「知育・徳育・体育（三育）」に、感性を育てる「美育」を加えた4本柱の教育者として、それぞれの窓から知識だけでなく生き方の指針を示す役でもあります。
                    </p>
                  </div>
                </section>

                <section>
                  <div className="bg-white dark:bg-gray-800 border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-2xl p-6">
                    <h2 className="text-lg font-bold text-gray-800 dark:text-gray-100 mb-2">お話の流れ</h2>
                    <ol className="text-sm text-gray-600 dark:text-gray-400 space-y-1.5 list-decimal list-inside">
                      <li>はじまりの問い：ちょっとした事件・困りごとが起きる</li>
                      <li>困りごと：3人のアルパカが焦って、それぞれ違うことを言う（みんな不正解）</li>
                      <li>メンター登場：その回のテーマに合った1人が、知識と生き方を教えてくれる</li>
                      <li>やってみる：教わったやり方で、実際にやってみる</li>
                      <li>想像する：正解のない問いを、自分の頭で考えてみる</li>
                      <li>ふりかえり：今日学んだことを、自分の言葉で書き残す</li>
                    </ol>
                  </div>
                </section>
              </div>

              <footer className="bg-gray-800 text-white p-6 text-sm mt-12">
                <div className="max-w-4xl mx-auto">
                  <p>
                    このコンテンツは、ご自宅から快適に学習できるよう設計されています。車椅子をご利用の方、高齢の方、外出が難しい方など、すべての方が楽しめるよう善処します。
                  </p>
                  <a href="./concept.html" className="inline-block mt-2 underline hover:text-emerald-300">
                    ▶ この学びの設計思想を読む
                  </a>
                </div>
              </footer>
            </div>
            </div>
          );
        }

        createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
