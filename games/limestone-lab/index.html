}

  .play-screen{padding:6px 8px 75px}.mission{position:absolute;z-index:10;left:8px;top:88px;width:230px}.mission p{display:none}

  .controls{width:min(100vw,680px);grid-template-columns:1fr 1fr;padding:5px 8px calc(6px + var(--safe))}

<body>
<div id="root"></div>
<script type="text/babel">
const {useEffect,useRef,useState}=React;

const clamp=(v,min=0,max=100)=>Math.max(min,Math.min(max,v));
const cloudFromDose=(dose)=>{
  if(dose<=52)return Math.min(1,dose/52);
  return Math.max(0,1-(dose-52)/48);
};
const messageFor=(dose)=>{
  if(dose<15)return "まだほとんど透明。泡の動きを見てみよう。";
  if(dose<38)return "少しずつ白い粒が見えてきた！";
  if(dose<=68)return "白くにごっている！ いまが観察チャンス。";
  if(dose<88)return "あれ？ 白さが少しずつ消えてきた…";
  return "たくさん入れたら、また透明に近づいた！";
};

function useAudio(){
  const ctxRef=useRef(null),masterRef=useRef(null),bgmTimer=useRef(null),step=useRef(0),mutedRef=useRef(false);
  const [muted,setMuted]=useState(false);
  useEffect(()=>{mutedRef.current=muted;if(masterRef.current)masterRef.current.gain.value=muted?0:0.22},[muted]);
  const ensure=async()=>{
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C)return false;
    if(!ctxRef.current||ctxRef.current.state==="closed"){
      ctxRef.current=new C({latencyHint:"interactive"});
      masterRef.current=ctxRef.current.createGain();
      masterRef.current.gain.value=mutedRef.current?0:0.22;
      masterRef.current.connect(ctxRef.current.destination);
    }
    if(ctxRef.current.state==="suspended"||ctxRef.current.state==="interrupted"){
      try{await ctxRef.current.resume()}catch(e){}
    }
    try{if("audioSession" in navigator)navigator.audioSession.type="playback"}catch(e){}
    return ctxRef.current.state==="running";
  };
  const tone=async(freq=440,dur=.09,type="sine",gain=.18)=>{
    if(!(await ensure())||mutedRef.current)return;
    const c=ctxRef.current,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g);g.connect(masterRef.current);o.start();o.stop(c.currentTime+dur);
  };
  const chord=async(notes=[523,659,784],gap=.08)=>{
    for(let i=0;i<notes.length;i++)setTimeout(()=>tone(notes[i],.17,"sine",.13),i*gap*1000);
  };
  const startBgm=async()=>{
    if(!(await ensure())||bgmTimer.current)return;
    const notes=[262,330,392,330,294,349,440,349];
    bgmTimer.current=setInterval(()=>{if(!mutedRef.current)tone(notes[step.current++%notes.length],.16,"sine",.035)},520);
  };
  const stopBgm=()=>{if(bgmTimer.current){clearInterval(bgmTimer.current);bgmTimer.current=null}};
  useEffect(()=>{
    const recover=()=>ensure();
    document.addEventListener("visibilitychange",recover);
    window.addEventListener("pageshow",recover);
    return()=>{document.removeEventListener("visibilitychange",recover);window.removeEventListener("pageshow",recover);stopBgm()};
  },[]);
  return{muted,setMuted,tone,chord,startBgm,ensure};
}

function App(){
  const audio=useAudio();
  const [screen,setScreen]=useState("title");
  const [dose,setDose]=useState(0);
  const [score,setScore]=useState(0);
  const [best,setBest]=useState(()=>{try{return +(localStorage.getItem("limestone_lab_best")||0)}catch(e){return 0}});
  const [foundCloud,setFoundCloud]=useState(false);
  const [foundClear,setFoundClear]=useState(false);
  const [reaction,setReaction]=useState("CO₂を送って、石灰水の変化を見てみよう。");
  const [reactionKind,setReactionKind]=useState("");
  const [pumping,setPumping]=useState(false);
  const [bubbleSeed,setBubbleSeed]=useState(0);
  const [time,setTime]=useState(0);
  const [bridgeDone,setBridgeDone]=useState(false);
  const pumpTimer=useRef(null);
  const cloud=cloudFromDose(dose);

  useEffect(()=>{try{localStorage.setItem("limestone_lab_best",String(best))}catch(e){}},[best]);

  const stage = screen==="title" ? 0 : screen==="play" ? (foundCloud?2:1) : screen==="bridge" ? 3 : 3;
  const nextLabel = !foundCloud ? "白いにごり" : !foundClear ? "透明にもどる?" : screen==="play" ? "沖縄へ!" : screen==="bridge" ? "石灰岩" : "👑";
  const nextSub = !foundCloud ? "見つけよう" : !foundClear ? "入れつづける" : screen==="play" ? "発見2/2" : screen==="bridge" ? Math.max(0,100-time)+"%" : "MAX";

  const startGame=async()=>{
    await audio.ensure();audio.tone(660,.09);audio.startBgm();
    setScreen("play");setDose(0);setFoundCloud(false);setFoundClear(false);setScore(0);
    setReaction("まずはCO₂を少しずつ送ろう。白さが変わるよ。");setReactionKind("");
  };

  const pumpOnce=()=>{
    setDose(d=>clamp(d+2.6));
    setBubbleSeed(s=>s+1);
    audio.tone(220,.055,"sine",.07);
  };
  const startPump=()=>{
    if(pumping)return;
    setPumping(true);pumpOnce();
    pumpTimer.current=setInterval(pumpOnce,125);
  };
  const stopPump=()=>{
    setPumping(false);
    if(pumpTimer.current){clearInterval(pumpTimer.current);pumpTimer.current=null}
  };
  useEffect(()=>()=>stopPump(),[]);

  const observe=()=>{
    stopPump();
    if(dose<28){
      setReaction("まだ早いみたい。白い粒がもっと見えるまで、少しCO₂を送ろう。");
      setReactionKind("warn");audio.tone(260,.12,"triangle",.12);return;
    }
    if(dose<=68){
      const bonus=Math.max(25,Math.round(100-Math.abs(dose-52)*2.5));
      if(!foundCloud){
        setFoundCloud(true);setScore(s=>s+bonus);setBest(b=>Math.max(b,score+bonus));
        setReaction("発見！ 石灰水が白くにごった。白い粒の正体は炭酸カルシウム。");
        setReactionKind("good");audio.chord([523,659,784,1047],.07);
      }else{
        setReaction("白いにごりをもう一度確認できた。次は、このままCO₂を入れ続けてみよう。");
        setReactionKind("good");audio.tone(700,.13,"sine",.12);
      }
      return;
    }
    if(dose>=86){
      if(!foundClear){
        setFoundClear(true);setScore(s=>s+100);setBest(b=>Math.max(b,score+100));
        setReaction("大発見！ CO₂をさらに入れると、白いにごりが消えて透明に近づいた！");
        setReactionKind("good");audio.chord([659,784,988,1319],.08);
      }else{
        setReaction("透明にもどる変化を確認できた。2つの発見がそろった！");
        setReactionKind("good");
      }
      return;
    }
    setReaction("白さが消えはじめている。もっと入れると、どうなるかな？");
    setReactionKind("warn");audio.tone(440,.1,"triangle",.1);
  };

  const resetTrial=()=>{
    stopPump();setDose(0);setReaction("発見は残したまま、石灰水だけ最初の状態に戻したよ。");setReactionKind("");
    audio.tone(330,.1,"sine",.09);
  };

  const goBridge=()=>{audio.chord([523,659,784],.08);setScreen("bridge");setTime(0);setBridgeDone(false)};

  const updateTime=(v)=>{
    const n=+v;setTime(n);
    if(n>=100&&!bridgeDone){
      setBridgeDone(true);setScore(s=>s+100);audio.chord([523,659,784,1047],.08);
    }
  };

  const finish=()=>{
    const final=score+(bridgeDone?0:100);setBest(b=>Math.max(b,final));setScreen("finish");audio.chord([523,659,784,1047,1319],.1);
  };

  const particles=Array.from({length:22},(_,i)=>({x:(i*37)%95,y:(i*53)%90,t:1.4+(i%5)*.3}));
  const bubbles=Array.from({length:Math.min(8,Math.floor(dose/10)+1)},(_,i)=>({x:20+((bubbleSeed+i*17)%65),t:1.1+(i%4)*.18}));

  return <div className="game-shell">
    <header className="top">
      <div className="brand">アルパカすく〜る 🦙｜沖縄の自然ラボ</div>
      <div className="hud">
        <div className="scorebox"><div className="lbl">DISCOVERY SCORE</div><div className="score">{String(score).padStart(3,"0")}</div></div>
        <div className="nextbox"><div className="nextbubble">{nextLabel}</div><div className="nexttext"><span className="lbl">NEXT</span><br/>{nextSub}</div></div>
      </div>
      <div className="progress-row">
        <div className={"progress-chip "+(stage>=1?"on":"")}>① にごり</div>
        <div className={"progress-chip "+(stage>=2?"on":"")}>② 入れすぎ</div>
        <div className={"progress-chip "+(stage>=3?"on":"")}>③ 沖縄へ</div>
      </div>
    </header>

    <button className="mute" onClick={()=>{audio.setMuted(!audio.muted);audio.ensure()}}>{audio.muted?"🔇 OFF":"🔊 ON"}</button>

    <section className={"screen title-screen "+(screen==="title"?"active":"")}>
      <div className="title-badge">小学3〜6年生｜理科 × 沖縄</div>
      <div className="shisa-big">🦁</div>
      <h1>シーサー研究員の<br/><em>にごりラボ！</em></h1>
      <p className="lead">CO₂を送ると、透明な石灰水はどう変わる？<br/>いちばん白くなる瞬間を、自分の目で見つけよう。</p>
      <button className="start-btn" onClick={startGame}>実験スタート！</button>
      <p className="safety-note">これは画面上の学習シミュレーションです。実際の石灰水は水酸化カルシウム水溶液なので、学校などで実験するときは先生の指示に従ってください。</p>
    </section>

    <section className={"screen play-screen "+(screen==="play"?"active":"")}>
      <div className="mission">
        <div className={"shisa-face "+((foundCloud||foundClear)?"happy":"")}>🦁</div>
        <div>
          <h2>{!foundCloud?"白いにごりを見つけよう":!foundClear?"そのまま入れ続けると？":"2つの発見がそろった！"}</h2>
          <p>{!foundCloud?"押しっぱなしでCO₂を送れるよ。白さをよく見て「ここだ！」で観察。":!foundClear?"白くなったあともCO₂を送り続けて、変化を観察しよう。":"沖縄の琉球石灰岩と、どうつながるか見に行こう。"}</p>
        </div>
      </div>

      <div className="lab">
        <div className="cloud"></div><div className="coral-bg">🪸🐚</div>
        <div className="cloud-meter"><div className="row"><span>白いにごり</span><b>{Math.round(cloud*100)}%</b></div><div className="track"><span style={{width:(cloud*100)+"%"}}></span></div></div>
        <div className="co2-tank"><div className={"valve "+(pumping?"pump":"")}></div></div><div className="hose"></div>
        <div className="beaker">
          <div className="white-label">石灰水</div>
          <div className="liquid">
            <div className="cloudiness" style={{opacity:(cloud*.88)}}></div>
            {particles.map((p,i)=><i key={i} className="particle" style={{"--x":p.x+"%","--y":p.y+"%","--t":p.t+"s",opacity:cloud*.95}}></i>)}
            {pumping&&bubbles.map((b,i)=><i key={i+"-"+bubbleSeed} className="bubble" style={{"--x":b.x+"%","--t":b.t+"s"}}></i>)}
          </div>
        </div>
      </div>

      <div className={"reaction "+reactionKind}>{reaction}</div>
      <div className="discovery">
        <span className={foundCloud?"got":""}>🔎 白くにごる</span>
        <span className={foundClear?"got":""}>🔎 入れすぎると透明へ</span>
        {foundCloud&&foundClear&&<span className="got">✨ 発見コンプリート</span>}
      </div>

      {foundCloud&&foundClear&&<div style={{marginTop:"8px",textAlign:"center"}}><button className="big-btn" onClick={goBridge}>沖縄の石灰岩へ！</button></div>}

      <div className="controls">
        <button className={"pump-btn "+(pumping?"active":"")} onPointerDown={startPump} onPointerUp={stopPump} onPointerCancel={stopPump} onPointerLeave={stopPump}>☁️ 押してる間 CO₂</button>
        <button className="observe-btn" onClick={observe}>👀 ここだ！</button>
        <button className="reset-btn" onClick={resetTrial}>↩ 石灰水だけ最初に戻す（発見は残る）</button>
      </div>
    </section>

    <section className={"screen bridge-screen "+(screen==="bridge"?"active":"")}>
      <div className="card">
        <h2>🪸 海の世界から、沖縄の岩へ</h2>
        <p>琉球石灰岩は、昔のサンゴ礁をつくった生き物の骨格や殻などを含む【サンゴ礁複合体の堆積物】が、長い時間をかけて積み重なり固まったものだよ。サンゴだけでできているわけではないよ。</p>
        <div className="timeline" style={{"--time":time}}>
          <div className="reef">🪸 🐚 🪸 🐚 🪸</div>
          <div className="sediment"></div>
          <div className="rock-label">琉球石灰岩へ</div>
        </div>
        <label style={{fontSize:"12px",fontWeight:900,color:"#0a5d7d"}}>時間をすすめる →</label>
        <input className="time-range" aria-label="時間をすすめる" type="range" min="0" max="100" value={time} onChange={e=>updateTime(e.target.value)} />
        <div className="unlock">
          <div className="ico">{bridgeDone?"🪨":"⏳"}</div>
          <div><strong>{bridgeDone?"発見！ 沖縄には琉球石灰岩が広く分布":"100%まで時間をすすめよう"}</strong><p>{bridgeDone?"石灰水で見えた白い粒も、琉球石灰岩も、共通する大事な物質は炭酸カルシウム。":"海でできた炭酸カルシウムを含む堆積物が、長い時間の地質作用を受けて岩になる。"}</p></div>
        </div>
      </div>
      <div className="card">
        <h2>🦁 シーサー研究員のまとめ</h2>
        <p>沖縄の地面の下には、琉球石灰岩が広く見られる場所がある。石灰岩は石垣や石材にも使われてきた。今日の実験で見えた「炭酸カルシウム」を手がかりに、海と陸がつながって見えてくるね。</p>
        <button className="big-btn" disabled={!bridgeDone} style={{opacity:bridgeDone?1:.45}} onClick={finish}>👑 研究レポートを見る</button>
      </div>
    </section>

    <section className={"screen finish-screen "+(screen==="finish"?"active":"")}>
      <div className="medal">🏅</div>
      <h2>にごり博士 認定！</h2>
      <p style={{fontWeight:900,color:"#426773"}}>BEST {String(best).padStart(3,"0")} POINT</p>
      <div className="summary">
        <h3>今日の3つの発見</h3>
        <ul>
          <li>石灰水に二酸化炭素を通すと、炭酸カルシウムができて白くにごる。</li>
          <li>二酸化炭素をさらに多く通し続けると、水に溶けやすい炭酸水素カルシウムになり、透明に近づく。</li>
          <li>沖縄の「琉球石灰岩」は、昔のサンゴ礁複合体の堆積物が長い時間をかけてできた石灰岩で、炭酸カルシウムを主成分とする。</li>
        </ul>
      </div>
      <button className="big-btn" onClick={()=>{setScreen("title");setDose(0);setScore(0);setFoundCloud(false);setFoundClear(false);setTime(0);setBridgeDone(false)}}>もう一度あそぶ</button>
      <div className="sources">
        <strong>📚 出典・参考文献</strong><br/>
        ・<a href="https://www.mext.go.jp/component/a_menu/education/micro_detail/__icsFiles/afieldfile/2012/01/12/1304649_25_1.pdf" target="_blank" rel="noopener noreferrer">文部科学省「小学校理科の観察，実験の手引き 第6学年 水溶液の性質」</a><br/>
        ・<a href="https://www.edu-c.pref.miyagi.jp/midori/science/jugyo-sien/jugyouan/pointo2011/sinpoint/pointpdf/ALL2016.pdf" target="_blank" rel="noopener noreferrer">宮城県総合教育センター「みやぎ理科指導ポイント集」</a><br/>
        ・<a href="https://www.gsj.jp/Muse/prefrock/index.html" target="_blank" rel="noopener noreferrer">産総研 地質調査総合センター「県の石｜沖縄県：琉球石灰岩」</a>
      </div>
    </section>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
