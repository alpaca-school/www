<!DOCTYPE html>
<html lang="ja">
<head>

    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
        (() => {
            const pageVersion = "20260823-1";
            const url = new URL(window.location.href);
            if (url.searchParams.get("v") !== pageVersion) {
                url.searchParams.set("v", pageVersion);
                window.location.replace(url.toString());

    <meta name="description" content="アルパカすく〜るは、文化資本・社会関係資本・経済資本という3つの持ち物を、沖縄のテーマ教材と8人の仲間を通して育てるオンライン学び舎です。">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="./series-nav-data.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        p, li {
            word-break: normal;
            overflow-wrap: break-word;
            line-break: strict;
        }
        .chara-avatar {
            width: 64px; height: 64px; border-radius: 9999px; object-fit: cover;
            border: 3px solid white; box-shadow: 0 2px 6px rgba(0,0,0,0.15); background: #fff;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-orange-50 dark:bg-gray-900 transition-colors">
    <div id="root"></div>

    <script type="text/babel">

        const { createRoot } = ReactDOM;

        // 4アルパカ：困りごとを持ち込む仲間たち（性格は正・変更禁止のキャラ設定。characters.htmlと一言一句一致）
        const ALPACAS = [

            gag: "失敗の瞬間、「ズコーッ!」と勢いよくすっ転ぶ"

          {
            key: "sara", name: "サラバンジ", color: "blue", emoji: "⚡",
            personality: "無謀に見えることも、運と勢いで乗り越える。体力がなく短期決戦を好む。",

            gag: "正解を答える直前に立ったまま本気のいびき→メンターに肩を叩かれてハッと飛び起きる"

          {
            key: "kaa", name: "カーギー", color: "purple", emoji: "💁‍♀️",
            personality: "唯一の女性性。美意識が高く、常に安全策を選ぶ。",
            gag: "登場直後、風で乱れた前髪を鏡もなしに一瞬でピシッと直す"

        const MENTORS = [

          const cc = COLOR_MAP[c.color];
          return (
            <div className={`rounded-2xl border-2 ${cc.border} ${cc.bg} p-4 flex gap-3`}>
              <div className={`chara-avatar flex items-center justify-center text-3xl ${cc.bg}`}>{c.emoji}</div>
              <div className="flex-1 min-w-0">
                <h3 className={`font-extrabold ${cc.text}`}>{c.name}</h3>

                <p className="text-xs text-gray-400 dark:text-gray-500 mt-1">🎬 {c.gag}</p>
              </div>
            </div>
          );
        }

        function MentorMiniCard({ m }) {
          const cc = COLOR_MAP[m.color];
          return (
            <div className={`rounded-2xl border-2 ${cc.border} ${cc.bg} p-4 flex gap-3`}>
              <div className={`chara-avatar flex items-center justify-center text-3xl ${cc.bg}`}>{m.emoji}</div>
              <div className="flex-1 min-w-0">
                <h3 className={`font-extrabold ${cc.text}`}>{m.name}</h3>
                <div className="flex flex-wrap gap-1.5 mt-1">
                  {m.mi.map((tag) => (
                    <span key={tag} className={`px-2 py-0.5 text-xs font-bold rounded-full ${cc.badge}`}>{tag}</span>
                  ))}
                </div>
              </div>
            </div>
          );
        }

        function App() {
          const [darkMode, setDarkMode] = useState(false);
          const seriesCount = typeof SERIES_META !== "undefined" ? SERIES_META.length : 15;
          const episodeCount = typeof SERIES_META !== "undefined"
            ? SERIES_META.reduce((sum, s) => sum + s.episodes.length, 0)
            : 128;
          const links = typeof SUPPORT_LINKS !== "undefined" ? SUPPORT_LINKS : [];

          return (
            <div className={darkMode ? "dark" : ""}>
            <div className="bg-gradient-to-b from-sky-100 to-orange-50 dark:from-gray-900 dark:to-gray-900 min-h-screen transition-colors">

              <div className="sticky top-0 z-10 bg-white/90 dark:bg-gray-800/90 backdrop-blur border-b border-gray-200 dark:border-gray-700">
                <div className="max-w-4xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
                  <span className="font-extrabold text-gray-800 dark:text-gray-100 whitespace-nowrap">🦙 アルパカすく〜る</span>
                  <nav className="flex flex-wrap items-center gap-1 text-xs sm:text-sm font-bold">

                    <a href="./account.html" className="px-2 py-1 rounded text-gray-600 dark:text-gray-300 hover:text-orange-600 dark:hover:text-orange-400 transition">マイページ</a>
                  </nav>
                  <button
                    onClick={() => setDarkMode(d => !d)}
                    aria-label="ライト/ダークモード切り替え"
                    className="ml-auto px-3 py-2 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700 text-gray-700 dark:text-gray-200 text-sm font-bold hover:bg-gray-50 dark:hover:bg-gray-600 transition"
                  >
                    {darkMode ? "☀️" : "🌙"}
                  </button>
                </div>
              </div>

                <header className="mb-10 text-center">
                  <h1 className="text-3xl md:text-4xl font-extrabold text-gray-800 dark:text-gray-100 mb-4">アルパカすく〜る 🦙</h1>
                  <p className="text-lg text-gray-700 dark:text-gray-300 leading-relaxed">
                    沖縄を教材に、<br />勉強と暮らしの力を育てる。
                  </p>
                  <p className="mt-4 text-sm text-gray-600 dark:text-gray-400 leading-relaxed">
                    子どもから大人まで通える、<br />
                    オンライン学び舎。
                  </p>
                </header>

                <section className="mb-12">
                  <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 mb-4">なぜ、このすく〜るをつくるのか</h2>
                  <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 space-y-4 text-sm text-gray-700 dark:text-gray-300 leading-relaxed">
                    <p>
                      人が生きていくうえで頼りになる持ち物には、大きく3つの種類があると言われます。
                      1つ目は<strong className="text-gray-900 dark:text-gray-100">文化資本</strong>——知識やことば、物事を見るセンス。
                      2つ目は<strong className="text-gray-900 dark:text-gray-100">社会関係資本</strong>——困ったときに頼れる人や、ご縁のつながり。
                      3つ目は<strong className="text-gray-900 dark:text-gray-100">経済資本</strong>——お金や、安定した仕事。
                    </p>
                    <p>
                      不登校や中退、非正規の仕事、なかなか貯まらないお金——それは、その人が何かに負けた結果ではありません。
                      たまたま、この3つの持ち物のどれかを、十分に手渡されなかっただけのことがほとんどです。
                      アルパカすく〜るは、そのどこからでも学び直せる場所でありたいと考えています。
                    </p>
                    <p>
                      昔から、人が一人前になるには6つの技（六芸）が要ると言われてきました。
                      勉強・インプット（書・数）、仕事・実務（御・射）、人間関係・調和（礼・楽）の3領域です。
                      アルパカすく〜るは、その中でも特に「御・射（実行力・段取り力）」と「礼・楽（規範・調和の感性）」を育てることを担っています。
                    </p>
                  </div>
                </section>

                <section className="mb-12">
                  <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 mb-2">学びの中には、いつも8人の仲間がいる</h2>
                  <p className="text-sm text-gray-500 dark:text-gray-400 mb-4">4人のアルパカは「困りごと」を持ち込む役、4人のメンター（オバー・オジー）は「知識と生き方」を教える役です。</p>

                  <h3 className="text-sm font-bold text-gray-600 dark:text-gray-400 mb-2">4アルパカ｜困りごとを持ち込む仲間たち</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                    {ALPACAS.map((c) => <AlpacaMiniCard key={c.key} c={c} />)}
                  </div>

                  <h3 className="text-sm font-bold text-gray-600 dark:text-gray-400 mb-2">4メンター｜オバー・オジー</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {MENTORS.map((m) => <MentorMiniCard key={m.key} m={m} />)}

                  <div className="text-center mt-6">

                  </div>
                </section>

                <section className="mb-12">

                  <div className="bg-white dark:bg-gray-800 rounded-2xl p-6 text-center">

                    </div>
                    <a href="./series-guide.html" className="inline-block text-orange-600 dark:text-orange-400 font-bold hover:underline">

                <section className="mb-12">

                    </ol>
                  </div>
                </section>

                <section className="mb-12">
                  <h2 className="text-xl font-bold text-gray-800 dark:text-gray-100 mb-4">学びの先につながる場所</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <a href="./matrix-library.html" className="block rounded-2xl border-2 border-orange-200 dark:border-orange-800 bg-orange-50 dark:bg-orange-950 p-5 hover:bg-orange-100 dark:hover:bg-orange-900 transition">
                      <h3 className="font-extrabold text-orange-700 dark:text-orange-300 mb-1">📚 教材一覧</h3>

                      <p className="text-sm text-gray-600 dark:text-gray-400">沖縄のテーマごとに、シリーズをまとめて見渡せます。</p>

                      <h3 className="font-extrabold text-emerald-700 dark:text-emerald-300 mb-1">📖 沖縄文芸フリマ</h3>
                      <p className="text-sm text-gray-600 dark:text-gray-400">学びの先に、自分のことばで表現し、社会とつながる場所です。</p>
                    </a>
                    <a href="https://universe.tea-under.club/" target="_blank" rel="noopener noreferrer" className="block rounded-2xl border-2 border-blue-200 dark:border-blue-800 bg-blue-50 dark:bg-blue-950 p-5 hover:bg-blue-100 dark:hover:bg-blue-900 transition">

                    </p>
                    <div className="flex flex-wrap gap-3 justify-center mb-4">
                      {links.map((link) => (
                        <a
                          key={link.label}
                          href={link.url}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="px-5 py-2 rounded-full bg-emerald-500 text-white font-bold hover:bg-emerald-600 transition"
                        >
                          {link.label} 制作アシスト
                        </a>
                      ))}
                    </div>
                    <p className="text-xs text-gray-400 dark:text-gray-500 leading-relaxed">
                      学習の記録や保護者向けレポートの仕組みは、現在準備中です。
                    </p>
                  </div>
                </section>
              </div>

              <footer className="bg-gray-800 text-white p-6 text-sm mt-12">
                <div className="max-w-4xl mx-auto">
                  <p>
                    仕事は、誰かとのご縁。<br />
                    アルパカすく〜るは、その入口をつくります。
                    <br />
                    このコンテンツは、ご自宅から快適に学習できるよう設計されています。車椅子をご利用の方、高齢の方、外出が難しい方など、すべての方が楽しめるよう善処します。
                  </p>
                  <p className="mt-3 text-gray-300">
                    アルパカすく〜るは、プロジェクトでもイベントでもありません。人が、生き直すための回路です。
                  </p>
                  <a
                    href="./tokushoho.html"
                    className="inline-block mt-2 underline hover:text-emerald-300"
                  >
                    特定商取引法に基づく表記
                  </a>
                </div>
              </footer>
            </div>
            </div>
          );
        }

        createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
