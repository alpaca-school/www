<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>漢字よみとり名人 v2</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:#edf5ef;color:#203c34;font-family:system-ui,'Yu Gothic',Meiryo,sans-serif}main{max-width:720px;margin:auto}nav,.row{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}a{color:#245b48}button,select{font:inherit;min-height:44px;border:1px solid #a9bdb1;border-radius:14px;background:white;color:inherit;padding:10px 14px;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1767a0;outline-offset:3px}button:disabled{cursor:default;opacity:.65}section{background:white;border-radius:24px;padding:clamp(12px,3vw,25px);margin-top:12px;box-shadow:0 5px 20px #244d3510}h1{font-size:clamp(24px,5vw,36px);margin:12px 0}h2{font-size:20px;margin:8px 0}p{line-height:1.6;margin:8px 0}label{display:block;margin:14px 0 6px}select{width:100%}.primary{background:#246c50;color:white;font-weight:bold;border-color:#246c50}.wide{width:100%;margin-top:12px}#reading{font-size:clamp(40px,12vw,76px);font-weight:bold;text-align:center;background:#f4f7ef;border-radius:16px;padding:12px;overflow-wrap:anywhere}#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.choice{font-family:'Yu Kyokasho','Hiragino Mincho ProN','Yu Mincho',serif;font-size:clamp(52px,15vw,88px);line-height:1.2;min-height:74px;touch-action:manipulation;padding:6px}.choice.good{border:3px solid #248052;background:#e2f4e7;opacity:1}.choice.bad{border:3px solid #b66a14;background:#fff0d7;opacity:1}progress{width:100%;height:10px;accent-color:#246c50}#feedback{min-height:1.6em;font-weight:bold}#hintText{background:#fff3d9;padding:9px;border-radius:10px}footer{text-align:center;padding:12px;font-size:12px;color:#547065}[hidden]{display:none!important}details{margin-top:12px}@media(max-height:700px){h1{font-size:24px;margin:8px 0}section{padding:12px;margin-top:8px}#reading{font-size:40px;padding:6px}.choice{font-size:48px;min-height:60px}#choices{margin:8px 0;gap:6px}}
</style></head><body><main data-game-id="kanji-yomitori"><nav><a href="https://lab.alpaca-school.okinawa/">← 🔬 ラボいちらん</a><button id="sound" aria-pressed="false">🔇 おと OFF</button><button id="home" aria-label="タイトルがめんにもどる" hidden>⌂ ホーム</button></nav><h1>📖 <ruby>漢字<rt>かんじ</rt></ruby>よみとり<ruby>名人<rt>めいじん</rt></ruby></h1>
<section id="start"><h2>よみかたから かんじを さがそう！</h2><p>うえに でる よみかたを みて、あう字を えらぼう。</p><label for="mode">よみかた</label><select id="mode"><option value="on">音読み（おんよみ）</option><option value="kun">訓読み（くんよみ）</option><option value="mix">ミックス</option></select><p id="modeNote" role="status"></p><label for="level">レベル</label><select id="level"><option value="2">1：２つからえらぶ</option><option value="4">2：４つからえらぶ</option></select><label for="group">れんしゅうする字</label><select id="group"><option value="-1">ぜんぶ</option></select><button class="primary wide" id="begin">はじめる</button><details><summary>あそびかた</summary><p>（ ）の中は、おくりがなです。たとえば「か（ける）」なら「欠」をえらびます。じかんせいげんはありません。</p></details></section>
<section id="play" hidden><div class="row"><strong id="count"></strong><span id="points"></span></div><progress id="progress" max="10" value="0"></progress><h2>この よみかたの 字はどれ？</h2><p id="readingType" style="text-align:center;font-weight:bold"></p><div id="reading"></div><div id="choices"></div><div id="feedback" role="status" aria-live="polite"></div><p id="hintText" hidden></p><div class="row"><button id="hint">💡 ヒント</button><button id="next" class="primary" disabled>つぎへ →</button></div></section>
<section id="result" hidden><h2>🎉 おつかれさま！</h2><p id="summary"></p><p id="reviewText"></p><button class="primary wide" id="retry">もういちど あそぶ</button><button class="wide" id="review" hidden>まちがえた字を れんしゅう</button><p><a href="https://lab.alpaca-school.okinawa/">← ラボいちらんにもどる</a></p></section><nav aria-label="漢字学習シリーズ" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0;padding:12px;background:white;border-radius:16px"><a href="./kanji-miwake-v1.html" style="display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border:1px solid #a9bdb1;border-radius:12px;text-decoration:none;font-weight:bold">🔍 見分け</a><span aria-current="page" style="padding:12px 14px;font-weight:bold;background:#e6f4e8;border-radius:12px">📖 読み</span><a href="./kanji-tegaki-v1.html" style="display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border:1px solid #a9bdb1;border-radius:12px;text-decoration:none;font-weight:bold">✏️ 手書き</a></nav><footer>アルパカすく〜る · v2 · きろくはこのがめんだけ</footer></main>
<script>
'use strict';
// Each reading has curated distractors to avoid multiple valid answers.
const rows=[["矢", "シ", "弓で とばすもの。", "欠牛午", "on"], ["矢", "や", "弓で とばすもの。", "欠牛午", "kun"], ["欠", "ケツ", "一ぶぶんが なくなること。", "矢土士", "on"], ["欠", "か（ける）", "一ぶぶんが なくなること。", "矢土士", "kun"], ["未", "ミ", "まだ、という いみ。", "末木本", "on"], ["末", "マツ", "さいごの ほう。", "未木本", "on"], ["末", "すえ", "さいごの ほう。", "未木本", "kun"], ["土", "ド", "じめんに あるもの。", "士王玉", "on"], ["土", "つち", "じめんに あるもの。", "士王玉", "kun"], ["士", "シ", "ぶしの「し」。", "土木牛", "on"], ["牛", "ギュウ", "モーとなく どうぶつ。", "午犬鳥", "on"], ["牛", "うし", "モーとなく どうぶつ。", "午犬鳥", "kun"], ["午", "ゴ", "ごぜん・ごごの「ご」。", "牛千干", "on"], ["人", "ジン", "にんげんのこと。", "入犬大", "on"], ["人", "ひと", "にんげんのこと。", "入犬大", "kun"], ["入", "ニュウ", "なかへ すすむこと。", "人日目", "on"], ["入", "はい（る）", "なかへ すすむこと。", "人日目", "kun"], ["日", "ニチ", "たいようや、いちにち。", "目木本", "on"], ["日", "ひ", "たいようや、いちにち。", "目木本", "kun"], ["目", "モク", "ものを みるところ。", "日人入", "on"], ["目", "め", "ものを みるところ。", "日人入", "kun"], ["大", "ダイ", "ちいさいの はんたい。", "太犬天", "on"], ["大", "おお（きい）", "ちいさいの はんたい。", "太犬天", "kun"], ["太", "タイ", "ほそいの はんたい。", "犬天木", "on"], ["太", "ふと（い）", "ほそいの はんたい。", "犬天木", "kun"], ["犬", "ケン", "ワンとなく どうぶつ。", "大太天", "on"], ["犬", "いぬ", "ワンとなく どうぶつ。", "大太天", "kun"], ["天", "テン", "そらのこと。", "大太犬", "on"], ["天", "あめ", "そらのこと。", "大太犬", "kun"], ["王", "オウ", "おうさまの「おう」。", "玉主土", "on"], ["玉", "ギョク", "まるい もの。", "王主土", "on"], ["玉", "たま", "まるい もの。", "王主土", "kun"], ["主", "シュ", "あるものの もちぬし。", "王玉土", "on"], ["主", "ぬし", "あるものの もちぬし。", "王玉土", "kun"], ["木", "モク", "みきや えだが あるよ。", "本末未", "on"], ["木", "き", "みきや えだが あるよ。", "本末未", "kun"], ["本", "ホン", "ほんやさんで かうもの。", "木末未", "on"], ["本", "もと", "ものごとの はじまりや ねもと。", "木末未", "kun"], ["鳥", "チョウ", "はねが ある どうぶつ。", "烏犬牛", "on"], ["鳥", "とり", "はねが ある どうぶつ。", "烏犬牛", "kun"], ["烏", "ウ", "カーカーとなく とり。", "鳥犬牛", "on"], ["烏", "からす", "カーカーとなく とり。", "鳥犬牛", "kun"], ["待", "タイ", "くるまで まつこと。", "持特土", "on"], ["待", "ま（つ）", "くるまで まつこと。", "持特土", "kun"], ["持", "ジ", "てに もつこと。", "待特土", "on"], ["持", "も（つ）", "てに もつこと。", "待特土", "kun"], ["特", "トク", "とくべつの「とく」。", "待持土", "on"], ["緑", "リョク", "くさや はっぱの いろ。", "縁木本", "on"], ["緑", "みどり", "くさや はっぱの いろ。", "縁木本", "kun"], ["縁", "エン", "ひとと ひとの つながり。", "緑木本", "on"], ["縁", "ふち", "ものの はし。", "緑木本", "kun"], ["千", "セン", "1000のこと。", "干牛午", "on"], ["千", "ち", "1000のこと。", "干牛午", "kun"], ["干", "カン", "かわかすこと。", "千牛午", "on"], ["干", "ほ（す）", "かわかすこと。", "千牛午", "kun"]];
const groups=['矢欠','未末','土士','牛午','人入','日目','大太犬天','王玉主','木本末未','鳥烏','待持特','緑縁','千干'];
const $=id=>document.getElementById(id);const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
groups.forEach((g,i)=>{const o=document.createElement('option');o.value=i;o.textContent=[...g].join('・');$('group').append(o);});
let queue=[],pos=0,score=0,wrong=new Set(),answered=false,current=null,level=2,audio=false,ctx=null;
function show(id){['start','play','result'].forEach(x=>$(x).hidden=x!==id);$('home').hidden=id==='start';window.scrollTo(0,0);}
function question(r,lv){return {row:r,choices:shuffle([r[0],...(lv===2?[r[3][0]]:[...r[3]])])};}
function start(review=false){level=Number($('level').value);const g=Number($('group').value);const mode=$('mode').value;const pool=review?[...wrong]:rows.filter(r=>(mode==='mix'||r[4]===mode)&&(g<0||groups[g].includes(r[0])));if(!pool.length)return;queue=[];while(queue.length<10)queue.push(...shuffle(pool));queue=queue.slice(0,10);pos=0;score=0;wrong=new Set();show('play');render();}
function render(){answered=false;current=question(queue[pos],level);$('reading').textContent=current.row[1];$('readingType').textContent=current.row[4]==='on'?'🔵 おんよみ':'🟢 くんよみ';$('reading').style.background=current.row[4]==='on'?'#e5efff':'#e6f4e8';$('count').textContent=(pos+1)+' / '+queue.length;$('points').textContent='⭐ '+score;$('progress').value=pos;$('feedback').textContent='';$('hintText').textContent=current.row[2];$('hintText').hidden=true;$('next').disabled=true;$('next').textContent=pos===queue.length-1?'けっかへ →':'つぎへ →';$('choices').replaceChildren();current.choices.forEach(c=>{const b=document.createElement('button');b.className='choice';b.textContent=c;b.onclick=()=>answer(b,c);$('choices').append(b);});}
function answer(b,c){if(answered)return;answered=true;const ok=c===current.row[0];if(ok)score++;else wrong.add(current.row);for(const x of $('choices').children){x.disabled=true;if(x.textContent===current.row[0])x.classList.add('good');}if(!ok)b.classList.add('bad');$('feedback').textContent=(ok?'⭕ せいかい！ ':'もういちど くらべよう！ ')+current.row[0]+'：'+current.row[1];$('points').textContent='⭐ '+score;$('hintText').hidden=false;$('next').disabled=false;beep(ok);}
function beep(ok){if(!audio)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();ctx.resume().catch(()=>{});const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=ok?660:330;g.gain.value=.06;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.stop(ctx.currentTime+.2);}catch(e){}}
$('sound').onclick=()=>{audio=!audio;$('sound').textContent=audio?'🔊 おと ON':'🔇 おと OFF';$('sound').setAttribute('aria-pressed',String(audio));if(audio)beep(true);};function updateMode(){const mode=$('mode').value;const sel=$('group');for(const o of sel.options){const i=Number(o.value);o.disabled=i>=0&&!rows.some(r=>(mode==='mix'||r[4]===mode)&&groups[i].includes(r[0]));}if(sel.selectedOptions[0].disabled)sel.value='-1';$('modeNote').textContent=mode==='on'?'カタカナで よみを だすよ。':mode==='kun'?'ひらがなで よみを だすよ。':'２つの よみかたが でるよ。';} $('mode').onchange=updateMode;updateMode();$('begin').onclick=()=>start();$('home').onclick=()=>show('start');$('hint').onclick=()=>{$('hintText').hidden=!$('hintText').hidden;};$('next').onclick=()=>{if(!answered)return;if(++pos<queue.length){render();window.scrollTo(0,0);}else{$('summary').textContent=score+' / '+queue.length+' もん せいかい！';$('reviewText').textContent=wrong.size?'もういちど くらべよう： '+[...wrong].map(r=>r[0]+'（'+r[1]+'）').join(' ／ '):'ぜんもん せいかい！';$('review').hidden=!wrong.size;show('result');}};$('retry').onclick=()=>show('start');$('review').onclick=()=>start(true);
</script></body></html>
