<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>漢字てがき名人 v1</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));font-family:system-ui,Meiryo,sans-serif;color:#203c34;background:#edf5ef}main{max-width:620px;margin:auto}section{background:white;padding:14px;border-radius:20px;margin:10px 0}h1{font-size:clamp(22px,5vw,32px);margin:10px 0}h2{font-size:20px}p{margin:8px 0;line-height:1.5}button,select{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #a9bdb1;border-radius:12px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1767a0;outline-offset:3px}a{color:#245b48}label{display:block;margin:12px 0 4px}select{width:100%}.primary{background:#246c50;color:white;font-weight:bold}.wide{width:100%;margin-top:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.reading{text-align:center;font-size:clamp(26px,8vw,48px);font-weight:bold;background:#e6f4e8;border-radius:12px;padding:6px}.pad{position:relative;width:min(100%,330px,43dvh);min-width:min(100%,190px);aspect-ratio:1;margin:8px auto;border:2px solid #789789;border-radius:12px;overflow:hidden;background:white}.pad:before,.pad:after{content:"";position:absolute;pointer-events:none;z-index:0}.pad:before{left:50%;top:0;height:100%;border-left:1px dashed #bbcfc1}.pad:after{top:50%;left:0;width:100%;border-top:1px dashed #bbcfc1}#model{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Yu Kyokasho","Hiragino Mincho ProN","Yu Mincho",serif;font-size:clamp(120px,30dvh,260px);color:#a7c9ab;pointer-events:none;line-height:1}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;z-index:1}#sample{text-align:center;font-family:"Yu Kyokasho","Yu Mincho",serif;font-size:48px;line-height:1.2}#clue{text-align:center;font-size:15px}#feedback{text-align:center;font-weight:bold}progress{width:100%;accent-color:#246c50}footer{text-align:center;color:#547065;font-size:12px}[hidden]{display:none!important}@media(max-height:650px){h1{font-size:22px;margin:4px 0}section{padding:10px}.pad{width:min(100%,240px,39dvh)}}
</style></head><body><main data-game-id="kanji-tegaki"><div class="row"><a href="https://lab.alpaca-school.okinawa/">← 🔬 ラボいちらん</a><button id="sound" aria-pressed="false">🔇 おと OFF</button><button id="home" hidden aria-label="タイトルがめんにもどる">⌂ ホーム</button></div><h1>✏️ <ruby>漢字<rt>かんじ</rt></ruby>てがき<ruby>名人<rt>めいじん</rt></ruby></h1>
<section id="start"><h2>ゆびで かんじを かこう！</h2><label for="level">れんしゅうの しかた</label><select id="level"><option value="1">1：なぞりがき</option><option value="2">2：おてほんを みて かく</option><option value="3" selected>3：よみかたから かく</option></select><label for="mode">よみかた</label><select id="mode"><option value="kun">訓読み（くんよみ）</option><option value="on">音読み（おんよみ）</option><option value="mix">ミックス</option></select><button class="primary wide" id="begin">はじめる</button><details><summary>あそびかた</summary><p>マスにゆびやペンでかいて、こたえあわせをしよう。じぶんでおてほんとくらべて、かけたかどうかをえらびます。じどうの文字認識はありません。</p></details></section>
<section id="play" hidden><div class="row"><strong id="count"></strong><span id="type"></span></div><progress id="progress" max="10"></progress><div class="reading" id="reading"></div><p id="clue"></p><div id="sample" hidden></div><div class="pad"><div id="model" aria-hidden="true"></div><canvas id="pad" width="600" height="600" aria-label="手書きのマス"></canvas></div><div class="row"><button id="undo">ひとつ もどす</button><button id="clear">けす</button><button id="check" class="primary" disabled hidden>こたえあわせ</button></div><p id="feedback" role="status"></p><div class="row" id="judge" hidden><button id="again">もういちど れんしゅう</button><button id="yes" class="primary">かけた！</button></div></section>
<section id="result" hidden><h2>🎉 おつかれさま！</h2><p id="summary"></p><button class="primary wide" id="retry">もういちど あそぶ</button><button class="wide" id="review" hidden>もういちど れんしゅうする字</button></section><nav aria-label="漢字学習シリーズ" style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0;padding:12px;background:white;border-radius:16px"><a href="./kanji-miwake-v1.html" style="display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border:1px solid #a9bdb1;border-radius:12px;text-decoration:none;font-weight:bold">🔍 見分け</a><a href="./kanji-yomitori-v2.html" style="display:inline-flex;align-items:center;min-height:44px;padding:10px 14px;border:1px solid #a9bdb1;border-radius:12px;text-decoration:none;font-weight:bold">📖 読み</a><span aria-current="page" style="padding:12px 14px;font-weight:bold;background:#e6f4e8;border-radius:12px">✏️ 手書き</span></nav><footer>アルパカすく〜る · v1 · じぶんで こたえあわせ</footer></main><script>
"use strict";const rows=[["矢","シ","弓で とばすもの。","on"],["矢","や","弓で とばすもの。","kun"],["欠","ケツ","一ぶぶんが なくなること。","on"],["欠","か（ける）","一ぶぶんが なくなること。","kun"],["未","ミ","まだ、という いみ。","on"],["末","マツ","さいごの ほう。","on"],["末","すえ","さいごの ほう。","kun"],["土","ド","じめんに あるもの。","on"],["土","つち","じめんに あるもの。","kun"],["士","シ","ぶしの「し」。","on"],["牛","ギュウ","モーとなく どうぶつ。","on"],["牛","うし","モーとなく どうぶつ。","kun"],["午","ゴ","ごぜん・ごごの「ご」。","on"],["人","ジン","にんげんのこと。","on"],["人","ひと","にんげんのこと。","kun"],["入","ニュウ","なかへ すすむこと。","on"],["入","はい（る）","なかへ すすむこと。","kun"],["日","ニチ","たいようや、いちにち。","on"],["日","ひ","たいようや、いちにち。","kun"],["目","モク","ものを みるところ。","on"],["目","め","ものを みるところ。","kun"],["大","ダイ","ちいさいの はんたい。","on"],["大","おお（きい）","ちいさいの はんたい。","kun"],["太","タイ","ほそいの はんたい。","on"],["太","ふと（い）","ほそいの はんたい。","kun"],["犬","ケン","ワンとなく どうぶつ。","on"],["犬","いぬ","ワンとなく どうぶつ。","kun"],["天","テン","そらのこと。","on"],["天","あめ","そらのこと。","kun"],["王","オウ","おうさまの「おう」。","on"],["玉","ギョク","まるい もの。","on"],["玉","たま","まるい もの。","kun"],["主","シュ","あるものの もちぬし。","on"],["主","ぬし","あるものの もちぬし。","kun"],["木","モク","みきや えだが あるよ。","on"],["木","き","みきや えだが あるよ。","kun"],["本","ホン","ほんやさんで かうもの。","on"],["本","もと","ものごとの はじまりや ねもと。","kun"],["鳥","チョウ","はねが ある どうぶつ。","on"],["鳥","とり","はねが ある どうぶつ。","kun"],["烏","ウ","カーカーとなく とり。","on"],["烏","からす","カーカーとなく とり。","kun"],["待","タイ","くるまで まつこと。","on"],["待","ま（つ）","くるまで まつこと。","kun"],["持","ジ","てに もつこと。","on"],["持","も（つ）","てに もつこと。","kun"],["特","トク","とくべつの「とく」。","on"],["緑","リョク","くさや はっぱの いろ。","on"],["緑","みどり","くさや はっぱの いろ。","kun"],["縁","エン","ひとと ひとの つながり。","on"],["縁","ふち","ものの はし。","kun"],["千","セン","1000のこと。","on"],["千","ち","1000のこと。","kun"],["干","カン","かわかすこと。","on"],["干","ほ（す）","かわかすこと。","kun"]];
const $=id=>document.getElementById(id),c=$("pad"),ctx=c.getContext("2d");let paths=[],active=null,pid=null,queue=[],pos=0,score=0,wrong=[],level=3,checked=false,sound=false,ac=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){["start","play","result"].forEach(x=>$(x).hidden=x!==id);$("home").hidden=id==="start";window.scrollTo(0,0);}
function draw(){ctx.clearRect(0,0,600,600);ctx.lineWidth=13;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#203c34";for(const p of paths){ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);for(const a of p)ctx.lineTo(a[0],a[1]);if(p.length===1)ctx.lineTo(p[0][0]+.1,p[0][1]);ctx.stroke();}$("check").disabled=checked||!paths.length;$("check").hidden=checked||!paths.length;$("undo").disabled=checked||!paths.length;$("clear").disabled=checked||!paths.length;}
function point(e){const r=c.getBoundingClientRect();return [Math.max(0,Math.min(600,(e.clientX-r.left)*600/r.width)),Math.max(0,Math.min(600,(e.clientY-r.top)*600/r.height))];}
c.addEventListener("pointerdown",e=>{if(checked||pid!==null||e.button!==0)return;e.preventDefault();pid=e.pointerId;c.setPointerCapture(pid);active=[point(e)];paths.push(active);draw();});
c.addEventListener("pointermove",e=>{if(active&&e.pointerId===pid){active.push(point(e));draw();}});
function end(e){if(e.pointerId===pid){active=null;pid=null;}}c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);c.addEventListener("lostpointercapture",end);
function resetInk(){paths=[];active=null;pid=null;draw();}
function start(review=false){level=Number($("level").value);const mode=$("mode").value;const pool=review?wrong.slice():rows.filter(r=>mode==="mix"||r[3]===mode);if(!pool.length)return;queue=[];while(queue.length<10)queue.push(...shuffle(pool));queue=queue.slice(0,10);pos=0;score=0;wrong=[];show("play");render();}
function render(){checked=false;const r=queue[pos];$("count").textContent=(pos+1)+" / "+queue.length;$("progress").value=pos;$("type").textContent=r[3]==="on"?"🔵 おんよみ":"🟢 くんよみ";$("reading").textContent=r[1];$("reading").style.background=r[3]==="on"?"#e5efff":"#e6f4e8";$("clue").textContent=r[2];$("sample").textContent=r[0];$("sample").hidden=level!==2;$("model").textContent=level===1?r[0]:"";$("model").hidden=level!==1;$("feedback").textContent="";$("judge").hidden=true;resetInk();}
function check(){if(!paths.length||checked)return;checked=true;$("model").hidden=false;$("model").textContent=queue[pos][0];$("feedback").textContent="おてほん："+queue[pos][0]+"　じぶんの字と くらべよう！";$("judge").hidden=false;draw();}
function beep(){if(!sound)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=ac||new AC();ac.resume().catch(()=>{});const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=600;g.gain.value=.05;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.15);}catch(e){}}
function next(ok){if(!checked)return;if(ok){score++;beep();}else if(!wrong.includes(queue[pos]))wrong.push(queue[pos]);if(++pos<queue.length){render();window.scrollTo(0,0);}else{$("summary").textContent="じぶんで かけたと えらんだ数："+score+" / "+queue.length+" もん";$("review").hidden=!wrong.length;show("result");}}
$("begin").onclick=()=>start();$("retry").onclick=()=>show("start");$("home").onclick=()=>show("start");$("review").onclick=()=>start(true);$("undo").onclick=()=>{if(!checked){paths.pop();draw();}};$("clear").onclick=()=>{if(!checked)resetInk();};$("check").onclick=check;$("again").onclick=()=>next(false);$("yes").onclick=()=>next(true);$("sound").onclick=()=>{sound=!sound;$("sound").textContent=sound?"🔊 おと ON":"🔇 おと OFF";$("sound").setAttribute("aria-pressed",String(sound));};
</script></body></html>
