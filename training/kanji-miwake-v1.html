<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>漢字みわけ名人 v1</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:#edf5ef;color:#203c34;font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;overflow-wrap:anywhere}main{max-width:720px;margin:auto}nav{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}a{color:#245b48}button,select{font:inherit;min-height:44px;border-radius:14px;border:1px solid #a9bdb1;padding:10px 14px;background:white;color:#203c34;cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1767a0;outline-offset:3px}button:disabled{cursor:default;opacity:.65}h1{font-size:clamp(24px,5vw,36px);margin:15px 0 8px}h2{font-size:21px;margin:8px 0}section{background:white;border-radius:24px;padding:clamp(12px,3vw,25px);margin-top:12px;box-shadow:0 5px 20px #244d3510}p{line-height:1.55;margin:8px 0}label{display:block;margin:14px 0 6px}select{width:100%}.primary{background:#246c50;color:white;border-color:#246c50;font-weight:bold}.wide{width:100%;margin-top:12px}#choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}#choices.grid6{grid-template-columns:repeat(3,minmax(0,1fr))}.glyph{font-family:"Yu Kyokasho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:500;line-height:1.18}.target{font-size:clamp(64px,19vw,110px);text-align:center;background:#f4f7ef;border-radius:16px;padding:4px}.choice{font-size:clamp(48px,13vw,88px);padding:6px;min-width:0;min-height:74px;touch-action:manipulation}.grid6 .choice{font-size:clamp(40px,11vw,72px)}.choice.good{border:3px solid #248052;background:#e2f4e7;color:#165c39;opacity:1}.choice.bad{border:3px solid #b66a14;background:#fff0d7;opacity:1}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}progress{width:100%;height:10px;accent-color:#246c50}#feedback{min-height:1.5em;font-weight:bold}#hintText{background:#fff3d9;padding:9px;border-radius:10px}small{color:#547065}details{margin-top:12px}footer{text-align:center;padding:12px;font-size:12px;color:#547065}[hidden]{display:none!important}@media(max-height:700px){h1{margin:8px 0;font-size:24px}section{margin-top:8px;padding:12px}.target{font-size:65px}.choice{font-size:48px;min-height:60px}#choices{gap:6px;margin:8px 0}}
</style></head><body><main data-game-id="kanji-miwake"><nav><a href="https://lab.alpaca-school.okinawa/">← 🔬 ラボ<ruby>一覧<rt>いちらん</rt></ruby></a><button id="sound" aria-pressed="false">🔇 おと OFF</button><button id="home" aria-label="タイトルがめんにもどる" hidden>⌂ ホーム</button></nav><h1>🔍 <ruby>漢字<rt>かんじ</rt></ruby>みわけ<ruby>名人<rt>めいじん</rt></ruby></h1>
<section id="start"><h2>かたちの ちがいを みつけよう！</h2><p>よくにた<ruby>漢字<rt>かんじ</rt></ruby>を、ゆっくりくらべよう。</p><label for="level">レベル</label><select id="level"><option value="1">1：２つからえらぶ</option><option value="2">2：４つからえらぶ</option><option value="3">3：ちがう字をさがす</option></select><label for="group">れんしゅうする<ruby>漢字<rt>かんじ</rt></ruby></label><select id="group"><option value="-1">ぜんぶ</option></select><button class="primary wide" id="begin">はじめる</button><details><summary>あそびかた</summary><p>おなじ字、または１つだけちがう字をタップします。ヒントもつかえます。じかんせいげんはありません。まちがえた字は、あとでもういちどれんしゅうできます。</p></details></section>
<section id="play" hidden><div class="row"><strong id="count"></strong><span id="points"></span></div><progress id="progress" max="10" value="0"></progress><h2 id="prompt"></h2><div class="target glyph" id="target"></div><div id="choices"></div><div id="feedback" role="status" aria-live="polite"></div><p id="hintText" hidden></p><div class="row"><button id="hint">💡 ヒント</button><button id="next" class="primary" disabled>つぎへ →</button></div></section>
<section id="result" hidden><h2>🎉 おつかれさま！</h2><p id="summary"></p><p id="reviewText"></p><button class="primary wide" id="retry">もういちど あそぶ</button><button class="wide" id="review" hidden>まちがえた字を れんしゅう</button><a href="https://lab.alpaca-school.okinawa/" style="display:block;text-align:center;margin-top:16px">← ラボいちらんにもどる</a></section><footer>アルパカすく〜る · v1 · きろくはこのがめんだけ</footer></main>
<script>
"use strict";
const groups=[
{chars:["矢","欠"],hint:"矢には横の線が２本あるよ。欠は上が小さな形で、下に人のような形があるよ。"},
{chars:["未","末"],hint:"未は下の横線が長い。末は上の横線が長い。"},
{chars:["土","士"],hint:"土は下の横線が長い。士は上の横線が長い。"},
{chars:["牛","午"],hint:"牛はたて線がいちばん上の横線より上に出るよ。"},
{chars:["人","入"],hint:"人と入は、２本の線が合わさるところがちがうよ。"},
{chars:["日","目"],hint:"中の横線を数えよう。日は１本、目は２本。"},
{chars:["大","太","犬","天"],hint:"点の位置や、上に横線があるかを見よう。"},
{chars:["王","玉","主"],hint:"点がある場所をくらべよう。"},
{chars:["木","本","末","未"],hint:"横線の位置と長さをくらべよう。"},
{chars:["鳥","烏"],hint:"鳥には目のような横線があるよ。"},
{chars:["待","持","特"],hint:"左側の形をくらべよう。"},
{chars:["緑","縁"],hint:"右側の下の形をくらべよう。"},
{chars:["千","干"],hint:"いちばん上の線の向きを見よう。"}
];
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const all=[...new Set(groups.flatMap(g=>g.chars))];
groups.forEach((g,i)=>{const o=document.createElement("option");o.value=i;o.textContent=g.chars.join("・");$("group").append(o);});
let level=1,queue=[],pos=0,score=0,wrong=new Set(),answered=false,current=null,audio=false,ctx=null;
function show(id){["start","play","result"].forEach(x=>$(x).hidden=x!==id);$("home").hidden=id==="start";window.scrollTo(0,0);}
function makeQuestion(g,lv){const [target,other]=shuffle(g.chars);if(lv===3)return {target:other,choices:shuffle([target,target,target,target,target,other]),base:target};let pool=shuffle(g.chars.filter(c=>c!==target));if(lv===2)pool=pool.concat(shuffle(all.filter(c=>!g.chars.includes(c))));return {target,choices:shuffle([target,...pool.slice(0,lv===1?1:3)])};}
function start(review=false){level=Number($("level").value);const selected=Number($("group").value);let pool=review?[...wrong]:selected<0?groups.map((_,i)=>i):[selected];if(!pool.length)return;queue=[];while(queue.length<10)queue.push(...shuffle(pool));queue=queue.slice(0,10);pos=0;score=0;wrong=new Set();show("play");render();}
function render(){answered=false;const g=groups[queue[pos]];current=makeQuestion(g,level);$("count").textContent=(pos+1)+" / "+queue.length;$("points").textContent="⭐ "+score;$("progress").value=pos;$("prompt").textContent=level===3?"１つだけ ちがう字は？":"おなじ字を さがそう！";$("target").hidden=level===3;$("target").textContent=current.target;$("feedback").textContent="";$("hintText").hidden=true;$("hintText").textContent=level===3?"おおくある字は「"+current.base+"」。 "+g.hint:g.hint;$("next").disabled=true;$("next").textContent=pos===queue.length-1?"けっかへ →":"つぎへ →";const el=$("choices");el.replaceChildren();el.className=level===3?"grid6":"";current.choices.forEach((c,i)=>{const b=document.createElement("button");b.className="choice glyph";b.textContent=c;b.setAttribute("aria-label",c+" "+(i+1));b.addEventListener("click",()=>answer(b,c));el.append(b);});}
function answer(b,c){if(answered)return;answered=true;const ok=c===current.target;if(ok)score++;else wrong.add(queue[pos]);for(const x of $("choices").children){x.disabled=true;if(x.textContent===current.target)x.classList.add("good");}if(!ok)b.classList.add("bad");$("feedback").textContent=ok?"⭕ せいかい！":"正解は「"+current.target+"」。よくくらべよう！";$("points").textContent="⭐ "+score;$("hintText").hidden=false;$("next").disabled=false;beep(ok);}
function beep(ok){if(!audio)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();ctx.resume().catch(()=>{});const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=ok?660:330;g.gain.value=.06;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.stop(ctx.currentTime+.2);}catch(e){}}
$("sound").onclick=()=>{audio=!audio;$("sound").textContent=audio?"🔊 おと ON":"🔇 おと OFF";$("sound").setAttribute("aria-pressed",String(audio));if(audio)beep(true);};
$("begin").onclick=()=>start();$("home").onclick=()=>show("start");$("hint").onclick=()=>{$("hintText").hidden=!$("hintText").hidden;};$("next").onclick=()=>{if(!answered)return;if(++pos<queue.length){render();window.scrollTo(0,0);}else{$("summary").textContent=score+" / "+queue.length+" もん せいかい！";$("reviewText").textContent=wrong.size?"もういちど くらべよう： "+[...wrong].map(i=>groups[i].chars.join("・")).join(" ／ "):"ぜんもん せいかい！";$("review").hidden=!wrong.size;show("result");}};$("retry").onclick=()=>show("start");$("review").onclick=()=>start(true);
</script></body></html>
