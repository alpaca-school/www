<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅のクエスト｜AI旅行コンシェルジュ（仮称）</title>
<style>
:root{--ink:#1f2933;--sub:#5b6773;--blue:#3266a8;--blue2:#e8f0fc;--green:#28764d;--green2:#e2f3e9;--red:#b94a40;--red2:#fce8e6;--amber:#9a6b00;--amber2:#fff4d6;--purple:#8054aa;--line:#d7dde4}
*{box-sizing:border-box}
html,body{margin:0}
body{font:18px/1.7 "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:var(--ink);min-height:100vh;
 background:linear-gradient(#dcebff 0,#f4f9ff 45%,#fdf6e8 100%)}
#app{max-width:760px;margin:0 auto;padding:10px 12px 150px}
.hud{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:8px 12px;border:1px solid var(--line);flex-wrap:wrap}
.hud b{font-size:16px}
.chip{background:var(--blue2);color:var(--blue);border-radius:999px;padding:2px 12px;font-size:15px;white-space:nowrap}
.chip.red{background:var(--red2);color:var(--red)}
.bar{height:10px;background:#e3e8ee;border-radius:99px;overflow:hidden;flex:1;min-width:90px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4f9bd9,#28a06b);transition:width .4s}
.map{display:flex;gap:4px;overflow-x:auto;padding:10px 2px;margin:6px 0}
.map button{flex:1 0 74px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 2px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink);line-height:1.3}
.map button .ic{display:block;font-size:24px}
.map button.cur{border-color:var(--blue);background:var(--blue2);font-weight:700}
.map button.done{border-color:var(--green);background:var(--green2)}
.scene{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.avatar{flex:0 0 78px}
.bubble{position:relative;flex:1;background:#fff;border:2px solid var(--blue);border-radius:18px;padding:12px 16px;animation:pop .25s ease-out}
.bubble:before{content:"";position:absolute;left:-12px;top:22px;border:8px solid transparent;border-right:12px solid var(--blue);border-left:0}
.bubble small{display:block;color:var(--sub);font-size:14px}
.bubble .q{font-weight:700}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-30px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.choices{display:grid;gap:10px;margin-top:8px}
.btn{min-height:54px;border:2px solid var(--blue);background:#fff;color:var(--blue);border-radius:14px;font:inherit;font-weight:700;padding:10px 14px;cursor:pointer;text-align:left}
.btn:hover{background:var(--blue2)}
.btn.main{background:var(--blue);color:#fff;text-align:center}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn.sm{min-height:42px;padding:6px 12px;font-size:15px}
.btn.ghost{border-color:var(--line);color:var(--sub)}
:focus-visible{outline:4px solid #f2a900;outline-offset:2px}
label{display:block;font-size:15px;color:var(--sub);margin:8px 0 2px}
input,select,textarea{width:100%;font:inherit;padding:11px;border:2px solid #c5ccd4;border-radius:10px;background:#fff;color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.card h2{margin:0 0 6px;font-size:20px}
.alert{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:16px}
.alert.red{background:var(--red2);color:#7a2a22}.alert.amber{background:var(--amber2);color:#6b4a00}.alert.green{background:var(--green2);color:#1b5436}
.pill{display:inline-block;border-radius:99px;padding:0 10px;font-size:14px}
.p-ok{background:var(--green2);color:var(--green)}.p-todo{background:var(--red2);color:var(--red)}.p-ask{background:var(--amber2);color:var(--amber)}.p-na{background:#eceff2;color:var(--sub)}
pre.out{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:16px;background:#f3f5f8;border:1px solid var(--line);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.title{text-align:center;padding:24px 8px}
.title h1{font-size:30px;margin:8px 0}
.title p{color:var(--sub)}
.dock{flex-wrap:wrap;position:fixed;left:0;right:0;bottom:0;background:#fffe;border-top:1px solid var(--line);padding:8px;display:flex;gap:8px;justify-content:center;backdrop-filter:blur(6px);z-index:9}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#ffd44d;color:#4a3800;font-weight:700;border-radius:99px;padding:6px 18px;animation:up 1s ease-out forwards;z-index:20}
.big{font-size:44px;text-align:center}
.btn.xl{min-height:84px;font-size:22px;padding:16px 20px;touch-action:manipulation;text-align:center}
.btn.sel{background:var(--blue);color:#fff;border-color:#254b7d}
.btn.xl.main{min-height:96px;font-size:26px}
.xlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.stepper{display:flex;gap:16px;align-items:center;justify-content:center;margin-top:10px}
.stepper .btn{flex:0 0 96px;font-size:38px;text-align:center;padding:0}
.stepper .count{flex:1;text-align:center;font-size:60px;font-weight:700;line-height:1}
.stepper .count small{font-size:22px;margin-left:4px}
.sum{text-align:center;font-weight:700;margin:14px 0 0;min-height:1.7em}
a.btn{display:inline-block;text-decoration:none;text-align:center;line-height:1.4}
.q-item{border-top:1px solid var(--line);padding:10px 0}
.q-item:first-child{border-top:0}
.done-q{opacity:.55}
@media print{.dock,.map,.hud,button{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div id="app"></div>
<div class="dock" id="dock"></div>
<script>
"use strict";
const KEY="travel-quest-v1";
const ST=[
 {n:"はじめに",ic:"🎒",intro:"まずは旅のあらましを教えてね。ここから「個別旅行支援計画」を一緒に育てていくよ。"},
 {n:"① 事前調査",ic:"🏨",intro:"ステージ①は計画と事前調査。宿・介助者・病院など、旅の土台を固めよう。"},
 {n:"② 出発前",ic:"🧳",intro:"ステージ②は出発1〜2週間前。荷造りと、普段の生活支援を両立できるか見ていくよ。"},
 {n:"③ 搭乗",ic:"✈️",intro:"ステージ③は出発と飛行機。自宅から到着先のホテルまでの流れを確認しよう。"},
 {n:"④ 観光",ic:"🗺️",intro:"ステージ④は観光・イベント。移動経路とトイレ、介助者を押さえよう。"},
 {n:"⑤ 夜間",ic:"🌙",intro:"ステージ⑤は宿泊と夜間の生活支援。ここが一番の山場になりやすいよ。"},
 {n:"緊急時",ic:"🛟",intro:"もしものときの備えを作ろう。旅全体を守るステージだよ。"},
 {n:"費用",ic:"💴",intro:"最後は費用。全体の見通しを立てよう。"}
];
const CHK=[["確認できた","ok"],["問い合わせ中・手配中","ask"],["まだ・これから","todo"],["今回は不要","na"]];
const METH=[["公的制度で確保","ok"],["自費の事業者で確保","ok"],["友人・知人にお願いする","ok"],["家族にお願いする","ok"],["まだ決まっていない","todo"],["対応してもらえない","todo"]];
const chk=(id,st,label,q,tip,inq,opts)=>({id,st,type:"choice",label,q,tip,inq,opts:opts||CHK,memo:true});
const care=(id,st,label,q,tip,inq)=>({id,st,type:"choice",label,q,tip,inq,opts:METH,memo:true,care:true});
const ALL=[
 {id:"basic",st:0,type:"form",q:"どこへ、いつ行く？ 分かるところだけでだいじょうぶ！",fields:[
  {k:"dest",l:"行きたい場所",ph:"例: 東京"},{k:"purpose",l:"目的・イベント",ph:"例: ライブ観覧"},
  {k:"start",l:"出発日",t:"date"},{k:"end",l:"帰着日",t:"date"}],
  after:D=>(D.start&&D.end&&D.end<D.start)?"帰着日が出発日より前になっているみたい。あとで直せるよ。":(D.dest?`${D.dest}への旅だね。さっそく進めよう！`:"OK、決まったところから進めよう！")},
 {id:"who",st:0,type:"who",q:"だれと行く？ あてはまるものを押してね。まちがえても、もう一度押せば取り消せるよ。ゆっくりで大丈夫！"},
 {id:"pass",st:1,type:"form",q:"まず「車椅子パスポート」をつくろう。一度登録すれば、問い合わせ文に何度でも使えるよ。",fields:[
  {k:"wKind",l:"車椅子の種類",ph:"電動車椅子 / ティルト式 など"},{k:"wModel",l:"メーカー・型式"},{k:"wSize",l:"寸法（全長×全幅×全高 mm）",ph:"例: 1000×620×1100"},
  {k:"wWeight",l:"重量（本体 / 搭乗時総重量 kg）"},{k:"wBat",l:"バッテリーの種類・容量",ph:"例: リチウムイオン 24V 12Ah"},
  {k:"wBatRm",l:"バッテリーの取り外し",opts:["わからない","可","不可","要工具"]},{k:"wTrans",l:"移乗の方法",opts:["未入力","全介助","一部介助","リフト使用","自力"]},{k:"wNote",l:"その他の留意点",ph:"クッション、姿勢保持など"}],
  after:D=>"登録できたよ。あとで問い合わせ文に自動で入るからね。"},
 chk("hotel",1,"バリアフリー対応ホテル","泊まるホテルは、車椅子で使えるバリアフリー客室かどうか確認できた？","客室の仕様はホテルごとにまちまち。「旅の計画書」の問い合わせ文で一気に確認しよう。","hotel"),
 chk("room",1,"浴室・トイレ・ベッドの仕様","浴室・トイレ・ベッドの段差、広さ、高さは確認できた？","ベッドの高さと周りの空間は移乗に直結するよ。問い合わせ文に確認項目を入れてあるよ。","hotel"),
 care("helper",1,"旅行先での介助者の確保","旅行中の介助は、主にどうやって確保する？","旅行先は契約できる事業者が少なめ。友人や家族との分担も含めて、早めに候補を探そう。","helper"),
 chk("hosp",1,"受診できる医療機関","旅行先で受診できる病院は調べた？","滞在先の近くで受診できる病院を1か所は押さえておくと安心。後の「緊急時」ステージで連絡先も登録するよ。",""),
 chk("repair",1,"車椅子の修理業者","旅行先で電動車椅子が故障したとき、頼れる修理業者は調べた？","メーカーの出張対応や代替機の貸出があるか、出発前に聞いておこう。",""),
 {id:"pack",st:2,type:"form",q:"荷造りに介助者の手を使うと、普段の食事や生活の支援が圧迫されちゃうんだ。数字で見てみよう！",fields:[
  {k:"pDays",l:"準備に使える日数",t:"number",ph:"例: 14"},{k:"pHours",l:"1日に使えるヘルパー等の介助時間（時間）",t:"number",ph:"例: 6"},
  {k:"pDaily",l:"そのうち、食事・排泄など日常生活に必要な時間",t:"number",ph:"例: 5"},{k:"pHelp",l:"荷造りで介助者の手が必要な時間（合計）",t:"number",ph:"例: 4"}],
  after:D=>{const spare=(+D.pHours-+D.pDaily)*+D.pDays,need=+D.pHelp;
   if([spare,need].some(isNaN)||D.pDays===""||D.pHours===""||D.pHelp==="") return "数字は分かる範囲でOK。あとから直せるよ。";
   if(need>spare){setQ("pack","荷造りの介助時間が足りない","荷造りを数日に分ける、友人に手伝ってもらう、必要な品を減らすなどで調整しよう。",2,"");return `余力は ${spare.toFixed(1)} 時間、荷造りに ${need} 時間必要。日常の支援が圧迫されそう。クエストに追加したよ。`;}
   clearQ("pack");return `余力 ${spare.toFixed(1)} 時間に対して、荷造りは ${need} 時間。日常の支援と両立できそう！`;}},
 chk("hadj",2,"ヘルパーの利用時間調整","出発前後のヘルパー利用時間は、事業所と調整できた？","出発前後は利用時間が増えやすいよ。早めに事業所へ相談しよう。",""),
 chk("meal",2,"食事など日常支援との両立","準備期間も、食事など日常の支援を今まで通り受けられそう？","旅行準備のせいで日常支援が減らないよう、誰がどの時間を担うか書き出してみよう。",""),
 chk("batt",2,"電動車椅子の仕様・バッテリー確認","電動車椅子の仕様とバッテリー（種類・容量・取り外し）は確認できた？","航空機に載せるときの条件に直結するよ。取扱説明書かメーカーで容量を確認しよう。","air"),
 chk("aird",2,"航空会社への事前申告","航空会社への事前申告は済んだ？","申告期限は会社ごとに違うよ。問い合わせ文で、預け入れ条件と移乗支援をまとめて確認しよう。","air"),
 chk("g1",3,"自宅から空港までの移動","自宅から空港までの移動手段は決まった？","福祉タクシーや家族の送迎など、乗り換えの少ない手段が安心だよ。","taxi"),
 chk("g2",3,"搭乗口までの車椅子利用","空港内で、搭乗口までの車椅子の使い方は確認できた？","自分の車椅子をどこまで使えるかは空港・航空会社で異なるよ。","air"),
 chk("g3",3,"機内用車椅子・座席への移乗","機内用車椅子や座席への移乗の支援は手配できた？","移乗を誰が担当するか、航空会社に事前に聞いておこう。","air"),
 chk("g4",3,"到着空港からホテルへの移動","到着した空港からホテルまでの移動は決まった？","車椅子のまま乗れる車両の予約が必要になることが多いよ。","taxi"),
 chk("t1",4,"観光中の移動経路","徒歩・電車・車での移動経路は、段差やエレベーターまで確認できた？","目的地ごとに「段差のない経路」を調べておくと当日が楽になるよ。","venue"),
 chk("t2",4,"福祉タクシーの確保","福祉タクシーは確保できた？","繁忙期は早めに埋まるよ。往復と待ち時間もあわせて相談しよう。","taxi"),
 chk("t3",4,"車椅子対応トイレ","ライブ会場などの車椅子対応トイレは、場所と広さを確認できた？","電動車椅子で入れる広さか、会場へ問い合わせるのが確実だよ。","venue"),
 care("t4",4,"観光中の介助者","観光やイベント中の介助は、どうやって確保する？","観光中の同行者の負担も大きいから、交代できる人がいると安心だよ。","helper"),
 care("n1",5,"入浴介助","宿泊先での「入浴介助」は、どうする？","入浴介助は事業者によって対応が分かれるよ。友人・家族に頼むなら、ホテルの浴室仕様も要確認。","helper"),
 care("n2",5,"ベッドへの移乗","「ベッドへの移乗」は、どうする？","ベッドの高さと周りの空間を確認して、移乗の担当者を決めておこう。","helper"),
 care("n3",5,"就寝・起床時の介助","「就寝・起床時の介助」は、どうする？","朝晩の時間帯は、事業者の対応時間と合うか確認が必要だよ。","helper"),
 care("n4",5,"夜間の排泄介助","一番大事な「夜間の排泄介助」は、どうする？","公的制度も自費も夜間は難しい事例があるよ。友人など別の手段を含めて、新しい供給手段の検討が必要。","helper"),
 {id:"emer",st:6,type:"form",q:"もしものときの連絡先を登録しよう。空欄はクエストとして残るよ。",fields:[
  {k:"eMed",l:"受診できる医療機関（名称）"},{k:"eMedTel",l:"電話番号",t:"tel"},
  {k:"eRep",l:"車椅子の修理・代替機（業者名）"},{k:"eRepTel",l:"電話番号",t:"tel"},
  {k:"eAlt",l:"介助者が来られなくなったときの代替（名前・事業者）"},{k:"eAltTel",l:"電話番号",t:"tel"}],
  after:D=>{const L=[["med",D.eMed,"受診できる医療機関を登録する","受診可能な医療機関は、滞在先の近くで1か所は確保しよう。"],["rep",D.eRep,"車椅子の修理・代替機を確保する","故障時の出張修理や代替機の貸出を、出発前に確認しよう。"],["alt",D.eAlt,"代替の介助者を決める","介助者が来られなくなる事態に備えて、第2候補を決めておこう。"]];
   let miss=0;L.forEach(([k,v,t,tip])=>{if(!String(v||"").trim()){miss++;setQ("em:"+k,t,tip,6,"")}else clearQ("em:"+k)});
   return miss?`未登録が ${miss} 件あるよ。クエストに追加したから、決まったら戻ってきてね。`:"連絡先を記録しました。対応可否と電話番号を確認してください。";}},
 {id:"cost",st:7,type:"form",q:"見込み費用を教えて。分かるところだけでOK！",fields:[
  {k:"cHotel",l:"宿泊（円）",t:"number"},{k:"cTrans",l:"交通（円）",t:"number"},{k:"cCare",l:"介助（円）",t:"number"},{k:"cOther",l:"イベント・その他（円）",t:"number"},
  {k:"cPayer",l:"主な負担者",opts:["未定","本人","友人・同行者","公的制度","その他"]}],
  after:D=>{const t=["cHotel","cTrans","cCare","cOther"].reduce((a,k)=>a+(+D[k]||0),0);
   if(D.cPayer==="未定"){setQ("cost","費用の負担者を決める","旅行費用の負担は制度・資金面の対策が必要になることがあるよ。自治体や事業者に個別に確認しよう。",7,"");}else clearQ("cost");
   return `合計の見込みは ${yen(t)}。${D.cPayer==="未定"?"負担者が未定なのでクエストに追加したよ。":"ここまでお疲れさま！"}`;}}
];
const SRCH={e_move:"taxi",hosp:"hosp",repair:"repair",t2:"taxi",g1:"taxi",g4:"taxi","em:med":"hosp","em:rep":"repair"};
/* ===== かんたんモード用の質問（さわるだけ）===== */
const ECHK=[["できている・だいじょうぶ","ok"],["これから・手伝ってほしい","todo"],["今回は必要ない","na"]];
const EMETH=[["公的制度のヘルパー","ok"],["自費の事業者","ok"],["家族・友人","ok"],["まだ・相談したい","todo"]];
const E=(id,st,label,q,tip,extra)=>Object.assign({id,st,type:"choice",label,q,tip,inq:"",opts:ECHK,easyOnly:true},extra||{});
const ins=(before,...ns)=>ALL.splice(ALL.findIndex(n=>n.id===before),0,...ns);
ins("who",
 E("e_where",0,"行き先","どこへ行きたい？","行き先が決まったら、「くわしく入力」で場所を書くと、探す機能が使いやすくなるよ。",{qt:"行き先を決める",opts:[["沖縄県内","ok",{dest:"沖縄県内"}],["九州・本州","ok",{dest:"九州・本州"}],["北海道","ok",{dest:"北海道"}],["海外","ok",{dest:"海外"}],["まだ決まっていない","todo"]]}),
 E("e_when",0,"時期","いつごろ行きたい？","時期が決まると、予約や介助者の手配が進めやすくなるよ。",{qt:"時期を決める",opts:[["1か月以内","ok",{when:"1か月以内"}],["2〜3か月先","ok",{when:"2〜3か月先"}],["半年以上先","ok",{when:"半年以上先"}],["まだ決まっていない","todo"]]}));
ins("hotel",E("e_chair",1,"車椅子の種類","いつも使っている車椅子は？","",{opts:[["電動車椅子","ok",{wKind:"電動車椅子"}],["手動車椅子","ok",{wKind:"手動車椅子"}],["ティルト・リクライニング式","ok",{wKind:"ティルト・リクライニング式の車椅子"}],["使っていない","ok",{wKind:"車椅子は使わない"}]]}));

/* ===== 計画書・問い合わせ文 ===== */
const SL={ok:"✓ 確認済み",ask:"▲ 手配中",todo:"● 未解決",na:"－ 今回は不要"};
function passText(){
  const D=S.D,r=[["車椅子の種類","wKind"],["メーカー・型式","wModel"],["寸法","wSize"],["重量","wWeight"],["バッテリー","wBat"],["バッテリー取り外し","wBatRm"],["移乗方法","wTrans"],["留意点","wNote"]];
  return r.filter(([,k])=>D[k]&&!["わからない","未入力"].includes(D[k])).map(([l,k])=>`・${l}：${D[k]}`).join("\n");
}
function readinessNotice(){
 const relevant=NODES.filter(n=>n.care);
 const missing=relevant.filter(n=>!S.A[n.id]||!["ok","na"].includes(S.A[n.id].s));
 return (missing.length?"介助者は確保できていません（未確認・手配中を含む）："+missing.map(n=>n.label).join("、")+"。":"入力上の介助状況を記録しました。")+" 旅行の可否は本人・支援者が実際の条件を確認して判断してください。";
}
function reportText(){
  const D=S.D,L=[];
  L.push("【個別旅行支援計画】",readinessNotice());
  L.push(`行き先：${D.dest||"未入力"}／目的：${D.purpose||"未入力"}`);
  L.push(`日程：${(D.start||D.end)?(D.start||"未定")+" 〜 "+(D.end||"未定"):(D.when||"未定")}／同行：${D.people||"未入力"}`);
  const p=passText();if(p){L.push("","■ 車椅子パスポート",p)}
  ST.forEach((s,i)=>{
    const ns=nodesOf(i).filter(n=>n.type==="choice");if(!ns.length)return;
    L.push("","■ "+s.n);
    ns.forEach(n=>{const a=S.A[n.id];if(!a){L.push(`・${n.label}：（未回答）`);return}
      L.push(`・${n.label}：${n.care?a.label:SL[a.s]}${n.care&&a.s==="todo"?" ●":""}${a.note?`（${a.note}）`:""}`)});
  });
  if(S.D.pDays!==undefined&&S.D.pHelp!==undefined){const sp=(+D.pHours-+D.pDaily)*+D.pDays;L.push("","■ 荷造りと日常支援",`・荷造りに必要な介助 ${D.pHelp||0} 時間／準備期間の余力 ${isNaN(sp)?"—":sp.toFixed(1)} 時間`)}
  const em=[["医療機関",D.eMed,D.eMedTel],["修理・代替機",D.eRep,D.eRepTel],["代替介助者",D.eAlt,D.eAltTel]].filter(x=>x[1]);
  if(em.length){L.push("","■ 緊急時の連絡先",...em.map(([k,n,t])=>`・${k}：${n}${t?" "+t:""}`))}
  const tot=["cHotel","cTrans","cCare","cOther"].reduce((a,k)=>a+(+D[k]||0),0);
  if(D.cPayer){L.push("","■ 費用",`・宿泊 ${yen(D.cHotel)}／交通 ${yen(D.cTrans)}／介助 ${yen(D.cCare)}／その他 ${yen(D.cOther)}`,`・合計 ${yen(tot)}／主な負担者：${D.cPayer}`)}
  if(D.budget)L.push("","■ 予算のめやす","・"+D.budget);
  if(S.C.length){L.push("","■ 探した候補（キープ）",...S.C.map(c=>`・[${catOf(c.cat).t}] ${c.name}${c.tel?" "+c.tel:""}（${c.st}）${c.memo?" "+c.memo:""}`))}
  const oq=openQ();
  L.push("","■ 未解決事項（クエスト）",...(oq.length?oq.map(([,q])=>`● ${q.title}`):["なし"]));
  return L.join("\n");
}
const INQN={hotel:"ホテル",air:"航空会社",taxi:"福祉タクシー",helper:"介助事業者",venue:"会場・観光施設"};
function inqText(k){
  const D=S.D,d=v=>v||"（未入力）",pass=passText()||"・（車椅子パスポート未入力）";
  const head=`お世話になっております。\n${D.start?D.start+"〜"+(D.end||"未定"):(D.when||"日程未定")}に${d(D.dest)}への旅行を予定しております（${d(D.people)}）。\n`;

  try{

document.addEventListener("click",e=>{

  const a=b.dataset.act;

  else if(a==="cont"){S.view="play";render()}
  else if(a==="ans"){const o=optsOf(NODES[S.i])[+b.dataset.i];if(o)answer(o[0],o[1],o[2])}

  else if(a==="stage"){const st=+b.dataset.st,ns=nodesOf(st),t=ns.find(n=>!S.A[n.id])||ns[0];go(NODES.indexOf(t))}
  else if(a==="back"){if(S.view==="play"&&S.react){S.react=null;render()}else if(S.view==="play"){go(S.i-1)}else if(S.view==="report"){go(NODES.length-1)}else{S.view="play";render()}}
  else if(a==="memoopen"){S.memoOpen=NODES[S.i].id;S.memoType=false;render()}
  else if(a==="memoclose"){saveTa();S.memoOpen=null;save();render()}
  else if(a==="chip"){saveTa();const m=M(NODES[S.i].id),t=b.dataset.t;m.sel=m.sel.includes(t)?m.sel.filter(x=>x!==t):[...m.sel,t];save();render()}

  else if(a==="formok")submitForm();
  else if(a==="addc")addCand();
  else if(a==="who"){const k=b.dataset.k;let s=S.D.whoSet||[];
    if(k==="solo")s=s.includes("solo")?[]:["solo"];else{s=s.filter(x=>x!=="solo");s=s.includes(k)?s.filter(x=>x!==k):[...s,k]}
    S.D.whoSet=s;syncPeople();save();render()}
  else if(a==="cnt"){S.D.cManual=true;S.D.count=(+S.D.count||1)+(+b.dataset.d);syncPeople();save();render()}
  else if(a==="whook"){syncPeople();whoDone(S.D.people?`${S.D.people}で行くんだね！`:"同行者はあとで決めよう。")}
  else if(a==="whoskip"){S.D.whoSet=[];S.D.cManual=false;syncPeople();whoDone("OK、同行者はあとで決めよう。")}
  else if(a==="search"){S.view="search";S.sc=b.dataset.c||null;save();render();if(S.sc)document.getElementById("cat-"+S.sc)?.scrollIntoView();else window.scrollTo(0,0)}
  else if(a==="delc"){S.C=S.C.filter(c=>c.id!==b.dataset.id);save();render()}
  else if(a==="quests"){S.view="quests";render();window.scrollTo(0,0)}
  else if(a==="report"){S.view="report";render();window.scrollTo(0,0)}
  else if(a==="home"){const t=NODES.findIndex(n=>!S.A[n.id]);if(t<0){S.view="report";render()}else go(t)}
  else if(a==="solve"){if(S.Q[b.dataset.id]&&confirm("実際の対応可否・日時・必要な条件を確認しましたか？")){S.Q[b.dataset.id].done=true;const A=S.A[b.dataset.id];if(A){A.s="ok"; A.label=ALL.find(n=>n.id===b.dataset.id)?.care?A.label+"（確保確認済み）":"確認済み";}save();toast("⭐ +3 クエスト解決！");render()}}
  else if(a==="goto"){const id=b.dataset.id.split(":")[0],i=NODES.findIndex(n=>n.id===id);if(i>=0)go(i)}
  else if(a==="inq"){S.showInq=b.dataset.k;render()}
  else if(a==="copy"){const t=b.dataset.t==="inq"?inqText(S.showInq):reportText();const done=()=>{b.textContent="コピーしました"};
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(done,()=>fb(t,done));else fb(t,done)}
  else if(a==="dl"){const u=URL.createObjectURL(new Blob([reportText()],{type:"text/plain;charset=utf-8"}));const x=document.createElement("a");x.href=u;x.download="個別旅行支援計画.txt";x.click();URL.revokeObjectURL(u)}
  else if(a==="erase"){if(confirm("この端末に保存された旅行計画をすべて削除しますか？")){localStorage.removeItem(KEY);location.reload();}}
 else if(a==="print")window.print();
});
function fb(t,done){const x=document.createElement("textarea");x.value=t;document.body.appendChild(x);x.select();try{document.execCommand("copy");done()}catch(_){}x.remove()}
render();
</script>
</body>
</html>
