<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>音響機材接続マスター v2</title><style>
*{box-sizing:border-box}body{margin:0;background:#102c2a;color:#e9f8f0;font:16px system-ui,sans-serif;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}main{max-width:540px;margin:auto}h1{font-size:clamp(21px,5vw,28px);margin:4px 0}p{margin:6px 0;line-height:1.5}small{color:#a9d4c4}button,select{min-height:44px;font:inherit;border:1px solid #85b2a0;border-radius:12px;padding:8px;background:#264943;color:white;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ffd675}button:disabled{opacity:.5}header,.row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.row>*{flex:1}svg{display:block;width:100%;height:min(52dvh,410px);min-height:250px;background:#173936;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none}#msg{min-height:24px;font-weight:bold;color:#ffe092}#score{font-weight:bold;color:#8bf0bd}footer{font-size:12px;color:#a9d4c4;margin-top:8px}[hidden]{display:none!important}progress{width:100%;accent-color:#8bf0bd}select{width:100%}label{display:block;font-size:14px;margin:5px 0}.port{cursor:pointer}.port:focus{outline:none;stroke:white;stroke-width:3}svg text{pointer-events:none}svg .device{fill:#244c45;stroke:#729b8b;stroke-width:1.2}@media(max-height:680px){body{padding:8px}h1{font-size:20px;margin:2px 0}#msg{font-size:14px;min-height:22px;margin:3px 0}svg{height:min(46dvh,300px);min-height:250px}footer{margin-top:3px}label{margin:2px 0}#play .row{margin-top:4px!important}}@media(prefers-reduced-motion:no-preference){.guide{animation:glow 1.5s infinite alternate}@keyframes glow{to{opacity:.45}}}
#cable-buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:4px 0}#cable-buttons button{min-height:44px;font-size:13px;overflow-wrap:anywhere;padding:5px}#cable-buttons button[aria-pressed=true]{background:#ffd675;color:#102c2a;border-color:#ffd675;font-weight:bold}#cable-label{font-size:13px;margin-top:4px}#cable-buttons button{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;column-gap:5px;row-gap:0;min-height:60px;padding:4px 6px;line-height:1.2}#cable-buttons .cable-art{width:52px;height:32px;min-height:0;background:transparent;border-radius:0;touch-action:auto;flex:none;pointer-events:none}#cable-buttons .cable-name{font-size:13px;font-weight:bold}#cable-buttons .cable-use{font-size:11px;flex-basis:100%}@media(min-width:500px){#cable-buttons .cable-art{width:75px;height:43px}}</style></head><body><main data-game-id="audio-connection-v2"><small>ALPACA SCHOOL TRAINING · 試験公開</small><h1>音響機材接続マスター</h1><section id="start"><p>光る端子から、指でケーブルを引こう！</p><label for="level">練習コース</label><select id="level"><option value="1">入門：光をなぞる</option><option value="2">実践：自分でつなぐ</option><option value="3">応用：ケーブルも選ぶ</option></select><button id="begin" style="width:100%;margin-top:12px">スタート</button><p><small>指でもマウスでも操作できます。端子を順番にタップする操作にも対応。</small></p></section><section id="play" hidden><header><span id="score"></span><button id="restart">やり直す</button></header><progress id="progress" max="1" value="0"></progress><p id="msg" role="status" aria-live="polite"></p><svg id="board" viewBox="0 0 320 340" aria-label="音響機材と接続端子"></svg><div id="choices" hidden><div id="cable-label">ケーブルの種類を選ぼう</div><div id="cable-buttons" role="group" aria-labelledby="cable-label"><button type="button" data-cable="0" aria-pressed="false"><svg class="cable-art" viewBox="0 0 130 75" aria-hidden="true" focusable="false"><path d="M5 38 H37" stroke="#182626" stroke-width="10" stroke-linecap="round"/><rect x="29" y="22" width="49" height="32" rx="6" fill="#9faeaf"/><path d="M37 22 V54 M44 22 V54" stroke="#677677" stroke-width="3"/><ellipse cx="85" cy="38" rx="23" ry="25" fill="#aab8b8"/><ellipse cx="87" cy="38" rx="18" ry="20" fill="#293738"/><g fill="#e2c67d"><circle cx="87" cy="27" r="4"/><circle cx="77" cy="45" r="4"/><circle cx="97" cy="45" r="4"/></g></svg><span class="cable-name">XLR</span><span class="cable-use">マイク用</span></button><button type="button" data-cable="1" aria-pressed="false"><svg class="cable-art" viewBox="0 0 130 75" aria-hidden="true" focusable="false"><path d="M5 38 H37" stroke="#182626" stroke-width="10" stroke-linecap="round"/><rect x="30" y="23" width="42" height="30" rx="6" fill="#536466"/><path d="M40 25 V51 M47 25 V51 M54 25 V51" stroke="#829293" stroke-width="2"/><path d="M72 30 H111 L122 38 L111 46 H72 Z" fill="#c7d0ce"/><path d="M86 30 V46 M102 30 V46" stroke="#273b39" stroke-width="4"/></svg><span class="cable-name">TRS</span><span class="cable-use">ライン音声用</span></button><button type="button" data-cable="2" aria-pressed="false"><svg class="cable-art" viewBox="0 0 130 75" aria-hidden="true" focusable="false"><path d="M5 38 H37" stroke="#182626" stroke-width="10" stroke-linecap="round"/><rect x="29" y="22" width="35" height="32" rx="5" fill="#233b42"/><rect x="57" y="15" width="38" height="46" rx="7" fill="#397aa7"/><path d="M64 18 V58 M72 18 V58 M80 18 V58 M88 18 V58" stroke="#265471" stroke-width="3"/><rect x="95" y="22" width="23" height="32" rx="4" fill="#354649"/><rect x="97" y="16" width="12" height="9" rx="2" fill="#bbc7c7"/></svg><span class="cable-name">SpeakON型</span><span class="cable-use">スピーカー用</span></button><button type="button" data-cable="3" aria-pressed="false"><svg class="cable-art" viewBox="0 0 130 75" aria-hidden="true" focusable="false"><path d="M5 38 H37" stroke="#182626" stroke-width="10" stroke-linecap="round"/><rect x="30" y="24" width="36" height="28" rx="4" fill="#668eaf"/><rect x="63" y="15" width="53" height="46" rx="3" fill="#a4c0c9" stroke="#d3e4e6" stroke-width="2"/><path d="M68 18 V37 M74 18 V37 M80 18 V37 M86 18 V37 M92 18 V37 M98 18 V37 M104 18 V37 M110 18 V37" stroke="#c8a34d" stroke-width="3"/><rect x="76" y="43" width="25" height="23" rx="2" fill="#c2d5d9"/></svg><span class="cable-name">LAN</span><span class="cable-use">ネットワーク用</span></button></div></div><div class="row" style="margin-top:8px"><button id="hint">ヒント</button><button id="undo">1本取り消す</button></div></section><section id="result" hidden><h2>接続クリア！</h2><p id="summary"></p><button id="retry">もう一度</button> <button id="next">次のコース</button></section><footer>仮想機材による練習です。実機の配線は取扱説明書と担当者の確認に従ってください。個人情報・成績は送信しません。</footer></main><script>
'use strict';const $=id=>document.getElementById(id),svg=$('board'),ns='http://www.w3.org/2000/svg';const names=['マイク','ミキサー','アンプ','スピーカー','送信機','受信機','遠隔ミキサー'];const boxes=[[160,24],[160,91],[75,168],[75,245],[245,168],[245,245],[245,318]];const edges=[[0,1,0,160,44,160,70],[1,2,1,120,111,75,147],[2,3,2,75,188,75,224],[1,4,1,200,111,245,147],[4,5,3,245,188,245,224],[5,6,1,245,265,245,297]];let cable=0;let level=1,limit=3,done=[],errors=0,hints=0,selected=-1,drag=null,guide=false;const cableNames=['XLR マイク用','ライン音声用','スピーカー用','LAN用'];function el(t,a,txt){const n=document.createElementNS(ns,t);for(const [k,v] of Object.entries(a))n.setAttribute(k,v);if(txt)n.textContent=txt;svg.append(n);return n}function show(id){for(const s of ['start','play','result'])$(s).hidden=s!==id}function msg(t){$('msg').textContent=t}function nextEdge(){return edges.findIndex((e,i)=>i<limit&&!done.includes(i))}function port(i,side){const e=edges[i];return side===0?[e[3],e[4]]:[e[5],e[6]]}function curve(a,b){return 'M'+a[0]+' '+a[1]+' C'+a[0]+' '+((a[1]+b[1])/2)+' '+b[0]+' '+((a[1]+b[1])/2)+' '+b[0]+' '+b[1]}function draw(){svg.replaceChildren();svg.setAttribute('viewBox',limit===3?'0 0 320 280':'0 0 320 340');for(let i=0;i<(limit===3?4:7);i++){const [x,y]=boxes[i];el('rect',{x:x-57,y:y-20,width:114,height:40,rx:8,class:'device'});el('text',{x,y:y+4,'text-anchor':'middle',fill:'#fff','font-size':13},names[i])}const n=nextEdge();for(let i=0;i<limit;i++){if(done.includes(i)||(level===1&&i===n)||guide&&i===n)el('path',{d:curve(port(i,0),port(i,1)),fill:'none',stroke:done.includes(i)?'#8bf0bd':'#ffd675','stroke-width':done.includes(i)?5:2,'stroke-dasharray':done.includes(i)?'none':'5 5'});for(let s=0;s<2;s++){const [x,y]=port(i,s),active=(level===1||guide)&&i===n;el('circle',{cx:x,cy:y,r:done.includes(i)?7:13,fill:done.includes(i)?'#8bf0bd':active?'#ffd675':s===0?'#82c9e9':'#b1d6c8',stroke:selected===i&&s===0?'#fff':'#102c2a','stroke-width':3,class:active&&!done.includes(i)?'guide port':'port'});el('text',{x,y:y+3,'text-anchor':'middle','font-size':9,fill:'#102c2a'},done.includes(i)?'✓':s===0?'出':'入')}}if(drag)el('path',{d:curve(port(drag.i,0),drag.point),fill:'none',stroke:'#ffe092','stroke-width':5,'stroke-linecap':'round','pointer-events':'none'});$('score').textContent=done.length+' / '+limit+' 本　ミス '+errors;$('progress').max=limit;$('progress').value=done.length;$('undo').disabled=!done.length}function point(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const m=svg.getScreenCTM();return m?(()=>{const q=p.matrixTransform(m.inverse());return [q.x,q.y]})():[0,0]}function hit(p,side){let best=-1,dist=Infinity;for(let i=0;i<limit;i++){if(done.includes(i))continue;const q=port(i,side),d=Math.hypot(p[0]-q[0],p[1]-q[1]);if(d<Math.max(24,22/(svg.getScreenCTM()?.a||1))&&d<dist){best=i;dist=d}}return best}function connect(i,j){if(i!==j||(level===1&&i!==nextEdge())||(level===3&&cable!==edges[i][2])){errors++;msg('端子の組み合わせやケーブルを確認しよう。');selected=-1;draw();return}done.push(i);selected=-1;guide=false;msg('接続成功！ '+names[edges[i][0]]+' → '+names[edges[i][1]]);draw();if(done.length===limit){$('summary').textContent=limit+'本の接続に成功！ ミス '+errors+'回・ヒント '+hints+'回';$('next').hidden=level===3;show('result')}}svg.addEventListener('pointerdown',e=>{if(drag||e.button!==0)return;const p=point(e),i=hit(p,0),j=hit(p,1);if(selected>=0&&j>=0&&(i<0||Math.hypot(p[0]-port(j,1)[0],p[1]-port(j,1)[1])<Math.hypot(p[0]-port(i,0)[0],p[1]-port(i,0)[1]))){connect(selected,j);return}if(i<0)return;selected=i;drag={i,point:p,start:p,id:e.pointerId};svg.setPointerCapture(e.pointerId);draw()});svg.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;drag.point=point(e);draw()});svg.addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;const p=point(e),i=drag.i,d=Math.hypot(p[0]-drag.start[0],p[1]-drag.start[1]);drag=null;const j=hit(p,1);if(j>=0&&d>12)connect(i,j);else if(d>14){selected=-1;msg('入力端子の近くまで引いてみよう。');draw()}else{msg('次に入力端子をタップしても接続できます。');draw()}});svg.addEventListener('pointercancel',()=>{drag=null;selected=-1;draw()});function begin(){level=Number($('level').value);limit=level===1?3:6;done=[];errors=0;hints=0;guide=false;drag=null;selected=-1;setCable(0);$('choices').hidden=level!==3;show('play');msg(level===1?'黄色の出力端子から入力端子までなぞろう。':'出力端子から正しい入力端子へつなごう。');draw()}$('begin').onclick=begin;$('restart').onclick=begin;$('retry').onclick=begin;$('next').onclick=()=>{$('level').value=String(Math.min(3,level+1));begin()};$('hint').onclick=()=>{const i=nextEdge();if(i<0)return;hints++;guide=true;msg(names[edges[i][0]]+' → '+names[edges[i][1]]+(level===3?' ／ '+cableNames[edges[i][2]]:''));draw()};$('undo').onclick=()=>{done.pop();selected=-1;drag=null;guide=false;msg('接続を1本取り消しました。');draw()};function setCable(n){cable=n;for(const b of document.querySelectorAll('[data-cable]'))b.setAttribute('aria-pressed',String(Number(b.dataset.cable)===n))}for(const b of document.querySelectorAll('[data-cable]'))b.onclick=()=>{setCable(Number(b.dataset.cable));selected=-1;drag=null;draw()};setCable(0);
</script></body></html>
