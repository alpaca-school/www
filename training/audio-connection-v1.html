<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>音響機材接続マスター v1</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));font-family:system-ui,Meiryo,sans-serif;color:#203c34;background:#edf5ef}main{max-width:620px;margin:auto}section{background:white;padding:14px;border-radius:20px;margin:10px 0}h1{font-size:clamp(22px,5vw,32px);margin:10px 0}h2{font-size:20px}p{margin:8px 0;line-height:1.5}button,select{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #a9bdb1;border-radius:12px;background:white;color:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #1767a0;outline-offset:3px}a{color:#245b48}label{display:block;margin:12px 0 4px}select{width:100%}.primary{background:#246c50;color:white;font-weight:bold}.wide{width:100%;margin-top:12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
progress{width:100%;accent-color:#246c50}footer{font-size:13px;color:#547065}fieldset{border:0;padding:0;margin:12px 0;min-width:0}legend{font-weight:bold;margin-bottom:6px}.ports{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ports button{text-align:left;overflow-wrap:anywhere}.ports button[aria-pressed=true]{background:#246c50;color:white}.ports small{display:block}svg{width:100%;height:auto;display:block;background:#172c35;border-radius:12px}#feedback{min-height:3em;font-weight:bold}button.wide{margin-top:8px}[hidden]{display:none!important}p,li{overflow-wrap:break-word;word-break:normal;line-break:strict}button:focus-visible{outline:3px solid #1767a0;outline-offset:2px}
</style></head><body><main data-game-id="audio-connection-v1"><div class="row"><a href="../">← アルパカすく〜る</a><button id="home" hidden>⌂ ホーム</button></div><h1>音響機材接続マスター</h1><p>ALPACA SCHOOL TRAINING</p>
<section id="start"><h2>音の通り道をつくろう</h2><label for="level">レベル</label><select id="level"><option value="1">初級：マイクとミキサー</option><option value="2">中級：スピーカーまで</option><option value="3">上級：遠隔音声伝送</option></select><label for="mode">練習方法</label><select id="mode"><option value="practice">ヒントあり</option><option value="exam">ヒントなし</option></select><button class="primary wide" id="begin">はじめる</button><details><summary>遊び方</summary><p>ケーブルを選び、出力端子、入力端子の順にタップします。正しい接続は緑色の線になります。すべて接続したらクリアです。</p><p>一般化した架空の訓練機器です。実機の操作手順ではありません。</p></details></section>
<section id="play" hidden><div class="row"><strong id="count"></strong><span id="errors"></span></div><progress id="progress" max="1" value="0"></progress><svg id="diagram" viewBox="0 0 320 365" role="img" aria-label="音声接続図"></svg><label for="cable">1. ケーブルを選ぶ</label><select id="cable"><option value="0">XLR マイクケーブル</option><option value="1">バランス・ライン音声ケーブル</option><option value="2">スピーカーケーブル</option><option value="3">LANケーブル</option></select><fieldset><legend>2. 出力端子を選ぶ</legend><div id="outs" class="ports"></div></fieldset><fieldset><legend>3. 入力端子を選ぶ</legend><div id="ins" class="ports"></div></fieldset><p id="feedback" role="status" aria-live="polite"></p><div class="row"><button id="hint">ヒント</button><button id="undo">接続を1つ戻す</button></div><button class="primary wide" id="finish" disabled>接続チェック</button></section>
<section id="result" hidden><h2>接続完了！</h2><p id="summary"></p><p>音の流れ：入力 → ミキサー → 出力。ケーブルの種類と信号の方向を確認しましょう。</p><button class="primary wide" id="retry">もう一度</button><button class="wide" id="next">次のレベルへ</button></section><footer>アルパカすく〜る Training · v1 · 仮想機材による接続練習。実機の配線は取扱説明書と担当者の確認に従ってください。</footer></main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const devices=["マイク","ミキサー","アンプ","スピーカー","送信機","受信機","遠隔ミキサー"];
const portsOut=[["マイク","MIC OUT",0],["ミキサー","MAIN OUT",1],["アンプ","SPEAKER OUT",2],["ミキサー","AUX OUT",1],["送信機","LAN OUT",4],["受信機","LINE OUT",5]];
const portsIn=[["ミキサー","MIC IN",1],["アンプ","LINE IN",2],["スピーカー","SPEAKER IN",3],["送信機","LINE IN",4],["受信機","LAN IN",5],["遠隔ミキサー","LINE IN",6]];
const kinds=[0,1,2,1,3,1];
const cableNames=["XLR マイクケーブル","ライン音声ケーブル","スピーカーケーブル","LANケーブル"];
const positions=[[160,25],[160,85],[77,155],[77,230],[243,155],[243,230],[243,305]];
const paths=["M160 44 V66","M128 104 V120 H77 V136","M77 174 V211","M192 104 V120 H243 V136","M243 174 V211","M243 249 V286"];
let limit=1,done=[],out=-1,errors=0;
function show(id){for(const x of ["start","play","result"])$(x).hidden=x!==id;$("home").hidden=id==="start";window.scrollTo(0,0)}
function message(s){$("feedback").textContent=s}
function draw(){const svg=$("diagram");svg.setAttribute("viewBox",limit===1?"0 0 320 112":limit===3?"0 0 320 260":"0 0 320 340");svg.replaceChildren();const ns="http://www.w3.org/2000/svg";function el(tag,attrs,text){const node=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))node.setAttribute(k,v);if(text)node.textContent=text;svg.append(node)}for(let i=0;i<limit;i++)el("path",{d:paths[i],fill:"none",stroke:done.includes(i)?"#70e5ae":"#6c8996","stroke-width":done.includes(i)?4:1.5,"stroke-dasharray":done.includes(i)?"none":"4 5"});const n=limit===1?2:limit===3?4:7;for(let i=0;i<n;i++){const [x,y]=positions[i];el("rect",{x:x-64,y:y-19,width:128,height:38,rx:8,fill:"#253f49",stroke:"#9bb5bd"});el("text",{x,y:y+4,"text-anchor":"middle",fill:"#fff","font-size":12},devices[i])}}
function render(){ $("count").textContent="接続 "+done.length+" / "+limit;$("errors").textContent="ミス "+errors+" 回";$("progress").max=limit;$("progress").value=done.length;$("finish").disabled=done.length!==limit;$("undo").disabled=!done.length;draw();for(const [id,items,isOut] of [["outs",portsOut,true],["ins",portsIn,false]]){const parent=$(id);parent.replaceChildren();items.slice(0,limit).forEach((p,i)=>{const b=document.createElement("button");b.type="button";b.append(document.createTextNode(p[0]));const s=document.createElement("small");s.textContent=p[1]+(done.includes(i)?" ✓":"");b.append(s);b.disabled=done.includes(i);if(isOut)b.setAttribute("aria-pressed",String(out===i));b.onclick=()=>{if(isOut){out=i;message("接続先の入力端子を選んでください。");render();parent.children[i].focus();return}if(out<0){message("先に出力端子を選びましょう。");return}if(out===i&&Number($("cable").value)===kinds[i]){done.push(i);message("接続成功！ "+portsOut[i][0]+" → "+portsIn[i][0])}else{errors++;message("接続先またはケーブルの種類を確認しましょう。")}out=-1;render()};parent.append(b)})}}
function begin(){limit=[0,1,3,6][Number($("level").value)];done=[];out=-1;errors=0;$("cable").value="0";$("hint").hidden=$("mode").value==="exam";message("ケーブルを選んで接続を始めましょう。");show("play");render()}
$("begin").onclick=begin;$("home").onclick=()=>show("start");$("retry").onclick=begin;$("cable").onchange=()=>{out=-1;message("出力端子を選んでください。");render()};$("undo").onclick=()=>{done.pop();out=-1;message("最後の接続を取り消しました。");render()};$("hint").onclick=()=>{const i=kinds.findIndex((_,i)=>i<limit&&!done.includes(i));message(i<0?"すべて接続済みです。":portsOut[i][0]+" "+portsOut[i][1]+" → "+portsIn[i][0]+" "+portsIn[i][1]+" ／ "+cableNames[kinds[i]])};$("finish").onclick=()=>{if(done.length!==limit)return;$("summary").textContent=limit+"経路の接続に成功。誤接続 "+errors+"回。";$("next").hidden=limit===6;show("result")};$("next").onclick=()=>{$("level").value=String(Math.min(3,Number($("level").value)+1));begin()};
</script></body></html>
