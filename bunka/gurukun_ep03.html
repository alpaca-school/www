<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><script>const pageVersion = "20260817-1"; const pageUrl = new URL(window.location.href); if (pageUrl.searchParams.get("v") !== pageVersion) { pageUrl.searchParams.set("v", pageVersion); window.location.replace(pageUrl.toString()); }</script><title>群れの動きを、リズムにできる？【知能の窓・グルクン ep3：音楽編】 🐟</title><script src="../series-nav-data.js"></script><script src="https://cdn.tailwindcss.com"></script><script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script><script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script><script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><style>body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}p, li {word-break:normal;overflow-wrap:break-word;line-break:strict}.speech-bubble{min-width:0;max-width:100%}.speech-bubble p{white-space:normal;overflow-wrap:anywhere}.choice-card{min-width:0}.choice-row{display:flex;align-items:flex-start;gap:.75rem;min-width:0;max-width:100%}.choice-row .speech-bubble{flex:1 1 0;width:0}.choice-check{flex:0 0 auto}.progress-dots {display:none}@media(min-width:640px){.progress-dots {display:flex}}.chara-avatar{width:56px;height:56px;border-radius:9999px;object-fit:cover;flex-shrink:0}.print-sheet{position:fixed;left:-9999px;top:0}@media print{body *{visibility:hidden}.print-sheet,.print-sheet *{visibility:visible}.print-sheet{position:absolute;left:0;top:0}}.furigana-off rt{display:none}</style></head><body><div id="root"></div><script type="text/babel">
const {useState}=React,{createRoot}=ReactDOM;const D={"n":"03","title":"群れの動きを、リズムにできる？","kind":"音楽編","subject":"音楽・総合","mi":"音楽","mentor":"rikiya","mentorText":"まとまる→広がる→向きを変える。観察した群れの印象を、手拍子・机のタップ・短い声でリズムへ翻訳しよう。","intro":["グルクンの特技は「群れること」と県公式ページで紹介されている。","魚の行動を完全再現するのではなく、動きの印象を3つの音で表現しよう。"],"wrong":["ずっと同じ大きな音だけで群れを表す！","魚の本当の音だと断定する！","速さも間も全部同じにする！","観察せず唯一の正解リズムを決める！"],"options":["タンタン（まとまる）→間→パッ（広がる）→トン（向きを変える）","大音量を続けるだけ","魚が実際にこの音を出すと断定","全員が同じ表現でなければ誤り"],"correct":0,"verify":"まとまる・広がる・向きを変えるを、速さ・間・まとまりの違う音で表そう。","imagine":"魚・鳥・人など、まとまって動くものを一つ選び、3つの音で表すなら？","student":"群れの動きの印象を、繰り返し・速さ・間のあるリズムへ変えたね。","standards":["音楽3〜6年：拍・リズム・反復・即興","総合：海の生き物"],"notes":["音楽表現であり、魚の行動や音を科学的に完全再現するものではありません。"],"sources":[{"label":"沖縄県栽培漁業センター「ぐるクン」","url":"https://www.pref.okinawa.jp/shigoto/suisangyo/1011078/1022282/1011091.html"}],"series":"知能の窓・グルクン ep3：音楽編"};
const ALPACAS=[['ハーリー','../img/characters/harly.png','ズコーッ！と勢いよくすっ転ぶ'],['サラバンジ','../img/characters/sarabanji.png','バタン！と倒れ、3秒後にムクッ'],['ガンジュー','../img/characters/ganjuu.png','立ったままいびき。肩を叩かれて起きる'],['カーギー','../img/characters/carggy.png','前髪を鏡なしでピシッと直す']];
const M={chinen:['知念おじぃさん','🧓'],tokue:['仲程のヨシおばぁさん','👵'],rikiya:['力也おじぃさん','🧓'],misaki:['マタグワァのシズおばぁさん','👵']};
const slides=['intro','trouble','mentor','verify','imagine','checkin','parent'];const list=typeof GURUKUN_EPISODES!=='undefined'?GURUKUN_EPISODES:[];const idx=list.findIndex(e=>e.id==='gurukun-ep'+D.n);const prev=idx>0?list[idx-1]:null,next=idx>=0&&idx<list.length-1?list[idx+1]:null;
function App(){const [cur,setCur]=useState(0),[three]=useState(()=>[0,1,2,3].sort(()=>Math.random()-.5).slice(0,3)),[guess,setGuess]=useState(null),[answer,setAnswer]=useState(null),[reflection,setReflection]=useState(''),[imagine,setImagine]=useState(''),[name,setName]=useState(''),[furigana,setFurigana]=useState(true);const mentor=D.mentor==='all'?['4人のメンター','👪']:M[D.mentor];

const Mentor=()=> <div className="space-y-5"><div className="text-center text-5xl">{mentor[1]}</div><h2 className="text-xl font-bold text-amber-700 text-center">{mentor[0]}が教えてくれた</h2><div className="bg-amber-50 rounded-lg p-5"><p>{D.mentorText}</p></div><div className="grid gap-2 text-sm">{Object.entries(M).filter(([k])=>D.mentor==='all'||k!==D.mentor).slice(0,D.mentor==='all'?4:3).map(([k,m])=><p key={k} className="bg-gray-50 p-3 rounded">{m[0]}「それぞれの知能の窓からも確かめてみよう」</p>)}</div></div>;
const Verify=()=> <div className="space-y-5"><h2 className="text-2xl font-bold text-green-600 text-center">✅ やってみよう</h2><p className="bg-green-50 p-4 rounded">{D.verify}</p><div className="grid gap-2">{D.options.map((x,i)=><button key={x} onClick={()=>setAnswer(i)} className={'choice-card p-3 rounded-lg border-2 text-left '+(answer===i?'border-green-500 bg-green-50':'border-gray-200')}>{x}</button>)}</div>{answer!==null&&<div className="bg-gray-100 p-4 rounded text-sm">{D.correct===null?'どの選択にも正解・不正解はないよ。選んだ理由を大切にしよう。':answer===D.correct?'⭕ 資料と活動の目的に合った選び方だね。':'もう一度、メンターの説明と安全・尊重の約束を確かめよう。'}</div>}</div>;
const Imagine=()=> <div className="space-y-5"><h2 className="text-2xl font-bold text-pink-600 text-center">💭 想像する</h2><p className="bg-pink-50 p-5 rounded">{D.imagine}</p><textarea value={imagine} onChange={e=>setImagine(e.target.value)} rows="4" className="w-full border rounded p-3" placeholder="きみの考え（正解は一つではありません）"/></div>;
const Checkin=()=> <div className="space-y-5"><h2 className="text-2xl font-bold text-teal-600 text-center">🙋 ふりかえり</h2><textarea value={reflection} onChange={e=>setReflection(e.target.value)} rows="4" className="w-full border rounded p-3" placeholder="今日、心に残ったこと"/><p className="bg-indigo-50 p-4 rounded text-sm text-center">{D.n==='09'?'グルクンシリーズは、ここで一区切りです。ありがとう。':'次回はep'+(Number(D.n)+1)+'へ進むよ。'}</p></div>;
const Parent=()=> <div className="space-y-4"><h2 className="text-2xl font-bold text-yellow-700 text-center">🎬 おわりに</h2><div className="bg-orange-50 p-4 rounded"><p className="text-xs font-bold text-orange-700">🧑‍🎓 児童生徒のみなさんへ</p><p className="text-sm">{D.student}</p></div><div className="bg-yellow-50 p-4 rounded"><p className="text-xs font-bold">👪 保護者・支援者の方へ（学習指導要領との対応）</p><ul className="text-xs list-disc list-inside">{D.standards.map(x=><li key={x}>{x}</li>)}</ul>{D.notes.map(x=><p key={x} className="text-xs text-gray-500 mt-2">※ {x}</p>)}</div>{D.sources.length>0&&<div className="bg-yellow-50 p-4 rounded"><p className="text-xs font-bold">📚 出典・参考資料</p><ul className="text-xs list-disc list-inside">{D.sources.map(s=><li key={s.url}><a className="text-blue-600 underline" href={s.url} target="_blank" rel="noopener noreferrer">{s.label}</a></li>)}</ul></div>}<div className="bg-white border-2 border-dashed p-4 rounded"><input value={name} onChange={e=>setName(e.target.value)} className="w-full border rounded p-2 mb-2" placeholder="名前（任意）"/><button onClick={()=>window.print()} className="w-full bg-yellow-500 text-white rounded p-2">学習記録シートを印刷</button></div><div className="border-t pt-4"><div className="flex gap-2">{prev?<a className="flex-1 border p-2 rounded text-center" href={'../'+prev.url}>← {prev.short}</a>:<span className="flex-1 border p-2 text-gray-300 text-center">最初</span>}{next?<a className="flex-1 bg-orange-500 text-white p-2 rounded text-center" href={'../'+next.url}>{next.short} →</a>:<span className="flex-1 border p-2 text-gray-300 text-center">最終話</span>}</div><a className="block text-center underline text-orange-600 mt-2" href="../matrix-library.html">他のテーマも見る（教材一覧）</a></div><div className="border-t border-dashed pt-4"><a className="block text-center bg-gray-700 text-white rounded-full p-2" href={FEEDBACK_FORM_URL}>💬 ご意見・ご要望</a></div></div>;
const views={intro:Intro,trouble:Trouble,mentor:Mentor,verify:Verify,imagine:Imagine,checkin:Checkin,parent:Parent},View=views[slides[cur]];return <div className={'min-h-screen bg-orange-50 '+(furigana?'':'furigana-off')}><main className="max-w-2xl mx-auto p-4 sm:p-6"><div className="flex justify-between mb-4"><a href="../matrix-library.html">← 教材一覧</a><button onClick={()=>setFurigana(!furigana)} className="border rounded px-2">🔤 ふりがな {furigana?'ON':'OFF'}</button></div><header className="text-center mb-5"><p className="text-xs text-indigo-500 font-bold">知能の窓・グルクン ep{Number(D.n)}：{D.kind}</p><h1 className="text-2xl font-bold text-orange-600">{D.title} 🐟</h1></header><div className="mb-4"><div className="h-2 bg-gray-200 rounded"><div className="h-2 bg-orange-500 rounded" style={{width:((cur+1)/7*100)+'%'}}/></div></div><section className="bg-white rounded-lg shadow-lg p-4 sm:p-6 md:p-8 mb-6 min-h-96"><View/></section>{slides[cur]==='parent'&&<div className="bg-orange-50 border p-4 rounded mb-5 text-center"><p className="font-bold text-orange-700">🌱 制作をアシストする</p><p className="text-xs my-2">ここでの学びは、記録され、次の学びへと受け継がれていきます。その循環を支えるちからになっていただけたら嬉しいです。</p>{SUPPORT_LINKS.map(s=><a key={s.label} className="inline-block border rounded-full px-3 py-1 m-1" href={s.url}>{s.label}</a>)}<a className="block text-xs underline mt-2" href="../tokushoho.html">特定商取引法に基づく表記</a></div>}<nav className="flex justify-between items-center"><button disabled={cur===0} onClick={()=>setCur(cur-1)} className="px-3 sm:px-5 py-3 bg-orange-500 text-white rounded disabled:bg-gray-200">まえへ</button><div className="progress-dots space-x-2">{slides.map((x,i)=><i key={x} className={'w-2 h-2 rounded-full '+(i===cur?'bg-orange-500':'bg-gray-300')}/>)}</div><button disabled={cur===6||slides[cur]==='trouble'&&guess===null} onClick={()=>setCur(cur+1)} className="px-3 sm:px-5 py-3 bg-orange-500 text-white rounded disabled:bg-gray-200">{slides[cur]==='checkin'?'おわりに':'つぎへ'}</button></nav></main><div className="print-sheet w-[700px] p-10 bg-white"><h1 className="text-xl font-bold">学習記録シート</h1><p>教材：{D.title}（{D.series}）</p><p>名前：{name||'＿＿＿＿＿＿'}</p><p>想像する問題：{imagine||'（記入なし）'}</p><p>ふりかえり：{reflection||'（記入なし）'}</p></div></div>}
createRoot(document.getElementById('root')).render(<App/>);</script></body></html>
