<body>
    <div id="root"></div>

        const Sparkles = ({ className }) => (

        // 4キャラクターのデータ（予想・理由・スピンオフ台本）
        const CHARACTERS = {

            predict: { count: 32 },
            line: "シーサー作りっしょ?オレに任せろ!今ある分とか気にしてたらキリないっしょ、32体作れば安心っしょ!",
            reasonAfter: "工房にもう完成品があること、うっかり忘れてた…全部新しく作るつもりで、勢いで数字言っちゃった。",
            spinoff: [
              "ハーリー「シーサー作りっしょ?オレに任せろ!」",
              "ハーリー「32体作れば安心っしょ!」",

            predict: { count: 7 },

            reasonAfter: "軒数と体数、ごっちゃにして引き算しちゃった。一発勝負にこだわって、じっくり考えなかった。",
            spinoff: [
              "サラバンジ「計算か…一発で終わらせるさ」",
              "サラバンジ「16から9引いて…7体!」",
              "知念おじぃさん「ブッブー」",

              "サラバンジ（息切れ）「32体…そこから23体引いて…9体…当たった…」",
              "知念おじぃさん「一発勝負、今度は成功だね」",
              "サラバンジ「次の窯出しも…一瞬で…たぶん」"
            ]
          },
          gan: {
            name: "ガンジュー", color: "green", emoji: "😴", img: "../img/characters/ganjuu.png",
            predict: { count: 14 },
            line: "さっきの獅子の話、まだ引きずってて…獅子は百獣の王だから、きっと多めにいる気がして…えっと、メスが14体あるから、それと同じ数で…14体、だと思います…",
            reasonAfter: "獅子（本当はシーサー）は特別に多く必要な気がして、なんとなく在庫の数字と同じ数を答えちゃった…ちゃんと引き算するの、忘れてた…",
            spinoff: [

              "知念おじぃさん「ブッブー。獅子じゃなくてシーサーだよ。まず全部で何体必要か、それから今ある数を引くんだよ」",
              "ガンジュー（あくび）「32体から…23体引いて…」",
              "（ガンジュー、正解を答える直前に立ったまま本気のいびき→知念おじぃさんに肩を叩かれてハッと飛び起きる）",
              "ガンジュー（半分寝ながら）「9体…です…」",
              "知念おじぃさん「正解」",
              "ガンジュー「粘土こねるの…疲れました…（あくび）」"
            ]
          },
          kaa: {
            name: "カーギー", color: "purple", emoji: "💁‍♀️", img: "../img/characters/carggy.png",
            predict: { count: 23 },
            line: "粘土の重さや、焼く日数は、今回は関係なさそうですね。…16軒×2体で32体必要。今ある9体を引くと、あと23体だと思います。",
            reasonAfter: "計算の仕方は合っていたのに、棚を数えるとき、オスの9体だけ見てメスの14体を数え忘れちゃった。急いでいたから、半分だけ確認して安心しちゃった。",
            spinoff: [
              "カーギー「粘土の重さや、窯で焼く日数は、今回は使わない方が確実ですね」（登場直後、風で乱れた前髪を鏡もなしに一瞬でピシッと直す）",
              "カーギー「16軒×2体で32体必要。今ある9体を引くと…あと23体ですね」",
              "知念おじぃさん「惜しいねぇ。棚、もう一回よく見てごらん」",
              "カーギー（在庫を数え直す）「あ…メスが14体もある。見落としてました」",
              "知念おじぃさん「そう、オスとメス、両方引かなきゃね」",
              "カーギー（きれいにまとめながら）「32－23で、9体ですね」",
              "知念おじぃさん「よくできたね」",
              "カーギー「次は阿形と吽形の表情も、きれいに整えて作ります」"
            ]
          }
        };
        const ALL_KEYS = ["hari", "sara", "gan", "kaa"];

        // 4メンター（おじぃさん・おばぁさん）。多重知能8分類を2つずつ担当する案内役。画像素材が無いため常に絵文字アバター
        const MENTORS = {
          chinen: { name: "知念おじぃさん", role: "智（論理・言語）", color: "amber", emoji: "🧓" },
          tokue: { name: "仲程のヨシおばぁさん", role: "徳（対人・内省）", color: "rose", emoji: "👵" },
          rikiya: { name: "力也おじぃさん", role: "体（音楽・運動）", color: "teal", emoji: "🧓" },
          misaki: { name: "美咲おばぁさん", role: "感（視覚空間・博物学）", color: "indigo", emoji: "👵" }
        };

        const COLOR_MAP = {
          red: { bg: "bg-red-50", border: "border-red-300", text: "text-red-700", solid: "bg-red-500" },
          blue: { bg: "bg-blue-50", border: "border-blue-300", text: "text-blue-700", solid: "bg-blue-500" },
          green: { bg: "bg-green-50", border: "border-green-300", text: "text-green-700", solid: "bg-green-500" },
          purple: { bg: "bg-purple-50", border: "border-purple-300", text: "text-purple-700", solid: "bg-purple-500" },
          amber: { bg: "bg-amber-50", border: "border-amber-300", text: "text-amber-700", solid: "bg-amber-500" },
          rose: { bg: "bg-rose-50", border: "border-rose-300", text: "text-rose-700", solid: "bg-rose-500" },
          teal: { bg: "bg-teal-50", border: "border-teal-300", text: "text-teal-700", solid: "bg-teal-500" },
          indigo: { bg: "bg-indigo-50", border: "border-indigo-300", text: "text-indigo-700", solid: "bg-indigo-500" }
        };

        // キャラ画像。読み込めない場合は絵文字アバターにフォールバックする
        const Avatar = ({ charKey }) => {
          const c = CHARACTERS[charKey];
          const [failed, setFailed] = useState(false);
          if (failed) {
            return (
              <div className={`chara-avatar flex items-center justify-center text-2xl ${COLOR_MAP[c.color].bg}`}>
                {c.emoji}
              </div>
            );
          }
          return (
            <img
              src={c.img}
              alt={c.name}
              className="chara-avatar"
              onError={() => setFailed(true)}
            />
          );
        };

        // メンターの絵文字アバター（画像素材が無いため常に絵文字）
        const MentorAvatar = ({ mentorKey }) => {
          const m = MENTORS[mentorKey];
          return (
            <div className={`chara-avatar flex items-center justify-center text-2xl ${COLOR_MAP[m.color].bg}`}>
              {m.emoji}
            </div>
          );
        };

        function shuffledThree() {
          const arr = [...ALL_KEYS];
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr.slice(0, 3);
        }

        // COCOLOプラン（ホームスクーラー等の学習記録）向けの教材メタ情報
        const MATERIAL = {
          title: "シーサーは、あと何体たりない？",
          series: "知能の窓：博物学・言語編",
          subjectGrade: "算数4年・社会4年"
        };

        // ミルクボーイ風の掛け合い（ボケ→違う候補→やっぱり違う→正解に着地）
        // ここで出る「獅子・こま犬」は、後の計算パートのトラップ情報（ガンジューの誤答理由・気をつけての注記）と接続している
        const GAG_LINES = [
          { speaker: "hari", text: "なんか、村の入口の石の生き物が壊れたらしいっしょ！大変っしょ！" },
          { speaker: "sara", text: "ああ、あれか。名前なんだっけ…獅子？" },
          { speaker: "hari", text: "獅子じゃないっしょ！たしかにライオンっぽい顔してるけど、獅子じゃないっしょ！" },
          { speaker: "sara", text: "じゃあ虎？" },
          { speaker: "hari", text: "虎でもないっしょ！けど気持ちはわかるっしょ、あの牙とかそんな感じだから！" },
          { speaker: "sara", text: "あ、わかった、こま犬！" },
          { speaker: "hari", text: "こま犬でもないっしょ！似てるけど違うっしょ！こま犬は神社にいるやつっしょ！これは家の屋根とか村の入口にいて、悪いもの追い払って、福を呼び込む、あの…" },
          { speaker: "sara", text: "シーサーやないかい！" },
          { speaker: "hari", text: "それっしょ！！" },
        ];

        const ShisaPredictionApp = () => {
          const [threeKeys] = useState(() => shuffledThree());
          const [bonusKey] = useState(() => {
            if (Math.random() >= 0.35) return null; // 35%の確率でスピンオフ出現
            return ALL_KEYS[Math.floor(Math.random() * ALL_KEYS.length)];
          });
          const [currentSlide, setCurrentSlide] = useState(0);
          const [guess, setGuess] = useState(null);
          const [imagineAnswer, setImagineAnswer] = useState("");
          const [childName, setChildName] = useState("");
          const [wantOwn, setWantOwn] = useState(null); // 「自分の家にも置いてみたい？」はい・いいえ・わからない
          const [surpriseAnswer, setSurpriseAnswer] = useState("");

          const slideIds = ["intro", "know", "situation", "predict", "discuss", "mentor", "verify", "imagine", "checkin", "bonus", "parent"];
          const total = slideIds.length;

          const nextSlide = () => setCurrentSlide((p) => Math.min(p + 1, total - 1));
          const prevSlide = () => setCurrentSlide((p) => Math.max(p - 1, 0));

          const renderIntro = () => (
            <div className="space-y-6">
              <div className="text-center">
                <div className="text-6xl mb-4">🦁</div>
                <h2 className="text-2xl font-bold text-orange-600">村の入り口のシーサー像が、割れていた</h2>
                <span className="inline-block mt-2 px-3 py-1 text-xs font-bold rounded-full bg-orange-100 text-orange-700">📚 {MATERIAL.subjectGrade}</span>
              </div>
              <div className="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-6 space-y-3">
                <p>朝、工房のおばあが表に出ると、村の入り口に立つ大きな共同のシーサー像の顔が、大きくひび割れていました。「これは、村を守る力が弱くなっている証拠かもしれない」と、村のみんなが心配しはじめました。</p>
                <p><strong>お祭りまで、あと5日</strong>。村を守る力を取り戻そうと、近くの家々から「うちにも新しい一対を置きたい」と、急な注文が次々に来ました。</p>
                <p className="font-bold text-orange-700">そもそも、シーサーって何だろう？　まずは、そこから知っていこう。</p>
              </div>
            </div>
          );

          const renderKnow = () => (
            <div className="space-y-6">
              <div className="text-center">
                <div className="text-4xl mb-2">📖</div>
                <h2 className="text-xl font-bold text-red-600">ステップ1：シーサーを知ろう</h2>
                <p className="text-gray-600 text-sm mt-1">村がざわつく中、ハーリーとサラバンジがモメていた。</p>
              </div>
              <div className="space-y-3">
                {GAG_LINES.map((l, i) => {
                  const c = CHARACTERS[l.speaker];
                  const cc = COLOR_MAP[c.color];
                  const isRight = l.speaker === "sara";
                  return (
                    <div key={i} className={`flex items-start gap-3 ${isRight ? "flex-row-reverse text-right" : ""}`}>
                      <Avatar charKey={l.speaker} />
                      <div className={`speech-bubble flex-1 min-w-0 rounded-lg p-3 bg-white/70 ${cc.text}`}>
                        <p className="text-sm">{l.text}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="bg-red-50 rounded-lg p-4 text-sm text-red-700 text-center">
                <p>そう、これは「シーサー」。じゃあ、シーサーってどこから来て、なぜ一対で置かれるんだろう？</p>
              </div>
              <div className="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-6 space-y-3 text-sm">
                <p><strong>由来</strong>：もともとエジプトやインドで「守り神」として信じられていたライオンの像が、シルクロードを通って中国に伝わり「獅子（しし）」に。それがさらに沖縄へ伝わり、「シーサー」と呼ばれるようになった、と言われています。</p>
                <p><strong>一対で置かれる理由</strong>：沖縄の家の屋根や門には、シーサーが一対（2体で1組）で置かれます。向かって右が口を開けた「阿形（あぎょう）」でオス、左が口を閉じた「吽形（うんぎょう）」でメス。オスは悪いものを追い払い、メスは福を家の中にとどめる役目、と言い伝えられています。</p>
                <p><strong>置かれる場所</strong>：家の屋根の上、門柱、村の入り口など、家や村を守りたい場所に置かれます。</p>
              </div>

          );

          const renderSituation = () => (
            <div className="space-y-6">
              <div className="text-center">
                <div className="text-4xl mb-2">🧮</div>
                <h2 className="text-xl font-bold text-orange-600">ステップ2：状況を整理しよう</h2>
              </div>
              <div className="bg-yellow-50 border-2 border-yellow-200 rounded-lg p-6 space-y-3">
                <p>近くの<strong>16軒</strong>の家から「うちにも一対を置きたい」と注文が来ました。1軒につきオス1体・メス1体、合わせて<strong>2体</strong>が必要です。</p>
                <p>今、工房の棚には、完成したオスが<strong>9体</strong>、メスが<strong>14体</strong>並んでいます。お祭りに間に合わせるには、あと何体、急いで焼けばよいでしょう？</p>
              </div>
              <div className="bg-gray-100 rounded-lg p-4 text-sm text-gray-600">
                <p>気をつけて：粘土の重さ（1体800g）・窯で焼く日数（3日）・シーサーの色、それに「神社の狛犬も一対（2体）で奉納される」という話は、どれもこの問題を解くのには関係ありません。</p>
              </div>
            </div>
          );

          const renderPredict = () => (
            <div className="space-y-6">
              <div className="text-center">
                <div className="text-5xl mb-4">🤔</div>
                <h2 className="text-xl font-bold text-blue-600 mb-1">ステップ3：予想して、確かめよう</h2>
                <p className="text-lg font-bold text-blue-600 mb-2">時間がない！3人のアルパカが急いで予想したよ</p>
                <p className="text-gray-600">お祭りまで5日しかない。きみは、誰の予想が正しいと思う？クリックして選んでみよう。</p>
              </div>
              <div className="grid gap-4">
                {threeKeys.map((key) => {
                  const c = CHARACTERS[key];
                  const cc = COLOR_MAP[c.color];
                  const selected = guess === key;
                  return (
                    <div
                      key={key}
                      onClick={() => setGuess(key)}
                      className={`choice-card p-4 rounded-lg border-2 cursor-pointer transition-all ${cc.bg} ${
                        selected ? `${cc.border} ring-2 ring-offset-1 ring-${c.color}-400` : "border-gray-200 hover:border-gray-300"

                    >
                      <div className="choice-row">
                        <Avatar charKey={key} />
                        <div className={`speech-bubble flex-1 min-w-0 rounded-lg p-3 ${cc.text} bg-white/70`}>
                          <p className={`font-bold ${cc.text}`}>{c.name}編の予想：あと{c.predict.count}体</p>
                          <p className="text-sm text-gray-700 mt-1">「{c.line}」</p>
                        </div>
                        {selected && (
                          <div className={`choice-check w-7 h-7 rounded-full ${cc.solid} flex items-center justify-center text-white text-sm shrink-0`}>✓</div>

                      </div>
                    </div>
                  );
                })}
              </div>
              {!guess && <p className="text-center text-sm text-orange-500">↑ どれか1つを選ぶと、次に進めるよ</p>}

          );

          const renderDiscuss = () => (
            <div className="space-y-6">
              <div className="text-center">
                <div className="text-5xl mb-4">💬</div>
                <h2 className="text-2xl font-bold text-purple-600">どうしてその数字になったのかな？</h2>
              </div>
              <div className="space-y-3">
                {threeKeys.map((key) => {
                  const c = CHARACTERS[key];
                  const cc = COLOR_MAP[c.color];
                  const isYourPick = guess === key;
                  return (
                    <div key={key} className={`flex items-start gap-3 p-3 rounded-lg border-2 ${cc.bg} ${isYourPick ? cc.border : "border-transparent"}`}>
                      <Avatar charKey={key} />
                      <div className={`speech-bubble flex-1 min-w-0 rounded-lg p-3 bg-white/70 ${cc.text}`}>
                        <p className={`font-bold ${cc.text}`}>{c.name}{isYourPick ? "（きみが選んだ予想）" : ""}</p>
                        <p className="text-sm text-gray-700 mt-1">{c.reasonAfter}</p>
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="bg-blue-50 rounded-lg p-4 text-sm text-blue-800">
                <p>3人の予想、それぞれ理由があったね。次は、メンターに聞いてみよう。</p>
              </div>
            </div>
          );

          const renderMentor = () => (
            <div className="space-y-6">
              <div className="text-center">
                <div className="text-5xl mb-4">🧓</div>
                <h2 className="text-xl font-bold text-amber-600">知念おじぃさんが教えてくれた</h2>
              </div>
              <div className={`rounded-lg p-4 space-y-2 ${COLOR_MAP.amber.bg}`}>
                <div className="flex items-center gap-3 mb-1">
                  <MentorAvatar mentorKey="chinen" />
                  <p className="font-bold text-amber-700">{MENTORS.chinen.name}</p>
                </div>
                <p className="text-sm text-gray-700">「みんな焦って、バラバラの数字を言ってたねぇ。こういうときは、2つだけ順番に考えればいいんだよ」</p>
                <p className="text-sm text-gray-700">「1つ目：全部で何体いるか、まず数える。16軒に、1軒2体ずつだから…かけ算だね。16×2＝32体」</p>
                <p className="text-sm text-gray-700">「2つ目：今もう棚にある分を、そこから引く。オス9体とメス14体、両方だよ。32－23＝あと9体。これが答えさ」</p>
              </div>
              <div className="grid gap-3">
                <div className={`flex items-start gap-3 p-3 rounded-lg ${COLOR_MAP.rose.bg}`}>
                  <MentorAvatar mentorKey="tokue" />
                  <p className="text-sm text-rose-700">「焦った気持ち、みんなよくわかるよ。まずは深呼吸ね」</p>
                </div>
                <div className={`flex items-start gap-3 p-3 rounded-lg ${COLOR_MAP.teal.bg}`}>
                  <MentorAvatar mentorKey="rikiya" />
                  <p className="text-sm text-teal-700">「よし、リズムに乗って数えてみるかー！じゅう・ろく…かける…にー…あ、電卓使お」</p>
                </div>
                <div className={`flex items-start gap-3 p-3 rounded-lg ${COLOR_MAP.indigo.bg}`}>
                  <MentorAvatar mentorKey="misaki" />
                  <p className="text-sm text-indigo-700">「シーサーの由来の話は、さっき聞いたね。今日は数える方に集中しよっか」</p>
                </div>
              </div>
            </div>
          );

          const renderVerify = () => {
            const guessedCharacter = guess ? CHARACTERS[guess] : null;
            return (
              <div className="space-y-6">
                <div className="text-center">
                  <div className="text-5xl mb-4">✅</div>
                  <h2 className="text-2xl font-bold text-green-600">知念おじぃさんの方法で確かめよう</h2>
                </div>
                <div className="bg-green-50 border-2 border-green-200 rounded-lg p-6 space-y-2 text-sm">
                  <p>1つ目（かけ算）：16軒×2体（オス1・メス1）＝<strong>32体</strong>必要</p>
                  <p>2つ目（ひき算）：今ある数、オス9体＋メス14体＝23体を引く。32－23＝<strong>あと9体</strong></p>
                  <p className="text-gray-500 text-xs">粘土の重さ・焼く日数・シーサーの色は、この計算には使わない。</p>
                </div>
                {guessedCharacter && (
                  <div className="rounded-lg p-4 text-center bg-gray-100">
                    {guess === "kaa" ? (
                      <p className="font-bold text-gray-700">きみが選んだカーギーの予想は、考え方は合っていたけど、棚の在庫を数え忘れて「あと23体」になっていたね。</p>
                    ) : (
                      <p className="font-bold text-gray-700">きみが選んだ{guessedCharacter.name}編の予想（あと{guessedCharacter.predict.count}体）は、正解の「あと9体」とは違っていたね。どこで数字がズレたか、見直してみよう。</p>
                    )}
                  </div>
                )}
                <div className="bg-orange-50 rounded-lg p-4 text-sm text-orange-800">
                  <p>9体、あと5日で焼き上げれば、お祭りまでに16軒すべてに新しいシーサーが届く。村の入り口の像も、お祭りの日までに直すことになった。村の守りは、間に合いそうだ。</p>
                </div>
              </div>
            );
          };

          const renderImagine = () => (
            <div className="space-y-6">
              <div className="text-center">
                <div className="text-5xl mb-4">💭</div>
                <h2 className="text-2xl font-bold text-pink-600">想像してみよう</h2>
              </div>
              <div className="bg-pink-50 rounded-lg p-6">
                <p className="text-lg">もし、きみの家の門にシーサーを一対置くとしたら、悪いものを追い払うオス（阿形）と、福を家の中にとどめるメス（吽形）、それぞれどんな表情にしたい？</p>
                <p className="text-sm text-gray-500 mt-2">（怖い顔・やさしい顔・笑った顔…正解は一つじゃないよ）</p>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">きみの考えを書いてみよう（学習記録シートに残せるよ）</label>
                <textarea
                  className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm"
                  rows="3"
                  placeholder="例：オスは強そうな怖い顔、メスはにっこり笑った顔にしたい"
                  value={imagineAnswer}
                  onChange={(e) => setImagineAnswer(e.target.value)}
                ></textarea>
              </div>
            </div>
          );

          const renderCheckin = () => (
            <div className="space-y-6">
              <div className="text-center">
                <div className="text-5xl mb-4">🙋</div>
                <h2 className="text-2xl font-bold text-teal-600">ふりかえり</h2>
              </div>
              <div className="bg-teal-50 rounded-lg p-6">
                <p className="font-medium text-teal-800 mb-3">✏️ 自分の家にもシーサーを置いてみたいと思った？</p>
                <div className="flex flex-wrap gap-2">
                  {["はい", "いいえ", "わからない"].map((opt) => (
                    <button
                      key={opt}
                      onClick={() => setWantOwn(opt)}
                      className={`px-4 py-2 rounded-lg font-bold border-2 transition ${
                        wantOwn === opt ? "bg-teal-500 text-white border-teal-500" : "bg-white text-teal-700 border-teal-200"
                      }`}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">✏️ 今日知ったことで、一番びっくりしたことを書いてみよう</label>
                <textarea
                  className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-400 text-sm"
                  rows="3"
                  placeholder="例：シーサーがエジプトのライオンから来てるなんて知らなかった"
                  value={surpriseAnswer}
                  onChange={(e) => setSurpriseAnswer(e.target.value)}
                ></textarea>
              </div>
            </div>
          );

          const renderBonus = () => (
            <div className="space-y-6">
              <div className="text-center">
                <div className="text-5xl mb-4">{bonusKey ? "🎬" : "🌤️"}</div>
                <h2 className="text-2xl font-bold text-indigo-600 flex items-center justify-center gap-2">
                  {bonusKey ? <>ひみつのスピンオフ <Sparkles className="w-6 h-6 text-yellow-400" /></> : "今日はスピンオフはお休み"}
                </h2>
              </div>
              {bonusKey ? (
                <div className={`rounded-lg p-4 space-y-2 text-sm ${COLOR_MAP[CHARACTERS[bonusKey].color].bg}`}>
                  <div className="flex items-center gap-3 mb-2">
                    <Avatar charKey={bonusKey} />
                    <p className={`font-bold ${COLOR_MAP[CHARACTERS[bonusKey].color].text}`}>
                      {CHARACTERS[bonusKey].name}編フルストーリー（レア出現）
                    </p>
                  </div>
                  {CHARACTERS[bonusKey].spinoff.map((line, i) => (
                    <p key={i} className={line.startsWith("（") ? "text-xs text-gray-400 italic" : ""}>{line}</p>
                  ))}
                </div>
              ) : (
                <div className="bg-gray-100 rounded-lg p-6 text-center text-gray-500">
                  <p>スピンオフは、たまにしか出てこないよ。また今度チェックしてみてね。</p>
                </div>
              )}
            </div>
          );

          const renderParent = () => (
            <div className="space-y-4">
              <div className="text-center">
                <div className="text-5xl mb-4">👪</div>
                <h2 className="text-2xl font-bold text-yellow-700">保護者・支援者の方へ</h2>
              </div>
              <div className="bg-yellow-50 rounded-lg p-4">
                <p className="text-xs font-bold text-yellow-800 mb-2">学習指導要領との対応</p>
                <ul className="text-xs text-gray-700 space-y-1 list-disc list-inside">
                  <li><strong>算数（4年）</strong>：整数の四則混合計算、大きい数の処理、必要量から所持量を引く「不足分」の考え方</li>
                  <li><strong>社会（4年〜）</strong>：地域の伝統工芸・郷土文化、暮らしと信仰の結びつき</li>
                  <li><strong>道徳・特別活動</strong>：異なる役割を持つもの同士が対になって家を守る、という考え方への気づき</li>
                </ul>
                <p className="text-xs text-gray-500 mt-2">※ この教材は「仮説実験授業」の型（予想する→理由を話し合う→確かめる）を採用しています。3人のアルパカの予想はランダムに選ばれます。今回は、誰の予想も正解ではありません。「自分たちだけで焦って解こうとすると間違えやすい」「専門家（メンター）に教わって、順序立てて考えると解ける」という体験そのものが、この教材のねらいです。</p>
                <p className="text-xs text-gray-500 mt-1">※ 阿形・吽形とオス・メスの対応や役割の言い伝えは、地域や工房によって解釈が異なる場合があります。本教材では代表的な言い伝えの一つを採用しています。</p>
                <p className="text-xs text-gray-500 mt-1">※ 「村の共同シーサー像が割れていた」という導入部分は、問題に緊張感を持たせるための創作です。実在の出来事ではありません。</p>
              </div>
              <div className="bg-white border-2 border-dashed border-gray-300 rounded-lg p-4">
                <p className="text-xs font-bold text-gray-700 mb-2">🖨️ 学習記録シートを作る（COCOLOプラン等の学習記録用）</p>
                <input
                  type="text"
                  className="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-yellow-400 text-sm mb-2"
                  placeholder="お子さんの名前（記入は任意）"
                  value={childName}
                  onChange={(e) => setChildName(e.target.value)}
                />
                <button
                  onClick={() => window.print()}
                  className="w-full px-4 py-2 bg-yellow-500 text-white rounded-lg font-medium hover:bg-yellow-600 transition-all text-sm"
                >
                  学習記録シートを印刷する
                </button>
                <p className="text-xs text-gray-400 mt-1">今日の日付・対応教科・取り組んだ内容・保護者確認欄が入った1枚のシートが印刷されます。</p>
              </div>
            </div>
          );

          const today = new Date();
          const todayStr = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日`;
          const guessedForSheet = guess ? CHARACTERS[guess] : null;

          const renderPrintSheet = () => (
            <div className="print-sheet w-[700px] p-10 bg-white text-black">
              <h1 className="text-xl font-bold border-b-2 border-black pb-2 mb-4">学習記録シート</h1>
              <table className="w-full text-sm mb-4">
                <tbody>
                  <tr><td className="py-1 pr-4 font-bold w-32">学習日</td><td className="py-1">{todayStr}</td></tr>
                  <tr><td className="py-1 pr-4 font-bold">お子さんの名前</td><td className="py-1">{childName || "＿＿＿＿＿＿＿＿＿＿"}</td></tr>
                  <tr><td className="py-1 pr-4 font-bold">教材名</td><td className="py-1">{MATERIAL.title}</td></tr>
                  <tr><td className="py-1 pr-4 font-bold">対応教科・学年</td><td className="py-1">{MATERIAL.subjectGrade}（道徳・特別活動にも接続）</td></tr>
                </tbody>
              </table>
              <div className="mb-4 text-xs text-gray-700 bg-gray-50 border border-gray-300 rounded p-3">
                <p className="font-bold mb-1">学習指導要領との対応</p>
                <ul className="space-y-0.5 list-disc list-inside">
                  <li>算数（4年）：整数の四則混合計算、大きい数の処理、必要量から所持量を引く「不足分」の考え方</li>
                  <li>社会（4年〜）：地域の伝統工芸・郷土文化、暮らしと信仰の結びつき</li>
                  <li>道徳・特別活動：異なる役割を持つもの同士が対になって家を守る、という考え方への気づき</li>
                </ul>
              </div>
              <div className="mb-4">
                <p className="font-bold text-sm mb-1">1. 自分の予想</p>
                <p className="text-sm border border-gray-400 rounded p-2 min-h-[2.5rem]">
                  {guessedForSheet ? `${guessedForSheet.name}編の予想（あと${guessedForSheet.predict.count}体）を選びました。` : "（記入なし）"}
                </p>
              </div>
              <div className="mb-4">
                <p className="font-bold text-sm mb-1">2. 知念おじぃさんに教わって確かめた答え</p>
                <p className="text-sm border border-gray-400 rounded p-2 min-h-[2.5rem]">あと9体足りない（16軒×2体＝32体必要、今ある9体＋14体＝23体を引く）。</p>
              </div>
              <div className="mb-4">
                <p className="font-bold text-sm mb-1">3. 想像する問題への自分の考え</p>
                <p className="text-sm border border-gray-400 rounded p-2 min-h-[3rem]">{imagineAnswer || "（記入なし）"}</p>
              </div>
              <div className="mt-8 pt-4 border-t border-gray-400">
                <p className="text-sm">保護者確認サイン：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿</p>
              </div>
            </div>
          );

          const slideRenderers = {
            intro: renderIntro,
            know: renderKnow,
            situation: renderSituation,
            predict: renderPredict,
            discuss: renderDiscuss,
            mentor: renderMentor,
            verify: renderVerify,
            imagine: renderImagine,
            checkin: renderCheckin,
            bonus: renderBonus,
            parent: renderParent
          };
          const slideTitles = {
            intro: "🦁 はじまりの問い",
            know: "📖 ステップ1：知る",
            situation: "🧮 ステップ2：整理する",
            predict: "🤔 ステップ3：予想する",
            discuss: "💬 話し合う",
            mentor: "🧓 メンター登場",
            verify: "✅ 確かめる",
            imagine: "💭 想像する",
            checkin: "🙋 ふりかえり",
            bonus: bonusKey ? "🎬 スピンオフ" : "🌤️ スピンオフ",
            parent: "👪 保護者の方へ"
          };

          const canGoNext = !(slideIds[currentSlide] === "predict" && !guess);

          return (
            <div className="min-h-screen bg-gradient-to-br from-orange-50 to-yellow-50">
              <div className="container mx-auto px-4 py-8 max-w-2xl">
                <a href="../matrix-library.html" className="inline-flex items-center gap-1 text-sm font-bold text-orange-500 hover:text-orange-700 mb-4">
                  <ChevronLeft className="w-4 h-4" />教材一覧へ戻る
                </a>
                <div className="text-center mb-6">
                  <p className="text-xs font-bold text-indigo-500 mb-1">{MATERIAL.series}</p>
                  <h1 className="text-2xl md:text-3xl font-bold text-orange-600">シーサーは、あと何体たりない？ 🦁</h1>
                  <span className="inline-block mt-1 px-2 py-0.5 text-xs font-bold rounded-full bg-orange-100 text-orange-700">📚 {MATERIAL.subjectGrade}</span>
                </div>

                <div className="mb-6">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-sm text-gray-600">{slideTitles[slideIds[currentSlide]]}</span>
                    <span className="text-sm text-gray-600">{currentSlide + 1} / {total}</span>
                  </div>
                  <div className="w-full bg-gray-200 rounded-full h-2">
                    <div className="bg-orange-500 h-2 rounded-full transition-all duration-300" style={{ width: `${((currentSlide + 1) / total) * 100}%` }}></div>
                  </div>
                </div>

                <div className="bg-white rounded-lg shadow-lg p-4 sm:p-6 md:p-8 mb-6 min-h-96">
                  {slideRenderers[slideIds[currentSlide]]()}
                </div>

                <div className="flex justify-between items-center">
                  <button
                    onClick={prevSlide}
                    disabled={currentSlide === 0}
                    className={`flex items-center px-3 sm:px-5 py-3 rounded-lg font-medium transition-all ${
                      currentSlide === 0 ? "bg-gray-200 text-gray-400 cursor-not-allowed" : "bg-orange-500 text-white hover:bg-orange-600"
                    }`}
                  >
                    <ChevronLeft className="w-5 h-5 mr-1" />まえへ
                  </button>
                  <div className="progress-dots space-x-2">
                    {slideIds.map((id, index) => (
                      <div key={id} className={`w-2.5 h-2.5 rounded-full ${index === currentSlide ? "bg-orange-500" : "bg-gray-300"}`} />
                    ))}
                  </div>
                  <button
                    onClick={nextSlide}
                    disabled={currentSlide === total - 1 || !canGoNext}
                    className={`flex items-center px-3 sm:px-5 py-3 rounded-lg font-medium transition-all ${
                      currentSlide === total - 1 || !canGoNext ? "bg-gray-200 text-gray-400 cursor-not-allowed" : "bg-orange-500 text-white hover:bg-orange-600"
                    }`}
                  >
                    つぎへ<ChevronRight className="w-5 h-5 ml-1" />
                  </button>
                </div>
              </div>
              {renderPrintSheet()}
            </div>
          );
        };

        createRoot(document.getElementById("root")).render(<ShisaPredictionApp />);
    </script>
</body>
</html>
